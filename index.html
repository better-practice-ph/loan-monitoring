function renderPostRows(){
  const month=readMonthYear('pM')||currentMonthName();
  const active=STORE.loans.filter(l=>l.status==="active").sort((a,b)=>a.employee.localeCompare(b.employee)||a.agency.localeCompare(b.agency));
  document.getElementById("postRows").innerHTML=active.map(l=>{
    const existing=STORE.entries.find(e=>e.loanId===l.id&&e.applicableMonth===month);
    const locked=!!existing;
    return `<tr data-loan="${l.id}" data-s-employee="${esc(l.employee)}" data-s-agency="${agencyDisp(l.agency)}" data-s-loanType="${esc(l.loanType)}" data-s-monthly="${typeof l.monthlyAmort==="number"?l.monthlyAmort:""}" data-s-status="${locked?"posted":"not posted"}">
      <td>${esc(l.employee)}${empIsInactive(l.employee)?" "+empStatusPill(l.employee):""}${l.reference?`<div class="hintline">${esc(l.reference)}</div>`:''}${l.code?`<div class="hintline">${esc(l.code)}</div>`:''}</td><td>${agencyPill(l.agency)}</td><td>${typePill(l.loanType)+seqPill(l)}</td>
      <td class="num">${typeof l.monthlyAmort==="number"?peso(l.monthlyAmort):'<span class="muted">&#8211;</span>'}</td>
      <td><input type="text" inputmode="decimal" class="pH1" aria-label="1st-15th amount for ${esc(l.employee)}" ${locked?'disabled':''} placeholder="${typeof l.monthlyAmort==='number'?(l.monthlyAmort/2).toFixed(2):'0.00'}"></td>
      <td><input type="text" inputmode="decimal" class="pH2" aria-label="16th-30th amount for ${esc(l.employee)}" ${locked?'disabled':''} placeholder="${typeof l.monthlyAmort==='number'?(l.monthlyAmort/2).toFixed(2):'0.00'}"></td>
      <td><input type="text" inputmode="decimal" class="pTot" aria-label="Total amount for ${esc(l.employee)}" ${locked?'disabled':''} placeholder="optional"></td>
      <td>${locked?`<span class="pill ok">posted ${peso(appliedOf(existing))}</span>`:'<span class="muted">not posted</span>'}</td></tr>`;
  }).join("")||'<tr><td colspan="8" class="muted" style="padding:16px">No active loans.</td></tr>';
  postSortDom(); postKeysInit(); postFilter(); postSum();
}
/* ---- keyboard handling for the posting grid ---- */
const POST_COLS=["pH1","pH2","pTot"];
function postVisInputs(cls){ return [...document.querySelectorAll("#postRows tr[data-loan]")].filter(tr=>tr.style.display!=="none").map(tr=>tr.querySelector("."+cls)).filter(i=>i&&!i.disabled); }
function postFocus(el){ if(el){ el.focus(); try{ el.select(); }catch(e){ swallow("postFocus",e); } el.scrollIntoView({block:"nearest"}); } }
function postFilter(){ const q=((document.getElementById("pSearch")||{}).value||"").toLowerCase().trim(); let hid=0;
  document.querySelectorAll("#postRows tr[data-loan]").forEach(tr=>{ const l=loanById(tr.dataset.loan), show=!q||(l&&loanMatch(l,q)); tr.style.display=show?"":"none"; if(!show)hid++; });
  postSum(hid); }
function postSum(hid){ const el=document.getElementById("pSum"); if(!el)return; let n=0,t=0;
  document.querySelectorAll("#postRows tr[data-loan]").forEach(tr=>{ const g=c=>{ const i=tr.querySelector("."+c); if(!i||i.disabled)return null; const v=i.value.trim().replace(/,/g,""); if(v==="")return null; const x=Number(v); return isNaN(x)?null:x; };
    const a=g("pH1"),b=g("pH2"),c=g("pTot"); if(a===null&&b===null&&c===null)return; n++; t+=(c!==null?c:(a||0)+(b||0)); });
  if(hid===undefined)hid=[...document.querySelectorAll("#postRows tr[data-loan]")].filter(tr=>tr.style.display==="none").length;
  el.innerHTML=n?`<b>${n}</b> row${n===1?"":"s"} filled, about <b>${peso(round2(t))}</b>${hid?` <span class="muted">(${hid} row${hid===1?"":"s"} hidden by the search are still included)</span>`:""}`:`<span class="muted">No rows filled yet.${hid?" "+hid+" hidden by the search.":""}</span>`; }
function postKeysInit(){ const body=document.getElementById("postRows"); if(!body||body._kb)return; body._kb=true;
  body.addEventListener("input",()=>postSum());
  body.addEventListener("focusin",e=>{ if(e.target.matches&&e.target.matches("input")){ try{ e.target.select(); }catch(x){ swallow("postKeys select",x); } } });
  body.addEventListener("keydown",e=>{ const t=e.target; if(!(t&&t.matches&&t.matches("input.pH1,input.pH2,input.pTot")))return;
    const cls=POST_COLS.find(c=>t.classList.contains(c)), list=postVisInputs(cls), i=list.indexOf(t);
    const move=d=>{ e.preventDefault(); const n=list[i+d]; if(n)postFocus(n); };
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); postMonth(); return; }
    if(e.key==="Enter"){ move(e.shiftKey?-1:1); return; }
    if(e.key==="ArrowDown"){ move(1); return; }
    if(e.key==="ArrowUp"){ move(-1); return; }
    if((e.key==="ArrowRight"&&t.selectionStart===t.value.length)||(e.key==="ArrowLeft"&&t.selectionStart===0)){ const c=POST_COLS.indexOf(cls)+(e.key==="ArrowRight"?1:-1);
      if(c>=0&&c<POST_COLS.length){ const tr=t.closest("tr"), n=tr.querySelector("."+POST_COLS[c]); if(n&&!n.disabled){ e.preventDefault(); postFocus(n); } } return; }
    if(e.key==="Escape"){ t.value=""; postSum(); return; }
    if(e.altKey&&(e.key==="m"||e.key==="M")){ e.preventDefault(); const l=loanById(t.closest("tr").dataset.loan), tot=t.closest("tr").querySelector(".pTot");
      if(l&&typeof l.monthlyAmort==="number"&&tot&&!tot.disabled){ tot.value=String(l.monthlyAmort); postSum(); postFocus(tot); } else toast("This loan has no monthly amortization to fill in."); } });
  if(!document._postSlash){ document._postSlash=true; document.addEventListener("keydown",e=>{ if(STATE.view!=="post")return; const tg=e.target, typing=tg&&/^(input|textarea|select)$/i.test(tg.tagName);
    if(e.key==="/"&&!typing){ const f=document.getElementById("pSearch"); if(f){ e.preventDefault(); f.focus(); f.select(); } }
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&tg&&tg.id==="pSearch"){ e.preventDefault(); postMonth(); } }); }
  const ps=document.getElementById("pSearch"); if(ps&&!ps._kb){ ps._kb=true; ps.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const f=postVisInputs("pH1")[0]||postVisInputs("pTot")[0]; if(f)postFocus(f); } else if(e.key==="Escape"){ ps.value=""; postFilter(); } }); } }
async function postMonthInner(){
  if(!need('pay'))return;
  const month=readMonthYear('pM')||currentMonthName(), ptype=document.getElementById("pType").value;
  let rows=[];
  document.querySelectorAll("#postRows tr[data-loan]").forEach(tr=>{
    const h1i=tr.querySelector(".pH1"), h2i=tr.querySelector(".pH2"), toti=tr.querySelector(".pTot");
    if(!h1i||h1i.disabled)return;
    const pn=v=>{v=(v||"").trim();if(v==="")return null;const n=Number(v.replace(/,/g,""));return isNaN(n)?null:round2(n);};
    const h1=pn(h1i.value),h2=pn(h2i.value),tot=pn(toti.value);
    if(h1===null&&h2===null&&tot===null)return;
    rows.push({loan_id:tr.dataset.loan,applicable_month:month,or_ref:null,first15:h1,second15:h2,total_recorded:tot,payment_type:ptype,remarks:"posted via monthly batch"});
  });
  if(!rows.length){ document.getElementById("postMsg").textContent="Nothing to post. Fill at least one row."; document.getElementById("postMsg").classList.remove("ok"); return; }
  { const pmEl=document.getElementById("postMsg");
    if(postMonth._skip) rows=rows.filter(r=>!postMonth._skip.has(r.loan_id));
    if(!rows.length){ pmEl.classList.remove("ok"); pmEl.textContent="Nothing left to post."; return; }
    const fr=await freshEntries(rows.map(r=>({loanId:r.loan_id,month:r.applicable_month})));
    if(fr.error){ pmEl.classList.remove("ok"); pmEl.textContent="Could not check for payments already posted, so nothing was posted: "+(fr.error.message||fr.error)+" Try again."; return; }
    const taken=rows.filter(r=>fr.map.has(dupKey(r.loan_id,r.applicable_month)));
    if(taken.length){
      const who=taken.map(r=>{ const l=loanById(r.loan_id)||{}; return esc(l.employee||"?")+" ("+agencyDisp(l.agency)+" "+esc(l.loanType||"")+")"; });
      const list=who.slice(0,6).join(", ")+(who.length>6?" and "+(who.length-6)+" more":""), left=rows.length-taken.length;
      if(!left){ confirmModal("Already posted for "+esc(month),`Every row in this batch was already posted for ${esc(month)} (${list}), probably by someone else or from another tab. Nothing was posted twice. The page will refresh.`,null,"OK"); await reloadRender(); return; }
      confirmModal(taken.length+" loan"+(taken.length>1?"s":"")+" already posted for "+esc(month),`Since this page was opened, ${list} ${taken.length>1?"were":"was"} already posted for ${esc(month)}. ${taken.length>1?"They":"It"} will be skipped and the other ${left} will be posted.`,(()=>{ postMonth._skip=new Set(taken.map(r=>r.loan_id)); postMonth(); }),null,"Post the other "+left);
      return; } }
  { const ov=overpayRows(rows.map(r=>({loanId:r.loan_id,amount:entryAmount(r.first15,r.second15,r.total_recorded),month:r.applicable_month})));
    if(ov.length){ const pmEl=document.getElementById("postMsg"), plural=ov.length>1;
      const lines=ov.slice(0,6).map(x=>{ const l=loanById(x.loanId)||{}; return esc(l.employee||"?")+" ("+agencyDisp(l.agency)+" "+esc(l.loanType||"")+"): "+pesoTxt(x.amount)+" against a balance of "+pesoTxt(x.info.room); }).join("<br>")+(ov.length>6?"<br>and "+(ov.length-6)+" more":"");
      const okey=rows.map(r=>r.loan_id+":"+entryAmount(r.first15,r.second15,r.total_recorded)).join(",");
      if(overMode()==="block"){ pmEl.classList.remove("ok"); pmEl.innerHTML="<b>Nothing was posted.</b> "+ov.length+" payment"+(plural?"s":"")+" would go past the remaining balance:<br>"+lines+"<br>Correct "+(plural?"them":"it")+" or clear the row, then post again."; return; }
      if(postMonth._overOk!==okey){ confirmModal(ov.length+" payment"+(plural?"s":"")+" go"+(plural?"":"es")+" past the remaining balance",lines+"<br><br>Post "+(plural?"them":"it")+" anyway?",(()=>{ postMonth._overOk=okey; postMonth(); }),null,"Post anyway"); return; } } }
  const gone=[...new Set(rows.map(r=>(loanById(r.loan_id)||{}).employee).filter(n=>n&&empIsInactive(n)))];
  if(gone.length&&!postMonth._ok){
    confirmModal("Post payments for inactive employees?",`${gone.length===1?"This batch includes a payment for":"This batch includes payments for"} <b>${gone.map(n=>esc(n)+" ("+esc(empStatusLabel(n))+")").join(", ")}</b>. That is fine for a final deduction or settlement, but please check before posting.`,(()=>{ postMonth._ok=true; postMonth().finally(()=>{ postMonth._ok=false; }); }),null,"Post anyway"); return; }
  const cr=await commitPaymentRows(rows,"post_month","Posted "+month);
  if(!cr.ok){ const pm=document.getElementById("postMsg"); pm.classList.remove("ok"); pm.textContent="Post failed: "+cr.msg; return; }
  postMonth._skip=null; postMonth._overOk=null;
  if(cr.queued){ toast(`Sent for approval: ${rows.length} payment${rows.length>1?'s':''} for ${month}. Nothing is posted yet.`); await reloadRender(); return; }
  logAudit("post_month","ledger",month); toast(`Posted ${rows.length} payment${rows.length>1?'s':''} for ${month}`); undoSnack(cr.undoId); await reloadRender();
}
async function postMonth(){ if(postMonth._busy)return; postMonth._busy=true; try{ await postMonthInner(); } finally{ postMonth._busy=false; } }

/* ===================== IMPORT / EXPORT DEDUCTIONS ===================== */
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadTemplate(){
  if(!need("pay"))return;
  const month=readMonthYear('pM')||currentMonthName();
  const active=STORE.loans.filter(l=>l.status==="active").sort((a,b)=>a.employee.localeCompare(b.employee)||a.agency.localeCompare(b.agency)||(loanSeq(a).n-loanSeq(b).n));
  const head=["Employee","Agency","LoanType","LoanCode","LoanOrder","Reference","Month","First15","Second15","Total","PaymentType"];
  const lines=[head.join(",")];
  /* each value is quoted once (names and references may contain commas or quotes) */
  active.forEach(l=>lines.push([l.employee,l.agency,l.loanType,l.code||"",loanSeq(l).n,l.reference||"",month,"","","","REGULAR"].map(csvCell).join(",")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="deduction-template-"+month.replace(/\s+/g,"-")+".csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("Template downloaded. Each row already has its LoanCode, so fill the amounts and Import CSV");
}
function parseCSV(text){
  const rows=[]; let i=0,f="",row=[],q=false; text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue; }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f="";i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++; }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function importDeductions(ev){
  if(!need("pay"))return;
  const file=ev.target.files[0]; if(!file)return; const rd=new FileReader();
  rd.onload=()=>{ ev.target.value="";
    const rows=parseCSV(rd.result); if(rows.length<2){toast("That file has no data rows");return;}
    const hdr=rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]/g,""));
    const col=n=>hdr.indexOf(n);
    const ci={emp:col("employee"),ag:col("agency"),lt:col("loantype"),ref:col("reference"),mo:col("month"),h1:col("first15"),h2:col("second15"),tot:col("total"),pt:col("paymenttype"),ord:(col("loanorder")>=0?col("loanorder"):(col("order")>=0?col("order"):col("loanno"))),code:col("loancode")};
    if(ci.emp<0||ci.mo<0){toast("File needs at least Employee and Month columns");return;}
    const pn=v=>{v=String(v||"").replace(/[₱,\s]/g,"").trim(); if(v==="")return null; const n=Number(v); return isNaN(n)?null:round2(n);};
    const normAg=a=>{a=String(a||"").toUpperCase(); return (a.includes("PAG")||a==="HDMF")?"HDMF":"SSS";};
    const items=[];
    for(let k=1;k<rows.length;k++){ const r=rows[k];
      const emp=(r[ci.emp]||"").trim(); if(!emp)continue;
      const agCell=ci.ag>=0?String(r[ci.ag]||"").trim():"", ag=agCell?normAg(agCell):""; const lt=ci.lt>=0?(r[ci.lt]||"").trim().toUpperCase():"";
      const ref=ci.ref>=0?(r[ci.ref]||"").trim():"";
      const mo=(r[ci.mo]||"").trim().toUpperCase();
      const h1=pn(r[ci.h1]),h2=pn(r[ci.h2]),tot=pn(r[ci.tot]);
      const pt=ci.pt>=0?((r[ci.pt]||"").trim().toUpperCase()||"REGULAR"):"REGULAR";
      if(h1===null&&h2===null&&tot===null)continue;
      /* Match the row to a loan. It is matched automatically only when it is certain; otherwise the row keeps its
         candidate loans and you choose in the preview. Agency and Loan type are optional when a Loan code, Loan order
         or Reference identifies the loan. Reference is compared ignoring case, spaces and punctuation, and may also
         be the loan's permanent code or agency loan number. Nothing is ever ignored: a value that fits no loan is reported. */
      const nrm=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""), idents=l=>[l.code,l.reference,l.agencyNo].filter(Boolean).map(nrm);
      const ordRaw=ci.ord>=0?String(r[ci.ord]||"").replace(/[^0-9]/g,""):"", ordN=ordRaw?parseInt(ordRaw,10):0;
      const codeVal=ci.code>=0?String(r[ci.code]||"").trim().toUpperCase():"", nref=nrm(ref);
      const empLoans=STORE.loans.filter(l=>l.employee.toLowerCase()===emp.toLowerCase());
      let pool=empLoans.filter(l=>(!ag||l.agency===ag)&&(!lt||l.loanType===lt)), loan=null, amb="";
      if(codeVal){
        const bc=empLoans.find(l=>(l.code||"").toUpperCase()===codeVal);
        if(!bc){ pool=[]; amb="loan code not found for this employee"; }
        else if((ag&&bc.agency!==ag)||(lt&&bc.loanType!==lt)){ pool=[bc]; amb="code "+bc.code+" is a "+agencyDisp(bc.agency)+" "+bc.loanType+" loan, but the row says "+((ag?agencyDisp(ag)+" ":"")+lt).trim(); }
        else loan=bc;
      } else {
        if(ordN){ const byOrd=empLoans.filter(l=>(!ag||l.agency===ag)&&loanSeq(l).n===ordN), ok=byOrd.filter(l=>!lt||l.loanType===lt);
          if(ok.length)pool=ok; else if(byOrd.length){ pool=byOrd; amb="loan #"+ordN+" is a "+byOrd.map(l=>l.loanType).join("/")+" loan, but the row says "+lt; } else { pool=[]; amb="this employee has no loan #"+ordN; } }
        if(!amb&&nref){ const m=pool.filter(l=>idents(l).indexOf(nref)>=0);
          if(m.length===1)pool=m;
          else if(m.length>1){ pool=m; amb="more than one loan has this reference"; }
          else { const other=empLoans.filter(l=>idents(l).indexOf(nref)>=0);
            if(other.length){ pool=other; amb='"'+ref+'" is on a loan that does not match the row\'s agency, type or order'; }
            else amb='"'+ref+'" is not the reference, code or agency number of any loan of this employee'; } }
        if(!amb){ if(pool.length===1)loan=pool[0]; else if(pool.length>1)amb=pool.length+" loans match; choose which one"; }
      }
      items.push({emp,ag,lt,mo,h1,h2,tot,pt,ref,loanId:loan?loan.id:null,cands:loan?[]:pool.map(l=>l.id),amb:loan?"":amb,status:"",note:"",differs:false,disp:""});
    }
    window.__impOverAck=false; classifyImport(items); window.__importItems=items;
    previewImport(items);
  };
  rd.readAsText(file);
}
/* Work out each import row's status (called after parsing and after every loan choice). */
function classifyImport(items){ const seen=new Set();
  items.forEach(x=>{ const applied=(typeof x.tot==="number")?x.tot:round2((x.h1||0)+(x.h2||0)); x.note=""; x.differs=false;
    const ml=x.loanId?loanById(x.loanId):null; x.disp=ml?(agencyDisp(ml.agency)+" "+ml.loanType):(((x.ag?agencyDisp(x.ag):"")+" "+(x.lt||"")).trim()||"loan not stated");
    if(monthIndex(x.mo)<0){ x.status="bad month"; return; }
    if(!x.loanId){ if(x.cands&&x.cands.length){ x.status="ambiguous loan"; x.note=x.amb||"choose which loan this payment belongs to"; } else { x.status="no matching loan"; x.note=x.amb||"no loan found for this employee, agency and type"; } return; }
    const key=dupKey(x.loanId,x.mo), ex=STORE.entries.find(e=>e.loanId===x.loanId&&e.applicableMonth===x.mo);
    if(seen.has(key)){ x.status="repeated in file"; x.note="this loan and month appears earlier in the file"; }
    else if(ex){ x.status="already posted"; const was=appliedOf(ex); x.differs=Math.abs(was-applied)>0.005; x.note="recorded "+peso(was)+(x.differs?", file says "+peso(applied):""); }
    else x.status="will post";
    seen.add(key); });
  /* overpayment check: rows that would post are tried in month order against each loan's remaining balance */
  items.forEach(x=>{ x.over=null; });
  if(overMode()!=="off"){ const run=new Map();
    items.filter(x=>x.status==="will post").sort((a,b)=>monthIndex(a.mo)-monthIndex(b.mo)).forEach(x=>{
      const l=loanById(x.loanId), applied=(typeof x.tot==="number")?x.tot:round2((x.h1||0)+(x.h2||0)); if(!l||!(applied>0))return;
      const used=run.get(x.loanId)||0, info=overpayInfo(l,applied,null,used);
      if(info){ x.over=info; x.note="goes over the remaining balance by "+pesoTxt(info.excess); if(overMode()==="block"){ x.status="over balance"; return; } }
      run.set(x.loanId,used+applied); }); } }
function impAckSync(c){ window.__impOverAck=!!c.checked; const b=document.getElementById("impGo"); if(b){ const n=(window.__importQueue||[]).length; b.disabled=!(n&&c.checked); } }
function impLoanOpt(l){ const st=loanStats(l), q=loanSeq(l);

function pickImportLoan(i,loanId){ const items=window.__importItems||[], x=items[i]; if(!x||!loanId)return;

}
async function commitImportInner(){
  if(!need('pay'))return;
  const q0=window.__importQueue||[]; if(!q0.length){ closeModal(); return; }
  const fr=await freshEntries(q0.map(x=>({loanId:x.loanId,month:x.mo}))), im=document.getElementById("impMsg");
  if(fr.error){ if(im)im.textContent="Could not check for payments already posted, so nothing was imported: "+(fr.error.message||fr.error)+" Try again."; return; }
  const q=q0.filter(x=>!fr.map.has(dupKey(x.loanId,x.mo))), clash=q0.length-q.length;
  if(!q.length){ window.__importQueue=null; closeModal(); toast("Nothing imported: every row was already posted since the preview"); await reloadRender(); return; }
  const rows=q.map(x=>({loan_id:x.loanId,applicable_month:x.mo,or_ref:null,first15:x.h1,second15:x.h2,total_recorded:x.tot,payment_type:x.pt,remarks:"imported from spreadsheet"}));
  const cr=await commitPaymentRows(rows,"import","Imported "+rows.length+" payment"+(rows.length!==1?"s":""));
  if(!cr.ok){ toast("Import failed: "+esc(cr.msg)); return; }
  window.__importQueue=null; closeModal();
  if(cr.queued){ toast(`Sent for approval: ${rows.length} payment${rows.length!==1?'s':''}. Nothing is posted yet.`); await reloadRender(); return; }
  logAudit("import","ledger",rows.length); toast(`Imported ${rows.length} payment${rows.length!==1?'s':''}`+(clash?`, skipped ${clash} already posted since the preview`:"")); undoSnack(cr.undoId); await reloadRender();
}
async function commitImport(){ if(commitImport._busy)return; commitImport._busy=true; try{ await commitImportInner(); } finally{ commitImport._busy=false; } }


/* ===================== DUPLICATE PAYMENT GUARD ===================== */
/* Rule: one payment entry per loan per applicable month. Every write (single entry, Post Month, Import) re-checks the
   database right before saving, so a second user, a second tab or a double click cannot add a repeat. */
let EF_ID=null;
const dupKey=(loanId,month)=>loanId+"|"+month;
async function freshEntries(pairs){ // pairs [{loanId,month}] -> {map: key -> [entries already in the database], error}
  const map=new Map(); if(!pairs.length)return {map,error:null};
  const loanIds=[...new Set(pairs.map(p=>p.loanId))], months=[...new Set(pairs.map(p=>p.month))];
  for(let i=0;i<loanIds.length;i+=100){ const ids=loanIds.slice(i,i+100);
    const res=await fetchAll(()=>sb.from("ledger_entries").select("*").in("loan_id",ids).in("applicable_month",months).order("id"));
    if(res.error)return {map,error:res.error};
    res.data.forEach(r=>{ if(r.archived_at)return; const e=rowToEntry(r), k=dupKey(e.loanId,e.applicableMonth); if(!map.has(k))map.set(k,[]); map.get(k).push(e); }); }
  return {map,error:null}; }
function updDupHint(){ const b=document.getElementById("efDup"); if(!b)return;
  const lo=document.getElementById("efLoan"), m=readMonthYear("efM"); if(!lo||!m){ b.style.display="none"; return; }
  const ex=STORE.entries.find(x=>x.id!==EF_ID&&x.loanId===lo.value&&x.applicableMonth===m);
  if(ex){ b.style.display=""; b.innerHTML=`<b>${esc(m)} is already recorded on this loan</b> (${peso(appliedOf(ex))}, ${esc(ex.paymentType)}${ex.orRef?", OR "+esc(ex.orRef):""}). A second entry for the same month will not be saved. <button class="btn btn-ghost btn-sm" onclick="closeModal();editEntry('${ex.id}')">Open that entry</button>`; }
  else b.style.display="none"; }
function dupGroups(){ const m=new Map(); STORE.entries.forEach(e=>{ const k=dupKey(e.loanId,e.applicableMonth); if(!m.has(k))m.set(k,[]); m.get(k).push(e); });
  return [...m.values()].filter(g=>g.length>1).map(g=>({l:loanById(g[0].loanId),month:g[0].applicableMonth,entries:g})).filter(x=>x.l)
    .sort((a,b)=>a.l.employee.localeCompare(b.l.employee)||monthIndex(a.month)-monthIndex(b.month)); }
function dupSection(){
  const g=dupGroups(), n=g.reduce((t,x)=>t+x.entries.length,0), canPay=caps().pay;
  const rows=g.map(x=>x.entries.map((e,i)=>`<tr><td>${i===0?`<b>${esc(x.l.employee)}</b>`:""}</td><td>${i===0?`${agencyPill(x.l.agency)} ${typePill(x.l.loanType)+seqPill(x.l)}`:""}</td><td>${i===0?esc(x.month):""}</td>
      <td class="num"><b>${peso(appliedOf(e))}</b></td><td>${esc(e.paymentType)}</td><td>${e.orRef?esc(e.orRef):'<span class="muted">&#8211;</span>'}</td><td class="muted">${e.remarks?esc(e.remarks):""}</td>
      <td class="act">${canPay?`<button class="rowbtn" onclick="editEntry('${e.id}')">Edit</button><button class="rowbtn del" onclick="deleteEntry('${e.id}')">${archOn()?"Archive":"Delete"}</button>`:""}</td></tr>`).join("")).join("");
  if(!g.length) return `<div class="card" style="margin-bottom:18px"><h3>Duplicate payments <span class="tag">same loan and month</span></h3><p class="hintline" style="margin:4px 0 0">None found. Every loan has at most one payment per month.</p></div>`;
  return `<div class="card" style="margin-bottom:18px"><h3>Duplicate payments <span class="tag">${g.length} loan-month${g.length>1?"s":""}, ${n} entries</span></h3>
    <div class="notice" style="margin:8px 0 12px"><b>These months are counted more than once, which inflates totals and hides arrears.</b> Keep the correct entry and delete the extras, or change the month of one that was dated wrongly.</div>
    <div class="tablewrap" style="box-shadow:none;max-height:420px"><table><thead><tr><th>Employee</th><th>Loan</th><th>Month</th><th class="num">Applied</th><th>Type</th><th>OR / Ref</th><th>Remarks</th><th class="act"></th></tr></thead><tbody>${rows}</tbody></table></div></div>`; }

/* ===================== SAFETY NET: OVERPAYMENT GUARD, UNDO, BAQ APPROVAL ===================== */
/* 1) Overpayment guard. A payment that would take the total paid past what the loan owes is warned about or blocked
      (Settings > Data parameters). Only loans with a known total to pay can be checked. */
const overMode=()=>(SETTINGS.overpay==="block"||SETTINGS.overpay==="off")?SETTINGS.overpay:"warn";
const entryAmount=(h1,h2,tot)=>(typeof tot==="number")?tot:round2((h1||0)+(h2||0));
/* extra = amounts already queued for the same loan in the same batch; excludeId = the entry being edited */
function overpayInfo(loan,amount,excludeId,extra){
  if(!loan||overMode()==="off"||!(amount>0))return null;
  const s=loanStats(loan); if(typeof s.balance!=="number")return null;
  let bal=s.balance;
  if(excludeId){ const old=STORE.entries.find(e=>e.id===excludeId&&e.loanId===loan.id); if(old)bal=round2(bal+appliedOf(old)); }
  bal=round2(bal-(extra||0));
  if(amount<=bal+0.005)return null;
  const room=Math.max(bal,0);
  return {balance:bal,room,excess:round2(amount-room),amount}; }
const overText=info=>pesoTxt(info.amount)+" is more than the remaining balance of "+pesoTxt(info.room)+" (over by "+pesoTxt(info.excess)+").";
function overpayRows(items){ /* [{loanId,amount,month}] -> the rows that go past the balance, counting earlier rows of the same loan */
  if(overMode()==="off")return []; const run=new Map(), out=[];
  items.slice().sort((a,b)=>monthIndex(a.month)-monthIndex(b.month)).forEach(x=>{ const l=loanById(x.loanId); if(!l||!(x.amount>0))return;
    const used=run.get(x.loanId)||0, info=overpayInfo(l,x.amount,null,used); if(info)out.push(Object.assign({},x,{info})); run.set(x.loanId,used+x.amount); });
  return out; }
function updOverHint(){ const b=document.getElementById("efOver"); if(!b)return;
  const lo=document.getElementById("efLoan"), loan=lo&&loanById(lo.value), h1=fnum("efH1"), h2=fnum("efH2"), tot=fnum("efTot");
  if(!loan||isNaN(h1)||isNaN(h2)||isNaN(tot)){ b.style.display="none"; return; }
  const info=overpayInfo(loan,entryAmount(h1,h2,tot),EF_ID);
  if(!info){ b.style.display="none"; return; }
  b.style.display=""; b.innerHTML="<b>Over the remaining balance.</b> "+esc(overText(info))+" "+(overMode()==="block"?"It cannot be saved.":"You will be asked to confirm."); }

/* 2) Undo history. Every bulk import, month posting and delete is snapshotted so it can be reversed for 24 hours.
      Kept in this browser (localStorage), per user. Files of a deleted loan are only removed from storage once the window has passed. */
const UNDO_TTL=24*60*60*1000;
const undoKey=()=>"elms_undo:"+String(CURRENT_USER||"").toLowerCase();
function undoLoad(){ try{ const a=JSON.parse(localStorage.getItem(undoKey())||"[]"); UNDO=Array.isArray(a)?a:[]; }catch(e){ UNDO=[]; swallow("undoLoad",e); } }
function undoSave(){ for(;;){ try{ localStorage.setItem(undoKey(),JSON.stringify(UNDO)); return true; }catch(e){ if(UNDO.length<=1){ swallow("undoSave",e); return false; } UNDO=UNDO.slice(1); } } }
function undoAdd(kind,label,data){ const id="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  UNDO.push({id,kind,label,ts:Date.now(),data}); UNDO=UNDO.slice(-15); undoSave(); return id; }
function undoHide(){ const b=document.getElementById("undoBar"); if(b){ b.classList.remove("show"); clearTimeout(b._t); } }
function undoSnack(id){ if(!id)return; const u=UNDO.find(x=>x.id===id); if(!u)return;
  let b=document.getElementById("undoBar"); if(!b){ b=document.createElement("div"); b.id="undoBar"; b.className="undobar"; document.body.appendChild(b); }
  b.innerHTML=`<span>${esc(u.label)}</span><button class="btn btn-sm" onclick="undoRun('${id}')">Undo</button><button class="undox" aria-label="Dismiss" onclick="undoHide()">&times;</button>`;
  b.classList.add("show"); clearTimeout(b._t); b._t=setTimeout(undoHide,60000); }
async function undoSweep(){ const now=Date.now(), exp=UNDO.filter(u=>u.ts+UNDO_TTL<now); if(!exp.length)return;
  UNDO=UNDO.filter(u=>u.ts+UNDO_TTL>=now); undoSave();
  for(const u of exp){ const paths=(u.kind==="del_loan"&&u.data&&u.data.purge)||[]; if(paths.length&&CURRENT_ROLE==="admin"){ try{ await sb.storage.from(ATT_BUCKET).remove(paths); }catch(e){ swallow("undoSweep purge",e); } } } }
setInterval(()=>{ try{ undoSweep(); }catch(e){ swallow("undoSweep#2",e); } },10*60*1000);
function undoPanel(){ const now=Date.now(); UNDO=UNDO.filter(u=>u.ts+UNDO_TTL>=now);
  const rows=UNDO.slice().reverse().map(u=>{ const left=Math.max(0,u.ts+UNDO_TTL-now), h=Math.floor(left/3600000), m=Math.floor(left%3600000/60000), can=(u.kind==="del_loan"||u.kind==="arch_loan")?caps().loans:caps().pay;
    return `<tr><td>${esc(new Date(u.ts).toLocaleString(PREF.locale,{timeZone:ELMS_TIME.tz}))}</td><td>${esc(u.label)}</td><td class="muted">${h}h ${m}m left</td><td class="act">${can?`<button class="rowbtn" onclick="undoRun('${u.id}')">Undo</button>`:`<span class="muted">Admin only</span>`}</td></tr>`; }).join("");
  modal(`<h3>Undo history</h3><p class="muted" style="margin:0 0 10px;font-size:13px">Bulk imports, month postings and deletes made from this browser can be reversed for 24 hours. Undoing an import or posting removes the payments it added, even if one was edited since. Undoing a delete puts the loan or payment back as it was.</p>
    <div id="undoList" class="tablewrap" style="box-shadow:none;max-height:50vh"><table><thead><tr><th>When</th><th>What</th><th>Time left</th><th class="act"></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted" style="padding:14px">Nothing to undo.</td></tr>'}</tbody></table></div>
    <div class="foot"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`,"wide"); }
async function undoRun(id){ if(undoRun._busy)return; undoRun._busy=true; try{ await undoRunInner(id); } finally{ undoRun._busy=false; } }
async function undoRunInner(id){
  const u=UNDO.find(x=>x.id===id); if(!u){ toast("That can no longer be undone."); return; }
  if(!need((u.kind==="del_loan"||u.kind==="arch_loan")?"loans":"pay"))return;
  undoHide(); toast("Undoing...");
  let r; try{ r=u.kind==="insert"?await undoInsert(u):u.kind==="del_entry"?await undoDelEntry(u):u.kind==="del_loan"?await undoDelLoan(u):(u.kind==="arch_loan"||u.kind==="arch_entry")?await undoArch(u):{ok:false,msg:"Unknown action"}; }
  catch(e){ r={ok:false,msg:friendlyErr(e)}; }
  if(!r.ok){ toast("Could not undo: "+esc(r.msg)); return; }
  UNDO=UNDO.filter(x=>x.id!==id); undoSave();
  logAudit("undo","bulk",u.label+(r.note?" | "+r.note:"")); toast(esc(r.note||"Undone"));
  const open=!!document.getElementById("undoList"); await reloadRender(); if(open)undoPanel(); }
async function undoInsert(u){ const ids=(u.data&&u.data.ids)||[]; let gone=0;
  for(let i=0;i<ids.length;i+=100){ const d=await sb.from("ledger_entries").delete().in("id",ids.slice(i,i+100)).select("id"); if(d.error)return {ok:false,msg:d.error.message}; gone+=(d.data||[]).length; }
  return {ok:true,note:`Removed ${gone} of ${ids.length} payment${ids.length!==1?"s":""} that were added`+(gone<ids.length?" (the rest were already gone)":"")}; }
async function undoDelEntry(u){ const row=u.data&&u.data.row; if(!row)return {ok:false,msg:"No restore point was saved."};
  const fr=await freshEntries([{loanId:row.loan_id,month:row.applicable_month}]); if(fr.error)return {ok:false,msg:fr.error.message||String(fr.error)};
  if((fr.map.get(dupKey(row.loan_id,row.applicable_month))||[]).length)return {ok:false,msg:row.applicable_month+" has been recorded again on this loan, so the deleted payment was not put back."};
  let r=await sb.from("ledger_entries").insert(row); if(r.error){ const {id,...rest}=row; r=await sb.from("ledger_entries").insert(rest); }
  if(r.error)return {ok:false,msg:r.error.message};
  return {ok:true,note:"Payment restored"}; }
async function snapshotLoan(id){
  try{ const lr=await sb.from("loans").select("*").eq("id",id).maybeSingle(); if(lr.error||!lr.data)return {ok:false,msg:lr.error?lr.error.message:"loan not found"};
    const er=await fetchAll(()=>sb.from("ledger_entries").select("*").eq("loan_id",id).order("id")); if(er.error)return {ok:false,msg:er.error.message};
    let attachments=[], requests=[];
    try{ const a=await sb.from("loan_attachments").select("*").eq("loan_id",id); if(!a.error)attachments=a.data||[]; }catch(e){ swallow("snapshotLoan att",e); }
    try{ const q=await sb.from("payment_requests").select("*").eq("loan_id",id); if(!q.error)requests=q.data||[]; }catch(e){ swallow("snapshotLoan req",e); }
    let meta=null; if(STORE.hasSeq){ try{ const m=await metaFetch(), links=[];
        Object.keys(m.loans).forEach(k=>{ const q=m.loans[k]||{}; if(q.r===id)links.push({k,f:{r:q.r,cb:q.cb}}); if(q.x===id)links.push({k,f:{x:q.x,xb:q.xb,d:q.d}}); });
        meta={self:m.loans[id]?JSON.parse(JSON.stringify(m.loans[id])):null,links:JSON.parse(JSON.stringify(links))}; }catch(e){ swallow("snapshotLoan meta",e); } }
    return {ok:true,loan:lr.data,entries:er.data||[],attachments,requests,meta}; }
  catch(e){ return {ok:false,msg:friendlyErr(e)}; } }
/* ---- Archive (soft delete): the row stays in the database with archived_at set; nothing is erased ---- */
const archOn=()=>!!(STORE&&STORE.hasArch);
const archNeedSql=e=>(e&&e.message)||String(e);
async function performArchiveLoan(id){
  const l=loanById(id); if(!l)return {ok:false,msg:"The loan no longer exists."};
  const n=entriesForLoan(l).length, now=new Date().toISOString();
  const {error}=await sb.from("loans").update({archived_at:now,archived_by:CURRENT_USER||null,archived_status:l.status||"active",status:"closed"}).eq("id",id);
  if(error)return {ok:false,msg:archNeedSql(error)};
  const uid=undoAdd("arch_loan","Archived loan: "+l.employee+", "+agencyDisp(l.agency)+" "+l.loanType+(n?" ("+n+" payment"+(n>1?"s":"")+")":""),{id});
  logAudit("archive","loan",id+"|"+l.employee+"|"+l.agency+"|"+l.loanType); return {ok:true,undoId:uid,note:"Loan archived"}; }
async function restoreLoanCore(id){
  const l=(STORE.archLoans||[]).find(x=>x.id===id); if(!l)return {ok:false,msg:"That loan is not in the archive."};
  let st=l.archivedStatus||"active", note="";
  let r=await sb.from("loans").update({archived_at:null,archived_by:null,archived_status:null,status:st}).eq("id",id);
  if(r.error&&isActiveLoanDup(r.error)){ st="closed"; r=await sb.from("loans").update({archived_at:null,archived_by:null,archived_status:null,status:"closed"}).eq("id",id); note=" It was restored as closed because the employee now has another active loan of the same type."; }
  if(r.error)return {ok:false,msg:archNeedSql(r.error)};
  logAudit("restore","loan",id+"|"+l.employee+"|"+l.agency+"|"+l.loanType); return {ok:true,note:"Loan restored"+(note||".")}; }
async function restoreEntryCore(id){
  const e=(STORE.archEntries||[]).find(x=>x.id===id); if(!e)return {ok:false,msg:"That payment is not in the archive."};
  if((STORE.archLoans||[]).some(l=>l.id===e.loanId))return {ok:false,msg:"Its loan is archived. Restore the loan first."};
  const fr=await freshEntries([{loanId:e.loanId,month:e.applicableMonth}]); if(fr.error)return {ok:false,msg:fr.error.message||String(fr.error)};
  if((fr.map.get(dupKey(e.loanId,e.applicableMonth))||[]).length)return {ok:false,msg:e.applicableMonth+" has been recorded again on this loan, so the archived payment was not put back."};

async function performDeleteLoan(id){

  const {error}=await sb.from("loans").delete().eq("id",id); if(error)return {ok:false,msg:error.message};
  if(STORE.hasSeq){ try{ await metaCommit(m=>{ delete m.loans[id]; Object.keys(m.loans).forEach(k=>{ const q=m.loans[k]; if(q.r===id){delete q.r;delete q.cb;} if(q.x===id){delete q.x;delete q.xb;delete q.d;} }); }); }catch(e){ swallow("performDeleteLoan meta",e); } }

  const r=await sb.from("loans").insert(d.loan); if(r.error)return {ok:false,msg:r.error.message};
  const warn=[];
  if(d.meta&&STORE.hasSeq){ try{ await metaCommit(m=>{ if(d.meta.self)m.loans[d.loan.id]=d.meta.self; (d.meta.links||[]).forEach(x=>{ if(m.loans[x.k])Object.assign(m.loans[x.k],x.f); }); }); }catch(e){ warn.push("its loan code"); swallow("undoDelLoan meta",e); } }
  if((d.attachments||[]).length){ const a=await sb.from("loan_attachments").insert(d.attachments); if(a.error)warn.push("its document list"); }
  const ents=d.entries||[]; let back=0;

  return {ok:true,note:"Loan restored"+(ents.length?" with "+back+" payment"+(back!==1?"s":""):"")+(warn.length?". Could not restore "+warn.join(", ")+".":".")}; }

async function bulkExecute(r){ const p=r.payload||{};

  let rows=Array.isArray(p.rows)?p.rows:[]; if(!rows.length)return {ok:true,note:"The request had no payments."};

/* ===================== STATEMENT PDF (one click) ===================== */
/* Builds a real PDF in the browser and downloads it, covering every loan the employee has, in loan order (agency, then Loan #1, #2...).
   The PDF library is loaded the first time it is needed, the same way the Excel library is. If it cannot load, the print view opens instead. */
const JSPDF_URL="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
let _pdfPromise=null;
function loadPdfLib(){
  if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(!_pdfPromise) _pdfPromise=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=JSPDF_URL; s.async=true;
    s.onload=()=>(window.jspdf&&window.jspdf.jsPDF)?res(window.jspdf.jsPDF):rej(new Error("PDF library unavailable"));
    s.onerror=()=>rej(new Error("Could not load the PDF library")); document.head.appendChild(s); })
    .catch(e=>{ _pdfPromise=null; throw e; });
  return _pdfPromise;
}
/* the built-in PDF fonts only cover Latin-1, so tidy anything outside it rather than print garbage */
const pdfTxt=s=>String(s==null?"":s).replace(/[\u202F\u2007\u2009\u00A0]/g," ").replace(/[\u2013\u2014]/g,"-").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[^\x20-\x7E\u00A1-\u00FF]/g,"?");
const pdfMoney=n=>(typeof n==="number"&&!isNaN(n))?Number(n).toLocaleString(PREF.locale,{minimumFractionDigits:2,maximumFractionDigits:2}):"-";
function pdfPara(doc,st,text,o){
  o=o||{}; doc.setFont("helvetica",o.bold?"bold":"normal"); doc.setFontSize(o.fs||9); doc.setTextColor.apply(doc,o.color||[30,30,30]);
  const lh=(o.fs||9)*1.35;
  doc.splitTextToSize(pdfTxt(text),st.PW-st.M*2).forEach(ln=>{ if(st.y+lh>st.PH-st.B){ doc.addPage(); st.y=st.T; } doc.text(ln,st.M,st.y+(o.fs||9)*0.85); st.y+=lh; });
  st.y+=(o.gap||0);
}
/* cols: [{h,w,a:"l"|"r"}], rows: arrays of text. The header repeats on every page; a row is never split across pages. */
function pdfTable(doc,st,cols,rows,o){
  o=o||{}; const fs=o.fs||8, lh=fs*1.3, pad=3.5, W=cols.reduce((t,c)=>t+c.w,0);
  const put=(cells,style)=>{
    doc.setFont("helvetica",style==="n"?"normal":"bold"); doc.setFontSize(fs);
    const lines=cells.map((t,i)=>doc.splitTextToSize(pdfTxt(t),Math.max(10,cols[i].w-pad*2)));
    const h=Math.max(1,...lines.map(a=>a.length))*lh+pad*2;
    if(st.y+h>st.PH-st.B){ doc.addPage(); st.y=st.T; if(style!=="h") put(cols.map(c=>c.h),"h"); }
    if(style==="h"||style==="t"){ if(style==="h")doc.setFillColor(228,233,240); else doc.setFillColor(243,245,249); doc.rect(st.M,st.y,W,h,"F"); }
    doc.setTextColor(30,30,30); let x=st.M;
    cells.forEach((t,i)=>{ const c=cols[i]; lines[i].forEach((ln,k)=>{ const ty=st.y+pad+fs*0.85+k*lh; if(c.a==="r")doc.text(ln,x+c.w-pad,ty,{align:"right"}); else doc.text(ln,x+pad,ty); }); x+=c.w; });
    doc.setDrawColor(214,220,229); doc.setLineWidth(0.4); doc.line(st.M,st.y+h,st.M+W,st.y+h); st.y+=h;
  };
  put(cols.map(c=>c.h),"h"); rows.forEach(r=>put(r.cells||r,r.total?"t":"n"));
}
async function statementPdf(name){
  const loans=STORE.loans.filter(l=>l.employee===name).sort((a,b)=>a.agency.localeCompare(b.agency)||(loanSeq(a).n-loanSeq(b).n));
  if(!loans.length){ toast("No loans on file for "+esc(name)+"."); return; }
  let J; toast("Preparing PDF...");
  try{ J=await loadPdfLib(); }catch(e){ swallow("statementPdf#load",e); toast("Could not load the PDF tool, so the print view opened instead."); printStatement(name); return; }
  try{
    const doc=new J({unit:"pt",format:"a4",compress:true}), M=40;
    const st={M,T:44,B:50,PW:doc.internal.pageSize.getWidth(),PH:doc.internal.pageSize.getHeight(),y:44}, CW=st.PW-M*2;
    const fit=ws=>{ const t=ws.reduce((a,b)=>a+b,0); return ws.map(w=>w*CW/t); };
    const org=SETTINGS.org||"", cid=empCid(name), today=new Date().toLocaleDateString(PREF.locale,{timeZone:ELMS_TIME.tz,year:"numeric",month:"long",day:"numeric"});
    if(org) pdfPara(doc,st,org,{fs:9,bold:true,color:[90,100,115],gap:2});
    pdfPara(doc,st,"Statement of Account",{fs:18,bold:true,gap:4});
    pdfPara(doc,st,"Employee: "+name+(cid?"   |   Company ID: "+cid:""),{fs:10.5,bold:true});
    pdfPara(doc,st,"Generated: "+today+"   |   "+loans.length+" loan"+(loans.length===1?"":"s")+" listed in loan order",{fs:9,color:[90,100,115],gap:8});
    /* overview of every loan, numbered in the order the detail follows */
    const w1=fit([20,128,56,66,66,66,62,51]), h1=["#","Loan","Monthly","Total to pay","Paid","Balance","Paid through","Status"], a1=["l","l","r","r","r","r","l","l"];
    let tObl=0,tPaid=0,tBal=0,tMon=0,noTot=false;
    const over=loans.map((l,i)=>{ const s=loanStats(l), q=loanSeq(l), open=l.status!=="closed";
      if(typeof s.obligation==="number")tObl+=s.obligation; else noTot=true; tPaid+=s.totalPaid;
      if(open){ if(typeof s.balance==="number")tBal+=s.balance; if(typeof l.monthlyAmort==="number"&&loanState(l)==="active")tMon+=l.monthlyAmort; }
      const st2=loanState(l); return [String(i+1),agencyDisp(l.agency)+" "+l.loanType+(q.of>1?" #"+q.n:"")+(l.reference?" ("+l.reference+")":""),pdfMoney(l.monthlyAmort),pdfMoney(s.obligation),pdfMoney(s.totalPaid),pdfMoney(s.balance),(s.lastMonth&&s.lastMonth!=="none")?s.lastMonth:"none",st2.charAt(0).toUpperCase()+st2.slice(1)]; });
    over.push({total:true,cells:["","Total",pdfMoney(round2(tMon)),pdfMoney(round2(tObl)),pdfMoney(round2(tPaid)),pdfMoney(round2(tBal)),"",""]});
    pdfTable(doc,st,h1.map((h,i)=>({h,w:w1[i],a:a1[i]})),over,{fs:8});
    st.y+=4; pdfPara(doc,st,"Monthly total counts active loans only and Balance counts open loans only."+(noTot?" Some loans have no total set, so Total to pay covers the loans that do.":""),{fs:7.5,color:[110,118,130],gap:6});
    /* detail, one block per loan */
    const w2=fit([100,75,75,75,85,105]), c2=[["Month","l"],["1st-15th","r"],["16th-30th","r"],["Applied","r"],["Running total","r"],["Type","l"]].map((c,i)=>({h:c[0],w:w2[i],a:c[1]}));
    loans.forEach((l,i)=>{ const s=loanStats(l), q=loanSeq(l); let run=0;
      if(st.y>st.PH-st.B-110){ doc.addPage(); st.y=st.T; } else st.y+=8;
      pdfPara(doc,st,(i+1)+". "+agencyDisp(l.agency)+" "+l.loanType+(q.of>1?" - Loan #"+q.n+" of "+q.of:"")+(l.reference?" ("+l.reference+")":""),{fs:11,bold:true,gap:1});
      const facts=["Total to pay: "+(typeof s.obligation==="number"?pdfMoney(s.obligation):"not set"),"Monthly: "+(typeof l.monthlyAmort==="number"?pdfMoney(l.monthlyAmort):"n/a"),
        "Paid: "+pdfMoney(s.totalPaid),"Balance: "+(typeof s.balance==="number"?pdfMoney(s.balance):"n/a"),"Paid through: "+((s.lastMonth&&s.lastMonth!=="none")?s.lastMonth:"none")];
      if(typeof s.advance==="number"&&s.advance<0) facts.push("Arrears: "+pdfMoney(-s.advance));
      facts.push("Status: "+({"fully paid":"Fully paid","closed":"Closed","active":"Active"}[loanState(l)]||""));
      pdfPara(doc,st,facts.join("   |   "),{fs:8.5,color:[70,78,90],gap:4});
      if(!s.entries.length){ pdfPara(doc,st,"No payments recorded yet.",{fs:8.5,color:[110,118,130],gap:4}); return; }
      pdfTable(doc,st,c2,s.entries.map(e=>{ run+=appliedOf(e); return [e.applicableMonth,typeof e.first15==="number"?pdfMoney(e.first15):"-",typeof e.second15==="number"?pdfMoney(e.second15):"-",pdfMoney(appliedOf(e)),pdfMoney(round2(run)),e.paymentType||""]; }),{fs:8});
    });
    if(st.y>st.PH-st.B-50){ doc.addPage(); st.y=st.T; }
    st.y+=26; doc.setDrawColor(90,100,115); doc.setLineWidth(0.6); doc.line(M,st.y,M+200,st.y); st.y+=11; doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(70,78,90); doc.text("Certified correct",M,st.y);
    const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){ doc.setPage(p); doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(120,128,140);
      doc.text(pdfTxt((org?org+"  |  ":"")+"Statement of Account  |  "+name),M,st.PH-26); doc.text("Page "+p+" of "+n,st.PW-M,st.PH-26,{align:"right"}); }
    const slug=String(name).replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"employee";
    doc.save("Statement-"+slug+"-"+stamp()+".pdf");
    logAudit("export","statement-pdf",name+" \u00b7 PDF \u00b7 "+loans.length+" loans"); toast("Statement PDF downloaded.");
  }catch(e){ swallow("statementPdf",e); toast("Could not build the PDF, so the print view opened instead."); printStatement(name); }
}

/* ===================== MONTHLY DIGEST ===================== */
/* One screen (and one email draft) with what needs chasing: arrears, loans about to finish, and months nobody has posted.
   It is worked out live from the same data as the rest of the app. A "digest is ready" alert appears in Notifications each month. */
const DG={d:null};
const DG_END_MONTHS=3;
function digestLoanName(l){ const q=loanSeq(l); return agencyDisp(l.agency)+" "+l.loanType+(q.of>1?" #"+q.n:""); }
function digestData(asOf){
  const ci=monthIndex(asOf), ar=arrearsData(asOf), act=STORE.loans.filter(l=>l.status==="active"), ending=[], unposted=[], gaps=[];
  act.forEach(l=>{ const s=loanStats(l);
    if(s.fullyPaid) ending.push({l,s,left:0,end:"",paid:true});
    else if(typeof s.monthsToFull==="number"&&s.monthsToFull<=DG_END_MONTHS) ending.push({l,s,left:s.monthsToFull,end:s.projectedEnd||"",paid:false});
    if(!s.fullyPaid&&l.monthlyAmort>0){ const fi=monthIndex(l.firstMonth); if(fi>=0&&fi<=ci&&!entsOf(l).some(e=>monthIndex(e.applicableMonth)===ci)) unposted.push({l,s}); }
    const mm=missedMonths(l).filter(m=>monthIndex(m)<=ci); if(mm.length) gaps.push({l,months:mm}); });
  const byName=(a,b)=>a.l.employee.localeCompare(b.l.employee)||digestLoanName(a.l).localeCompare(digestLoanName(b.l));
  ending.sort((a,b)=>a.left-b.left||byName(a,b)); unposted.sort(byName); gaps.sort((a,b)=>b.months.length-a.months.length||byName(a,b));
  return {asOf,ar:ar.all,arTotal:round2(ar.all.reduce((t,x)=>t+x.behind,0)),arPeople:new Set(ar.all.map(x=>x.l.employee)).size,skipped:ar.skipped,ending,unposted,gaps}; }
function digestHTML(d,limit,withKpis){
  const tbl=(head,rows)=>{ const shown=rows.slice(0,limit), more=rows.length-shown.length;
    return `<div class="tablewrap" style="box-shadow:none;max-height:none"><table><thead><tr>${head.map(h=>`<th${h[1]?` class="${h[1]}"`:""}>${h[0]}</th>`).join("")}</tr></thead><tbody>${shown.join("")}</tbody></table></div>${more>0?`<p class="hintline" style="margin:4px 0 0">and ${more} more. Print the digest for the full list.</p>`:""}`; };
  const sec=(title,sub,body)=>`<h4 style="margin:18px 0 2px;font-size:14px">${title}</h4><p class="hintline" style="margin:0 0 6px;font-size:12px">${sub}</p>${body}`;
  const none=t=>`<p class="hintline" style="margin:4px 0 0">${t}</p>`;
  const kp=(cls,lab,val,hint)=>`<div class="kpi ${cls}"><div class="lab">${lab}</div><div class="val">${val}</div><div class="hint">${hint}</div></div>`;
  const kpis=withKpis?`<div class="kpis" style="margin-bottom:6px">${kp("accent-warn","In arrears",d.ar.length,`${d.arPeople} employee${d.arPeople===1?"":"s"} &middot; ${peso(d.arTotal)}`)}
    ${kp("accent-sss","Ending soon",d.ending.length,`within ${DG_END_MONTHS} months`)}
    ${kp("accent-brand","No "+esc(d.asOf)+" payment",d.unposted.length,"active loans")}
    ${kp("accent-hdmf","Skipped months",d.gaps.length,"loans with a gap")}</div>`:"";
  const a=d.ar.map(x=>`<tr><td>${esc(x.l.employee)}</td><td>${esc(digestLoanName(x.l))}</td><td>${esc(fmtMB(x.mb))}</td><td class="num">${peso(x.behind)}</td><td>${esc(x.s.lastMonth&&x.s.lastMonth!=="none"?x.s.lastMonth:"no payments")}</td></tr>`);
  const e=d.ending.map(x=>`<tr><td>${esc(x.l.employee)}</td><td>${esc(digestLoanName(x.l))}</td><td>${x.paid?"Fully paid, ready to close":esc(nfPl(x.left,"month"))+" left"}</td><td>${esc(x.end||"")}</td><td class="num">${peso(x.paid?0:x.s.balance)}</td></tr>`);

function digestText(d,limit){

  if(d.ar.length) L.push(...cut(d.ar,x=>`- ${x.l.employee} | ${digestLoanName(x.l)}: behind ${pesoTxt(x.behind)} (${fmtMB(x.mb)})`)); L.push("");
  L.push(`LOANS ENDING SOON: ${d.ending.length}`);
  if(d.ending.length) L.push(...cut(d.ending,x=>`- ${x.l.employee} | ${digestLoanName(x.l)}: ${x.paid?"fully paid, ready to close":nfPl(x.left,"month")+" left"+(x.end?", last deduction "+x.end:"")+", balance "+pesoTxt(x.s.balance)}`)); L.push("");
  L.push(`NO ${d.asOf.toUpperCase()} PAYMENT YET: ${nfPl(d.unposted.length,"active loan")}`);

/* ===================== PROJECTED MONTHLY DEDUCTIONS ===================== */
/* Exact scheduled deduction per month for every ACTIVE loan of an employee, from the remaining-payment schedule:
   loans that have not started yet are included from their first month, the smaller final installment is exact, and
   loans drop out when paid off. Months already past with nothing recorded are reported as "past due", not hidden. */
const jq=s=>esc(s).replace(/'/g,"\\'");
const fcMon=i=>{ const p=monthLabel(i).split(" "); return p[0].charAt(0)+p[0].slice(1,3).toLowerCase()+" "+String(p[1]).slice(2); };
let _PJ={e:null,l:null,k:"",m:new Map()};
function loanProj(l){
  const cur=monthIndex(currentMonthName()), k=cur+"|"+SETTINGS.tol;
  if(_PJ.e!==STORE.entries||_PJ.l!==STORE.loans||_PJ.k!==k)_PJ={e:STORE.entries,l:STORE.loans,k,m:new Map()};
  let p=_PJ.m.get(l.id); if(p)return p;
  const sc=amortSchedule(l), by=new Map(); let past=0;
  if(sc.status==="ok")sc.rows.forEach(r=>{ if(r.idx<cur)past=round2(past+r.amount); else by.set(r.idx,r.amount); });
  p={by,past,status:sc.status}; _PJ.m.set(l.id,p); return p; }
function empForecast(emp,from,n,o){ o=o||{};
  const cur=monthIndex(currentMonthName()), loans=STORE.loans.filter(l=>l.employee===emp&&l.status==="active"&&l.id!==o.skip&&(!o.ag||l.agency===o.ag));
  const ps=loans.map(l=>({l,p:loanProj(l)})), skipped=ps.filter(x=>["nobalance","noamort","nostart"].includes(x.p.status)).map(x=>x.l);
  const past=round2(ps.reduce((t,x)=>t+x.p.past,0)), sal=(STORE.empSalary||{})[emp]||0, pct=SETTINGS.maxDedPct||0, limit=(sal>0&&pct>0)?round2(sal*pct/100):0, months=[];
  for(let i=from;i<from+n;i++){ const items=[]; let total=0;
    ps.forEach(x=>{ let a=x.p.by.get(i)||0; if(o.inc&&i===cur)a=round2(a+x.p.past); if(a>0){ items.push({l:x.l,amount:a}); total+=a; } });
    total=round2(total); months.push({idx:i,total,items,over:limit>0&&total>limit+1e-9}); }
  return {emp,months,past,skipped,limit,pct,loans:ps.length}; }
const fcTip=m=>m.items.map(x=>agencyDisp(x.l.agency)+" "+x.l.loanType+": "+pesoTxt(x.amount)).join("\n");
function fcCardHTML(emp){ const f=empForecast(emp,monthIndex(currentMonthName()),6,{}); if(!f.loans)return "";
  return `<div class="card" style="margin:0 0 18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Projected monthly deduction <span class="tag">all active loans of ${esc(emp)}</span></h3><button class="btn btn-ghost btn-sm" onclick="openEmpForecast('${jq(emp)}')">Full forecast</button></div>
    <div class="facts" style="margin-top:10px">${f.months.map(m=>`<div class="fact" title="${esc(fcTip(m))}"><div class="l">${esc(fcMon(m.idx))}</div><div class="v ${m.over?"var-neg":""}">${m.total?peso(m.total):"&#8211;"}<span class="sub">${m.items.length} loan${m.items.length===1?"":"s"}</span></div></div>`).join("")}</div>
    ${f.past>0?`<div class="notice" style="margin:10px 0 0"><b>${peso(f.past)} is past due</b> (scheduled months with no payment recorded). It is not in the figures above.</div>`:""}
    ${f.skipped.length?`<div class="notice info" style="margin:10px 0 0">${nfPl(f.skipped.length,"active loan")} cannot be projected (no monthly amount, total or start month), so the totals may be understated.</div>`:""}</div>`; }
function openEmpForecast(emp){
  const cur=monthIndex(currentMonthName()); let last=cur;
  STORE.loans.filter(l=>l.employee===emp&&l.status==="active").forEach(l=>loanProj(l).by.forEach((_,i)=>{ if(i>last)last=i; }));
  const f=empForecast(emp,cur,Math.min(120,last-cur+1),{}), ls=[]; f.months.forEach(m=>m.items.forEach(x=>{ if(!ls.includes(x.l))ls.push(x.l); }));
  ls.sort((a,b)=>a.agency.localeCompare(b.agency)||loanSeq(a).n-loanSeq(b).n);
  const th=ls.map(l=>`<th class="num">${agencyDisp(l.agency)} ${esc(l.loanType)}${loanSeq(l).of>1?" #"+loanSeq(l).n:""}</th>`).join("");
  const body=f.months.map(m=>`<tr><td>${esc(monthLabel(m.idx))}</td>${ls.map(l=>{ const x=m.items.find(y=>y.l===l); return `<td class="num">${x?peso(x.amount):'<span class="muted">&#8211;</span>'}</td>`; }).join("")}<td class="num ${m.over?"var-neg":""}"><b>${peso(m.total)}</b></td>${f.limit>0?`<td>${m.over?`<span class="pill danger">over ${f.pct}% limit</span>`:""}</td>`:""}</tr>`).join("");
  const tbl=`<table><thead><tr><th>Month</th>${th}<th class="num">Total deduction</th>${f.limit>0?"<th></th>":""}</tr></thead><tbody>${body||'<tr><td colspan="9" class="muted" style="padding:14px">No scheduled deductions.</td></tr>'}</tbody></table>`;
  FC.html=`<div class="ph">Employee: ${esc(emp)} &middot; Generated ${new Date().toLocaleDateString(PREF.locale,{timeZone:ELMS_TIME.tz})}</div>`+tbl;

async function saveRenewal(){

  logAudit("close","loan",old.id+"|"+v.kind+" carried "+v.bal); logAudit("create","loan",nid+"|"+emp+"|"+old.agency+"|"+v.type+"|"+v.kind+" of "+old.id);
  try{ await metaCommit(m=>{ const e=m.loans[nid]||(m.loans[nid]={}); if(!e.c)e.c=metaNewCode(m,old.agency,v.type,v.first); e.r=old.id; e.k=v.kind; e.cb=v.bal; e.ap={s:"applied",h:[{s:"applied",at:apNow(),by:apBy(),n:v.kind}]};

/* ===================== LOAN DOCUMENTS & APPROVAL TRACKING ===================== */
/* Required papers per agency (uploaded files are matched by their document type) and an approval trail per loan.
   Stored with the loan's other identifiers (loan_ids settings row): ap = {s:stage, h:[{s,at,by,n}]}, dv = {docType:{at,by}}. */
const DOC_REQ={SSS:["Voucher","SSS document","Promissory note / agreement"],HDMF:["Pag-IBIG document","Promissory note / agreement"]};
const AP_STAGES=[["applied","Applied"],["submitted","Submitted to agency"],["approved","Approved"],["released","Released"]];
const apLabel=s=>s==="rejected"?"Rejected":((AP_STAGES.find(x=>x[0]===s)||[])[1]||"Not tracked");
const apPill=s=>`<span class="pill ${({applied:"type",submitted:"sss",approved:"warn",released:"ok",rejected:"danger"})[s]||"closed"}">${esc(apLabel(s))}</span>`;
const apNow=()=>ELMS_TIME.todayISO(), apBy=()=>String(CURRENT_USER||"").replace(/@bploans\.local$/i,"");
function docStatus(l){ const have=(STORE.attCats||{})[l.id]||{}, v=l.docV||{}, rows=(DOC_REQ[l.agency]||[]).map(c=>({c,n:have[c]||0,ver:v[c]||null}));
  const missing=rows.filter(r=>!r.n), unver=rows.filter(r=>r.n&&!r.ver); return {rows,missing,unver,complete:!missing.length,verified:!missing.length&&!unver.length}; }
function apAsk(id,stage){ if(!need("loans"))return; const l=loanById(id); if(!l)return;

    <div class="form-msg" id="apMsg"></div><div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="apSave('${id}','${stage}')">Confirm</button></div>`); }
async function apSave(id,stage){ const l=loanById(id), msg=document.getElementById("apMsg"), note=(document.getElementById("apNote").value||"").trim(); if(!l||!need("loans"))return;
  if(stage==="rejected"&&!note){ msg.textContent="Enter the reason for the rejection."; return; }
  const d=docStatus(l); if(stage==="submitted"&&!d.complete){ msg.textContent="Upload the missing documents first: "+d.missing.map(x=>x.c).join(", ")+"."; return; }

  try{ await metaCommit(m=>{ const e=m.loans[id]||(m.loans[id]={}), a=e.ap||(e.ap={s:"applied",h:[]}); a.s=stage; a.h=(a.h||[]).concat([{s:stage,at:apNow(),by:apBy(),n:note||undefined}]).slice(-30); }); }
  catch(err){ msg.textContent="Could not save: "+friendlyErr(err); return; }
  logAudit("update","loan",id+"|approval: "+stage); closeModal(); toast("Marked "+apLabel(stage).toLowerCase()); await reloadRender(); }

function apCardHTML(l){ if(!STORE.hasSeq)return ""; const a=l.ap, d=docStatus(l), can=caps().loans, cur=a?a.s:null, ix=AP_STAGES.findIndex(x=>x[0]===cur), nxt=ix>=0&&ix<AP_STAGES.length-1?AP_STAGES[ix+1]:null;

  const hist=a&&a.h&&a.h.length?`<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12.5px;font-weight:600">Approval history (${a.h.length})</summary><div class="hintline" style="line-height:1.8">${a.h.slice().reverse().map(h=>`${esc(h.at||"")} &middot; <b>${esc(apLabel(h.s))}</b>${h.by?" by "+esc(h.by):""}${h.n?" &mdash; "+esc(h.n):""}`).join("<br>")}</div></details>`:"";

function timelineBody(d,fit){

  const per=d.periods.length?`<div class="hintline" style="margin:14px 0 6px"><b>Overlapping periods</b></div><div class="tablewrap" style="box-shadow:none"><table><thead><tr><th>Period</th><th>Loans running together</th><th class="num">At once</th><th class="num">Peak per month</th><th></th></tr></thead><tbody>${d.periods.map(p=>`<tr><td>${esc(monthLabel(p.a))}${p.b>p.a?" &ndash; "+esc(monthLabel(p.b)):""}</td><td>${[...p.loans.values()].map(x=>agencyPill(x.l.agency)+" "+typePill(x.l.loanType)+seqPill(x.l)).join(" ")}</td><td class="num">${p.peakN}</td><td class="num">${peso(p.peakTotal)}</td><td>${p.sameType?'<span class="pill warn">same type</span> ':""}${p.over?'<span class="pill danger">over limit</span>':""}</td></tr>`).join("")}</tbody></table></div>`

  return facts+`<div style="overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:6px 4px">${timelineSVG(d,fit)}</div>${leg}${per}${un}<p class="actnote">Closed loans end at their last payment. Open loans end at their projected payoff from the remaining balance and monthly amortization. Click a bar to open that loan.</p>`; }

async function saveEmployee(oldName){
  if(!need('employees'))return;
  const nm=document.getElementById("emName").value.trim(), msg=document.getElementById("emMsg");
  const email=document.getElementById("emEmail").value.trim()||null;
  const oldEmail=oldName?((STORE.empEmail||{})[oldName]||null):null;
  const cidEl=document.getElementById("emCid"), cid=(STORE.hasCid&&cidEl)?(cidEl.value.trim()||null):null;
  const stEl=document.getElementById("emStatus"), stv=(STORE.hasSt&&stEl)?(stEl.value||null):null;
  const empExtra={}; if(STORE.hasCid)empExtra.company_id=cid; if(STORE.hasSt)empExtra.employment_status=stv;
  { const dEl=document.getElementById("emDept"); if(STORE.hasDept)empExtra.department=(dEl&&dEl.value)||null; }
  const salEl=document.getElementById("emSalary"), salTouched=!!(STORE.hasSal&&CURRENT_ROLE==="admin"&&salEl); let sal=null;
  if(salTouched){ const v=salEl.value.trim().replace(/[₱,\s]/g,""); if(v!==""){ sal=Number(v); if(isNaN(sal)||sal<=0){msg.textContent="Monthly salary must be a positive number, or left blank.";return;} sal=round2(sal); } }
  if(!nm){msg.textContent="Enter a name.";return;}
  if(cid&&Object.keys(STORE.empCid||{}).some(k=>k!==oldName&&empNorm(STORE.empCid[k])===empNorm(cid))){msg.textContent="That company ID is already used by another employee.";return;}
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.textContent="Enter a valid email, or leave it blank.";return;}
  if(STORE.employees.some(e=>e.toLowerCase()===nm.toLowerCase()&&e!==oldName)){msg.textContent="That employee already exists.";return;}
  msg.textContent="Saving...";
  try{
    if(oldName){ let r1=await sb.from("employees").update(Object.assign({name:nm,email},empExtra)).eq("name",oldName); if(r1.error)throw r1.error;
      if(!DB_IDLINK){ let r2=await sb.from("loans").update({employee:nm}).eq("employee",oldName); if(r2.error)throw r2.error; }
      if(nm!==oldName){ await sb.from("profiles").update({employee:nm}).eq("employee",oldName); } }
    else { let r=await sb.from("employees").insert(Object.assign({name:nm,email},empExtra)); if(r.error)throw r.error; }
    if(salTouched){ if(oldName&&nm!==oldName){ const rn=await sb.from("employee_salary").update({employee:nm}).eq("employee",oldName); if(rn.error)throw rn.error; }
      if(sal!=null){ const up=await sb.from("employee_salary").upsert({employee:nm,monthly_salary:sal,updated_at:new Date().toISOString()}); if(up.error)throw up.error; }
      else { const dl=await sb.from("employee_salary").delete().eq("employee",nm); if(dl.error)throw dl.error; } }
  }catch(err){ msg.textContent="Save failed: "+friendlyErr(err); return; }
  logAudit(oldName?"update":"create","employee",(oldName&&oldName!==nm)?(oldName+" -> "+nm):nm);
  // Sync the login account. Idempotent: creates the account if missing, otherwise re-enables and relinks it.
  // An inactive employee's login is never re-enabled by a save; when they first become inactive we offer to remove it.
  const nowInactive=EMP_STATUS.some(x=>x[0]===stv&&x[3]==="inactive"), wasInactive=!!oldName&&empIsInactive(oldName);
  let note="", askRemove=false;
  try{
    if(email&&nowInactive){
      askRemove=!wasInactive; note=` Status is ${empStatusLabel0(stv)}.`;
    } else if(email){
      const changedEmail=oldEmail&&oldEmail.toLowerCase()!==email.toLowerCase();
      const d=await loginSync(nm,email,changedEmail?oldEmail:"");
      note=d.created?` Login created for ${nm} with the Employee role (temporary password Better@1234).`:(wasInactive?` Login for ${nm} was restored and is active.`:` Login for ${nm} is linked and active.`);
      if(d.removed_old){ note+=" The old email's login was deleted."; logAudit("user_delete","user",oldEmail+" (employee email changed)"); }
      if(d.kept_old) note+=` The old email's account was kept (it is a ${d.kept_old} account) and unlinked.`;
    } else if(oldEmail){
      const d=await loginDrop(oldEmail,nm);
      if(d.deleted){ note=" Their login was deleted from Users & Roles."; logAudit("user_delete","user",oldEmail+" (employee email removed)"); }
      else if(d.kept) note=` Their ${d.kept} account was kept and unlinked from this employee.`;
      else note=" No login existed for that email.";
    }
  }catch(e){ closeModal(); toast((oldName?"Employee saved":"Employee added")+", but the login could not be synced: "+(e.message||e)); await reloadRender(); return; }
  closeModal(); toast((oldName?"Employee saved":"Employee added")+note); await reloadRender();
  if(askRemove) promptRemoveLogin(nm,email,empStatusLabel0(stv));
}

/* ===================== BULK UPDATE: COMPANY ID + EMPLOYMENT STATUS ===================== */
/* One editable grid of every employee. Fill it by typing, pasting columns from Excel, or importing a spreadsheet.
   Nothing is written until "Save". Employees are matched by name; blank spreadsheet cells leave the current value alone. */
let BULK={rows:[]};
const bkNorm=v=>String(v==null?"":v).toLowerCase().replace(/[.,]/g," ").replace(/\s+/g," ").trim();
const bkKey=v=>String(v==null?"":v).toLowerCase().replace(/[^a-z0-9]/g,"");
const BK_STATUS_ALIAS={probationary:"probationary",probation:"probationary",prob:"probationary",
  regular:"regular",regularized:"regular",permanent:"regular",
  endofcontract:"end_of_contract",eoc:"end_of_contract",endcontract:"end_of_contract",contractended:"end_of_contract",contractend:"end_of_contract",endedcontract:"end_of_contract",
  terminated:"terminated",termination:"terminated",terminate:"terminated",
  resigned:"resigned",resignation:"resigned",resign:"resigned",
  retired:"retired",retirement:"retired",retiree:"retired"};
function bkParseStatus(v){ const k=bkKey(v); if(!k) return {blank:true}; const hit=BK_STATUS_ALIAS[k]; return hit?{key:hit}:{bad:String(v).trim()}; }
const bkChanged=r=>(STORE.hasCid&&r.cid.trim()!==r.cid0)||(STORE.hasSt&&r.st!==r.st0);
const bkIsInactive=k=>EMP_STATUS.some(x=>x[0]===k&&x[3]==="inactive");

function bulkRefresh(){
  const cnt={}; BULK.rows.forEach(r=>{ const k=empNorm(r.cid); if(k)cnt[k]=(cnt[k]||0)+1; });
  let ch=0, dupChanged=0;
  document.querySelectorAll("#bkBody tr.bkrow").forEach(tr=>{ const r=BULK.rows[+tr.dataset.i]; if(!r)return;
    const c=bkChanged(r), k=empNorm(r.cid), d=!!k&&cnt[k]>1;
    tr.classList.toggle("bk-ch",c&&!d); tr.classList.toggle("bk-dup",d); tr.dataset.ch=c?"1":"";
    if(c)ch++; if(c&&d)dupChanged++;
    tr.querySelector(".bkflag").innerHTML=d?'<span class="pill warn">Duplicate ID</span>':(c?'<span class="pill ok">Changed</span>':""); });
  const btn=document.getElementById("bkSave"); if(btn){ btn.disabled=!ch||dupChanged>0; btn.textContent=ch?`Save ${ch} change${ch!==1?"s":""}`:"Save changes"; }
  const m=document.getElementById("bkMsg"); if(m&&!/^Saving/.test(m.textContent)) m.textContent=dupChanged?"The same company ID is used more than once (highlighted red). Make each one unique to save.":"";
  bulkFilter(ch);

function bulkFilter(chKnown){
  const q=empNorm((document.getElementById("bkSearch")||{}).value||""), toks=q.split(/\s+/).filter(Boolean), only=(document.getElementById("bkOnly")||{}).checked;
  let n=0,t=0,ch=0;

  if(el.classList.contains("bkc")) r.cid=el.value; else r.st=el.value; bulkRefresh(); }
function bulkSetRow(i,cid,st){ const r=BULK.rows[i]; if(!r)return;
  if(cid!=null&&STORE.hasCid){ r.cid=String(cid).trim(); const el=document.querySelector(`.bkc[data-i="${i}"]`); if(el)el.value=r.cid; }

/* Paste a column (or two: Company ID <tab> Status) from Excel; it fills down from the row you pasted into, over the rows currently shown. */
function bulkPaste(ev,el){
  const t=(ev.clipboardData||window.clipboardData).getData("text")||"";
  const trimmed=t.replace(/[\r\n]+$/,""); if(!/[\r\n\t]/.test(trimmed))return; // single value: normal paste
  ev.preventDefault();
  const lines=trimmed.replace(/\r/g,"").split("\n");
  const vis=[...document.querySelectorAll("#bkBody tr.bkrow")].filter(tr=>tr.style.display!=="none").map(tr=>+tr.dataset.i);
  const pos=vis.indexOf(+el.dataset.i); let n=0,bad=0,over=0;
  lines.forEach((ln,k)=>{ const i=vis[pos+k]; if(i==null){over++;return;}
    const cells=ln.split("\t"); const cid=cells[0].trim(); let st=null;
    if(cells.length>1){ const p=bkParseStatus(cells[1]); if(p.key)st=p.key; else if(p.bad)bad++; }
    bulkSetRow(i,cid===""?null:cid,st); n++; });
  bulkRefresh();
  bkNote(`Pasted into <b>${n}</b> row${n!==1?"s":""}.${over?` ${over} extra line${over!==1?"s":""} had no row to go into.`:""}${bad?` ${bad} status value${bad!==1?"s were":" was"} not recognised and skipped.`:""} Review, then press Save.`,!!(over||bad));
}

async function bulkFile(ev){
  const f=ev.target.files[0]; ev.target.value=""; if(!f)return;
  if(f.size>XLSX_MAX_BYTES){ bkNote("That file is too large ("+(f.size/1048576).toFixed(1)+" MB). Use a file under 10 MB.",true); return; }
  bkNote("Reading "+esc(f.name)+"...");
  let grid;
  try{
    if(/\.(csv|txt)$/i.test(f.name)||f.type==="text/csv"){ grid=parseCSV((await f.text()).replace(/^\ufeff/,"")); }
    else{ const X=await loadXlsx(); const wb=X.read(await f.arrayBuffer(),{type:"array"});
      grid=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""}); }
  }catch(e){ bkNote("Could not read that file: "+esc(e.message||e),true); return; }
  grid=(grid||[]).filter(r=>r.some(x=>String(x==null?"":x).trim()!==""));
  const NAME=["employee","employeename","name","fullname"], CID=["companyid","companyidnumber","companyidno","employeeid","employeeno","employeenumber","empid","idnumber","idno","id","cid"], ST=["employmentstatus","status","empstatus","employeestatus"];
  let hi=-1, ci={name:-1,cid:-1,st:-1};
  for(let k=0;k<Math.min(grid.length,15);k++){ const h=grid[k].map(bkKey); const n=h.findIndex(x=>NAME.includes(x)); if(n<0)continue;
    const c=h.findIndex(x=>CID.includes(x)), s=h.findIndex(x=>ST.includes(x)); if(c<0&&s<0)continue; hi=k; ci={name:n,cid:c,st:s}; break; }
  if(hi<0){ bkNote("Could not find the columns. The first row needs headings: <b>Employee</b> plus <b>Company ID</b> and/or <b>Employment status</b>. Use <b>Download list</b> for a ready-made file.",true); return; }
  const byExact={}, byNorm={}; STORE.employees.forEach(n=>{ byExact[n.toLowerCase()]=n; const k=bkNorm(n); if(!(k in byNorm))byNorm[k]=n; });
  const idx={}; BULK.rows.forEach((r,i)=>{ idx[r.name]=i; });

/* ===================== SPREADSHEET EXPORTS (Excel / CSV) ===================== */
/* SheetJS 0.20.3, from the SheetJS CDN (the maker's own, up-to-date source; cdnjs only carries the old 0.18.5, which has known security advisories). */
const XLSX_URL="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
const XLSX_MAX_BYTES=10*1024*1024; /* Excel files larger than this are refused before they are parsed */
let _xlsxPromise=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!_xlsxPromise) _xlsxPromise=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=XLSX_URL; s.async=true;
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("Excel library unavailable"));
    s.onerror=()=>rej(new Error("Could not load the Excel library")); document.head.appendChild(s); })
    .catch(e=>{ _xlsxPromise=null; throw e; });
  return _xlsxPromise;
}
const stamp=()=>ELMS_TIME.todayISO();
function saveBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
// Excel stores dates as day counts; this is the serial for the 1st of a month label (no timezone involved).
function monthSerial(label){ const i=monthIndex(label); if(i<0)return null; const y=BASE_YEAR+Math.floor(i/12), m=((i%12)+12)%12; return Math.round((Date.UTC(y,m,1)-Date.UTC(1899,11,30))/86400000); }
// Column types: text (default), money, int, month
function colValue(c,raw){ return (raw===null||raw===undefined||raw===""||(typeof raw==="number"&&isNaN(raw)))?"":raw; }
function toCSV(cols,rows){
  const q=v=>{ let s=String(v==null?"":v); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const out=[cols.map(c=>q(c.h)).join(",")];
  rows.forEach(r=>out.push(cols.map(c=>{ const v=colValue(c,c.v(r)); if(v==="")return ""; return (c.t==="money"&&typeof v==="number")?v.toFixed(2):(c.t==="dec"&&typeof v==="number")?v.toFixed(1):(typeof v==="number"?String(v):q(v)); }).join(",")));
  return "\ufeff"+out.join("\r\n");
}
function buildSheet(X,cols,rows){
  const aoa=[cols.map(c=>c.h)];
  rows.forEach(r=>aoa.push(cols.map(c=>{ const v=colValue(c,c.v(r)); if(v==="")return null;
    if(c.t==="month"){ const sn=monthSerial(v); return sn==null?String(v):sn; }
    return v; })));
  const ws=X.utils.aoa_to_sheet(aoa);
  const fmt={money:"#,##0.00",int:"0",dec:"0.0",month:"mmmm yyyy"};
  for(let r=1;r<aoa.length;r++) cols.forEach((c,ci)=>{ const f=fmt[c.t]; if(!f)return; const cell=ws[X.utils.encode_cell({r,c:ci})]; if(cell&&cell.t==="n")cell.z=f; });
  ws["!cols"]=cols.map(c=>({wch:c.w||14}));
  ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(aoa.length-1,0),c:cols.length-1}})};
  return ws;
}
// extras: more sheets for the same workbook, [{name,cols,rows}]
async function toXlsxFile(cols,rows,sheetName,filename,extras){
  const X=await loadXlsx();
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,buildSheet(X,cols,rows),sheetName);
  (extras||[]).forEach(s=>X.utils.book_append_sheet(wb,buildSheet(X,s.cols,s.rows),s.name));
  X.writeFile(wb,filename);
}
const EXPORT_NOUN={employees:"employee",calc:"payment",notices:"reminder",ledger:"payment",loans:"loan",arrears:"loan",clearance:"employee","remit-range":"payment",remittances:"reconciliation row"};
// opts.extras: extra worksheets (Excel only). opts.csv: {cols,rows} to use if Excel is unavailable or CSV is chosen. opts.count: number of records for the log/toast.
async function runExport(kind,fmt,cols,rows,sheetName,base,opts){
  opts=opts||{};
  if(!need("export"))return;
  const n=opts.count!=null?opts.count:rows.length;
  if(!n){ toast("Nothing to export yet."); return; }
  const cc=opts.csv?opts.csv.cols:cols, cr=opts.csv?opts.csv.rows:rows;
  let used=fmt;
  if(fmt==="xlsx"){
    toast("Preparing Excel file...");
    try{ await toXlsxFile(cols,rows,sheetName,base+"-"+stamp()+".xlsx",opts.extras); }
    catch(e){ used="csv"; saveBlob(new Blob([toCSV(cc,cr)],{type:"text/csv;charset=utf-8"}),base+"-"+stamp()+".csv");
      toast("Could not load the Excel library, so a CSV was downloaded instead (it opens in Excel too)."); logAudit("export",kind,"CSV \u00b7 "+n+" rows"); return; }
  } else saveBlob(new Blob([toCSV(cc,cr)],{type:"text/csv;charset=utf-8"}),base+"-"+stamp()+".csv");
  logAudit("export",kind,used.toUpperCase()+" \u00b7 "+n+" rows");
  const noun=EXPORT_NOUN[kind]||"record";
  toast(`Exported ${n.toLocaleString()} ${noun}${n>1?"s":""} to ${used==="xlsx"?"Excel":"CSV"}`);
}

// A loan is behind when the amortization due through the "as of" month (capped at the loan's total)
// is more than what has actually been paid. Same rule as the dashboard, with a selectable month.
function arrearsData(asOf){
  const ai=monthIndex(asOf), all=[]; let skipped=0;
  STORE.loans.filter(l=>l.status==="active").forEach(l=>{
    const s=loanStats(l); if(s.fullyPaid) return;
    const fi=monthIndex(l.firstMonth);
    if(typeof s.obligation!=="number"||!(l.monthlyAmort>0)||fi<0){ skipped++; return; }
    const expected=round2(Math.min(Math.max(0,ai-fi+1)*l.monthlyAmort,s.obligation));
    const behind=round2(expected-s.totalPaid); if(behind<=0.005) return;
    const mb=behind/l.monthlyAmort;
    all.push({l,s,expected,behind,mb,bucket:Math.min(SETTINGS.sevMonths,Math.max(1,Math.ceil(mb-0.001))),email:(STORE.empEmail||{})[l.employee]||""});
  });
  all.sort((a,b)=>b.behind-a.behind||a.l.employee.localeCompare(b.l.employee));
  return {asOf,all,skipped};
}
const ARR_G={behind:x=>x.behind,employee:x=>x.l.employee,agency:x=>agencyDisp(x.l.agency),monthly:x=>numOrNull(x.l.monthlyAmort),paid:x=>x.s.totalPaid,mb:x=>x.mb,lastMonth:x=>(x.s.lastMonth&&x.s.lastMonth!=="none")?monIdxOrNull(x.s.lastMonth):null,balance:x=>numOrNull(x.s.balance)};

  const rows=sortRows("arrears",d.all.filter(x=>(!q||empMatches(x.l.employee,q))&&(!ag||x.l.agency===ag)&&x.bucket>=mn),ARR_G,(a,b)=>a.l.employee.localeCompare(b.l.employee));
  const sum=a=>round2(a.reduce((t,x)=>t+x.behind,0));
  return {asOf,rows,all:d.all,skipped:d.skipped,total:sum(rows),sss:sum(rows.filter(x=>x.l.agency==="SSS")),hdmf:sum(rows.filter(x=>x.l.agency==="HDMF")),
    people:new Set(rows.map(x=>x.l.employee)).size,severe:rows.filter(x=>x.bucket>=SETTINGS.sevMonths).length,filtered:rows.length!==d.all.length};
}
