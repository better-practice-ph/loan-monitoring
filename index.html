function printStatement(name){
  const loans=STORE.loans.filter(l=>l.employee===name);
  let html=`<div class="ph">Employee: ${esc(name)} &middot; Generated ${new Date().toLocaleDateString(PREF.locale)}</div>`;
  if(!loans.length)html+="<p>No loans on file.</p>";
  loans.forEach(l=>{ const s=loanStats(l); let run=0;
    html+=`<h2>${agencyDisp(l.agency)} ${esc(l.loanType)}${l.reference?' ('+esc(l.reference)+')':''}</h2>
      <p style="font-size:11px;margin:0 0 6px">Total to pay: ${typeof s.obligation==="number"?peso(s.obligation):"not set"} &middot; Monthly amortization: ${typeof l.monthlyAmort==="number"?peso(l.monthlyAmort):"n/a"} &middot; Total paid: ${peso(s.totalPaid)} &middot; Remaining balance: ${typeof s.balance==="number"?peso(s.balance):"n/a"} &middot; Paid through: ${s.lastMonth!=="none"?esc(s.lastMonth):"none"}${s.fullyPaid?" &middot; FULLY PAID":""}</p>
      <table><thead><tr><th>Month</th><th class="num">1st-15th</th><th class="num">16th-30th</th><th class="num">Applied</th><th class="num">Running</th><th>Type</th></tr></thead><tbody>`;
    s.entries.forEach(e=>{ run+=appliedOf(e);
      html+=`<tr><td>${esc(e.applicableMonth)}</td><td class="num">${typeof e.first15==="number"?peso(e.first15):"&#8211;"}</td><td class="num">${typeof e.second15==="number"?peso(e.second15):"&#8211;"}</td><td class="num">${peso(appliedOf(e))}</td><td class="num">${peso(round2(run))}</td><td>${esc(e.paymentType||"")}</td></tr>`;});
    html+=`</tbody></table>`; });
  html+=`<div class="sig">Certified correct: ______________________________</div>`;
  printDoc("Statement of Account",html);
}
function printPayment(id){
  const e=STORE.entries.find(x=>x.id===id); if(!e)return; const l=loanById(e.loanId); if(!l)return;
  let run=0; entriesForLoan(l).forEach(x=>{ if(monthIndex(x.applicableMonth)<=monthIndex(e.applicableMonth)) run+=appliedOf(x); });
  run=round2(run);
  const info=`<table><tbody>
    <tr><td><b>Employee</b></td><td>${esc(l.employee)}</td></tr>
    <tr><td><b>Agency</b></td><td>${agencyDisp(l.agency)}</td></tr>
    <tr><td><b>Loan type</b></td><td>${esc(l.loanType)}${l.reference?' ('+esc(l.reference)+')':''}</td></tr>
    <tr><td><b>Applicable month</b></td><td>${esc(e.applicableMonth)}</td></tr>
    <tr><td><b>Payment due month</b></td><td>${esc(nextMonth(e.applicableMonth))}</td></tr>
    <tr><td><b>Payment type</b></td><td>${esc(e.paymentType||'')}</td></tr>
    <tr><td><b>OR / Ref no.</b></td><td>${esc(e.orRef||'-')}</td></tr>
  </tbody></table>`;
  const ob=obligationOf(l);
  const bal=(typeof ob==="number")?`<tr><td>Total amount to be paid</td><td class="num">${peso(ob)}</td></tr>
    <tr><td>Remaining balance after this month</td><td class="num">${peso(round2(ob-run))}</td></tr>`:"";
  const amt=`<table><thead><tr><th>Item</th><th class="num">Amount</th></tr></thead><tbody>
    <tr><td>1st - 15th deduction</td><td class="num">${typeof e.first15==="number"?peso(e.first15):'-'}</td></tr>
    <tr><td>16th - 30th deduction</td><td class="num">${typeof e.second15==="number"?peso(e.second15):'-'}</td></tr>
    <tr><td>Total as recorded</td><td class="num">${typeof e.totalRecorded==="number"?peso(e.totalRecorded):'-'}</td></tr>
    <tr><td><b>Amount paid this month</b></td><td class="num"><b>${peso(appliedOf(e))}</b></td></tr>
    <tr><td>Total paid through ${esc(e.applicableMonth)}</td><td class="num">${peso(run)}</td></tr>
    ${bal}
  </tbody></table>`;
  printDoc("Proof of Loan Payment",`<div class="ph">${esc(l.employee)} &middot; ${agencyDisp(l.agency)} ${esc(l.loanType)} &middot; ${esc(e.applicableMonth)} &middot; Generated ${new Date().toLocaleDateString(PREF.locale)}</div>${info}${amt}<div class="sig">Received / verified by: ______________________________</div>`);
}

}

function filterEmpRows(reset){ if(reset===true)pgReset("emps"); const q=empNorm((document.getElementById("eSearch")||{}).value||""), toks=q.split(/\s+/).filter(Boolean), st=(document.getElementById("eStatus")||{}).value||""; let t=0; const hit=[];
  document.querySelectorAll("#main tr.erow").forEach(tr=>{ t++; const h=tr.dataset.hay||"";

/* ===================== MEMBER SELF-SERVICE ===================== */
let MEMBER_FILTER={loanId:"all",year:"all",month:"all",sort:"desc"};
function setMemberFilter(k,v){ MEMBER_FILTER[k]=v; renderMember(); }
function clearMemberFilter(){ MEMBER_FILTER={loanId:"all",year:"all",month:"all",sort:"desc"}; renderMember(); }
function parseAppMonth(s){ const p=String(s||"").trim().split(/\s+/); return {mon:(p[0]||"").toUpperCase(), year:p[1]||""}; }
function renderMember(){
  const m=document.getElementById("main");
  const all=STORE.loans.slice().sort((a,b)=>a.agency.localeCompare(b.agency)||a.loanType.localeCompare(b.loanType));
  let tPay=0,tPaid=0,tRem=0,hasOb=false;
  all.forEach(l=>{const s=loanStats(l); tPaid+=s.totalPaid; if(typeof s.obligation==="number"){tPay+=s.obligation;hasOb=true;} if(typeof s.balance==="number")tRem+=Math.max(0,s.balance);});
  tPay=round2(tPay);tPaid=round2(tPaid);tRem=round2(tRem);
  const activeN=all.filter(l=>l.status==="active").length;
  const F=MEMBER_FILTER;
  const years=[...new Set(STORE.entries.map(e=>parseAppMonth(e.applicableMonth).year).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
  const loanOpts=`<option value="all"${F.loanId==="all"?" selected":""}>All loans</option>`+all.map(l=>`<option value="${l.id}"${F.loanId===l.id?" selected":""}>${esc(agencyDisp(l.agency)+" "+l.loanType+(l.reference?" ("+l.reference+")":""))}</option>`).join("");
  const yearOpts=`<option value="all"${F.year==="all"?" selected":""}>All years</option>`+years.map(y=>`<option value="${y}"${F.year===y?" selected":""}>${y}</option>`).join("");
  const monthOpts=`<option value="all"${F.month==="all"?" selected":""}>All months</option>`+MONTH_NAMES.map(mn=>`<option value="${mn}"${F.month===mn?" selected":""}>${mn.charAt(0)+mn.slice(1).toLowerCase()}</option>`).join("");
  const sortOpts=`<option value="desc"${F.sort==="desc"?" selected":""}>Newest first</option><option value="asc"${F.sort==="asc"?" selected":""}>Oldest first</option>`;
  const filtered=(F.loanId!=="all"||F.year!=="all"||F.month!=="all");
  let html=`<div class="view"><div class="page-head"><div class="ht"><h2>My Loans</h2><p>Your SSS and Pag-IBIG loans, balances, and contribution history. Use the filters to focus on a loan, year, or month.</p></div></div>
    <div class="kpis">
      <div class="kpi accent-brand"><div class="lab">Active loans</div><div class="val">${activeN}</div><div class="hint">${all.length} total on file</div></div>
      <div class="kpi accent-sss"><div class="lab">Total to be paid</div><div class="val">${hasOb?peso(tPay):'&#8211;'}</div></div>
      <div class="kpi accent-brand"><div class="lab">Total paid</div><div class="val">${peso(tPaid)}</div></div>
      <div class="kpi accent-hdmf"><div class="lab">Remaining balance</div><div class="val">${hasOb?peso(tRem):'&#8211;'}</div></div>
    </div>`;
  html+=`<div id="myReqBox"></div><div id="myLoanReqBox"></div>`;
  if(all.length){
    html+=`<div class="toolbar">
      <select aria-label="Loan" onchange="setMemberFilter('loanId',this.value)">${loanOpts}</select>
      <select aria-label="Year" onchange="setMemberFilter('year',this.value)">${yearOpts}</select>
      <select aria-label="Month" onchange="setMemberFilter('month',this.value)">${monthOpts}</select>
      <select aria-label="Sort" onchange="setMemberFilter('sort',this.value)">${sortOpts}</select>
      ${filtered?`<button class="btn btn-ghost btn-sm" onclick="clearMemberFilter()">Clear filters</button>`:""}
    </div>`;
  }
  if(!all.length){ html+=`<div class="card"><p class="muted">No loans are linked to your account yet. Please contact HR.</p></div>`; }
  const shown=(F.loanId==="all")?all:all.filter(l=>l.id===F.loanId);
  if(all.length && !shown.length){ html+=`<div class="card"><p class="muted">No loan matches the current filter.</p></div>`; }
  shown.forEach(l=>{ const s=loanStats(l);
    let acc=0; const withRun=s.entries.map(e=>{ acc+=appliedOf(e); return {e,run:round2(acc)}; });

  const empExtra={}; if(STORE.hasCid)empExtra.company_id=cid; if(STORE.hasSt)empExtra.employment_status=stv;
  if(!nm){msg.textContent="Enter a name.";return;}
  if(cid&&Object.keys(STORE.empCid||{}).some(k=>k!==oldName&&empNorm(STORE.empCid[k])===empNorm(cid))){msg.textContent="That company ID is already used by another employee.";return;}
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.textContent="Enter a valid email, or leave it blank.";return;}
  if(STORE.employees.some(e=>e.toLowerCase()===nm.toLowerCase()&&e!==oldName)){msg.textContent="That employee already exists.";return;}
  msg.textContent="Saving...";
  try{
    if(oldName){ let r1=await sb.from("employees").update(Object.assign({name:nm,email},empExtra)).eq("name",oldName); if(r1.error)throw r1.error;
      let r2=await sb.from("loans").update({employee:nm}).eq("employee",oldName); if(r2.error)throw r2.error;
      if(nm!==oldName){ await sb.from("profiles").update({employee:nm}).eq("employee",oldName); } }
    else { let r=await sb.from("employees").insert(Object.assign({name:nm,email},empExtra)); if(r.error)throw r.error; }
  }catch(err){ msg.textContent="Save failed: "+(err.message||err); return; }
  logAudit(oldName?"update":"create","employee",(oldName&&oldName!==nm)?(oldName+" -> "+nm):nm);
  // Sync the login account. Idempotent: creates the account if missing, otherwise re-enables and relinks it.
  // An inactive employee's login is never re-enabled by a save; when they first become inactive we offer to remove it.
  const nowInactive=EMP_STATUS.some(x=>x[0]===stv&&x[3]==="inactive"), wasInactive=!!oldName&&empIsInactive(oldName);
  let note="", askRemove=false;
  try{
    if(email&&nowInactive){
      askRemove=!wasInactive; note=` Status is ${empStatusLabel0(stv)}.`;
    } else if(email){
      const changedEmail=oldEmail&&oldEmail.toLowerCase()!==email.toLowerCase();
      const d=await loginSync(nm,email,changedEmail?oldEmail:"");
      note=d.created?` Login created for ${nm} with the Employee role (temporary password Better@1234).`:(wasInactive?` Login for ${nm} was restored and is active.`:` Login for ${nm} is linked and active.`);
      if(d.removed_old){ note+=" The old email's login was deleted."; logAudit("user_delete","user",oldEmail+" (employee email changed)"); }
      if(d.kept_old) note+=` The old email's account was kept (it is a ${d.kept_old} account) and unlinked.`;
      if(d.legacy&&changedEmail) note+=" Update the admin-users function to delete old logins automatically.";
    } else if(oldEmail){
      const d=await loginDrop(oldEmail,nm);
      if(d.legacy) note=" Their login was disabled and unlinked. Update the admin-users function to delete it automatically.";
      else if(d.deleted){ note=" Their login was deleted from Users & Roles."; logAudit("user_delete","user",oldEmail+" (employee email removed)"); }
      else if(d.kept) note=` Their ${d.kept} account was kept and unlinked from this employee.`;
      else note=" No login existed for that email.";
    }
  }catch(e){ closeModal(); toast((oldName?"Employee saved":"Employee added")+", but the login could not be synced: "+(e.message||e)); await reloadRender(); return; }
  closeModal(); toast((oldName?"Employee saved":"Employee added")+note); await reloadRender();
  if(askRemove) promptRemoveLogin(nm,email,empStatusLabel0(stv));
}

const bkKey=v=>String(v==null?"":v).toLowerCase().replace(/[^a-z0-9]/g,"");
const BK_STATUS_ALIAS={probationary:"probationary",probation:"probationary",prob:"probationary",
  regular:"regular",regularized:"regular",permanent:"regular",
  endofcontract:"end_of_contract",eoc:"end_of_contract",endcontract:"end_of_contract",contractended:"end_of_contract",contractend:"end_of_contract",endedcontract:"end_of_contract",

function bkParseStatus(v){ const k=bkKey(v); if(!k) return {blank:true}; const hit=BK_STATUS_ALIAS[k]; return hit?{key:hit}:{bad:String(v).trim()}; }
const bkChanged=r=>(STORE.hasCid&&r.cid.trim()!==r.cid0)||(STORE.hasSt&&r.st!==r.st0);

function bulkRefresh(){

    tr.classList.toggle("bk-ch",c&&!d); tr.classList.toggle("bk-dup",d); tr.dataset.ch=c?"1":"";
    if(c)ch++; if(c&&d)dupChanged++;
    tr.querySelector(".bkflag").innerHTML=d?'<span class="pill warn">Duplicate ID</span>':(c?'<span class="pill ok">Changed</span>':""); });
  const btn=document.getElementById("bkSave"); if(btn){ btn.disabled=!ch||dupChanged>0; btn.textContent=ch?`Save ${ch} change${ch!==1?"s":""}`:"Save changes"; }
  const m=document.getElementById("bkMsg"); if(m&&!/^Saving/.test(m.textContent)) m.textContent=dupChanged?"The same company ID is used more than once (highlighted red). Make each one unique to save.":"";

function bulkFilter(chKnown){

function bulkSetRow(i,cid,st){ const r=BULK.rows[i]; if(!r)return;

/* Paste a column (or two: Company ID <tab> Status) from Excel; it fills down from the row you pasted into, over the rows currently shown. */
function bulkPaste(ev,el){
  const t=(ev.clipboardData||window.clipboardData).getData("text")||"";
  const trimmed=t.replace(/[\r\n]+$/,""); if(!/[\r\n\t]/.test(trimmed))return; // single value: normal paste
  ev.preventDefault();
  const lines=trimmed.replace(/\r/g,"").split("\n");
  const vis=[...document.querySelectorAll("#bkBody tr.bkrow")].filter(tr=>tr.style.display!=="none").map(tr=>+tr.dataset.i);
  const pos=vis.indexOf(+el.dataset.i); let n=0,bad=0,over=0;
  lines.forEach((ln,k)=>{ const i=vis[pos+k]; if(i==null){over++;return;}
    const cells=ln.split("\t"); const cid=cells[0].trim(); let st=null;
    if(cells.length>1){ const p=bkParseStatus(cells[1]); if(p.key)st=p.key; else if(p.bad)bad++; }
    bulkSetRow(i,cid===""?null:cid,st); n++; });
  bulkRefresh();
  bkNote(`Pasted into <b>${n}</b> row${n!==1?"s":""}.${over?` ${over} extra line${over!==1?"s":""} had no row to go into.`:""}${bad?` ${bad} status value${bad!==1?"s were":" was"} not recognised and skipped.`:""} Review, then press Save.`,!!(over||bad));
}
async function bulkTemplate(){

async function bulkFile(ev){
  const f=ev.target.files[0]; ev.target.value=""; if(!f)return;
  bkNote("Reading "+esc(f.name)+"...");
  let grid;
  try{
    if(/\.(csv|txt)$/i.test(f.name)||f.type==="text/csv"){ grid=parseCSV((await f.text()).replace(/^\ufeff/,"")); }
    else{ const X=await loadXlsx(); const wb=X.read(await f.arrayBuffer(),{type:"array"});
      grid=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""}); }
  }catch(e){ bkNote("Could not read that file: "+esc(e.message||e),true); return; }
  grid=(grid||[]).filter(r=>r.some(x=>String(x==null?"":x).trim()!==""));
  const NAME=["employee","employeename","name","fullname"], CID=["companyid","companyidnumber","companyidno","employeeid","employeeno","employeenumber","empid","idnumber","idno","id","cid"], ST=["employmentstatus","status","empstatus","employeestatus"];
  let hi=-1, ci={name:-1,cid:-1,st:-1};
  for(let k=0;k<Math.min(grid.length,15);k++){ const h=grid[k].map(bkKey); const n=h.findIndex(x=>NAME.includes(x)); if(n<0)continue;
    const c=h.findIndex(x=>CID.includes(x)), s=h.findIndex(x=>ST.includes(x)); if(c<0&&s<0)continue; hi=k; ci={name:n,cid:c,st:s}; break; }
  if(hi<0){ bkNote("Could not find the columns. The first row needs headings: <b>Employee</b> plus <b>Company ID</b> and/or <b>Employment status</b>. Use <b>Download list</b> for a ready-made file.",true); return; }
  const byExact={}, byNorm={}; STORE.employees.forEach(n=>{ byExact[n.toLowerCase()]=n; const k=bkNorm(n); if(!(k in byNorm))byNorm[k]=n; });
  const idx={}; BULK.rows.forEach((r,i)=>{ idx[r.name]=i; });
  let total=0, matched=0; const unmatched=[], badSt=[], ignored=[];
  for(let k=hi+1;k<grid.length;k++){ const row=grid[k]; const nm=String(row[ci.name]==null?"":row[ci.name]).trim(); if(!nm)continue; total++;
    const target=byExact[nm.toLowerCase()]||byNorm[bkNorm(nm)]; if(!target){ unmatched.push(nm); continue; }
    matched++; const i=idx[target];
    if(ci.cid>=0){ const v=String(row[ci.cid]==null?"":row[ci.cid]).trim(); if(v!=="")bulkSetRow(i,v,null); }
    if(ci.st>=0){ const p=bkParseStatus(row[ci.st]); if(p.key)bulkSetRow(i,null,p.key); else if(p.bad)badSt.push(nm+" (\u201c"+p.bad+"\u201d)"); } }
  bulkRefresh();
  const list=(a,lim)=>a.slice(0,lim).map(esc).join("; ")+(a.length>lim?` and ${a.length-lim} more`:"");
  const changed=BULK.rows.filter(bkChanged).length;
  bkNote(`Read <b>${total}</b> row${total!==1?"s":""} from <b>${esc(f.name)}</b>: <b>${matched}</b> matched an employee, giving <b>${changed}</b> change${changed!==1?"s":""} in the table below.`
    +(unmatched.length?`<br><b>${unmatched.length} name${unmatched.length!==1?"s":""} not found, skipped:</b> ${list(unmatched,8)}`:"")
    +(badSt.length?`<br><b>${badSt.length} status value${badSt.length!==1?"s":""} not recognised, skipped:</b> ${list(badSt,6)}. Use one of: ${EMP_STATUS.map(x=>x[1]).join(", ")}.`:"")
    +(ignored.length?`<br><b>Ignored:</b> ${ignored.join(", ")}.`:"")
    +`<br>Review the highlighted rows, then press <b>Save</b>. Nothing has been saved yet.`, !!(unmatched.length||badSt.length||ignored.length));
}
async function saveBulk(){
  if(!need("employees"))return;
  const ch=BULK.rows.filter(bkChanged); if(!ch.length)return;
  const msg=document.getElementById("bkMsg"), btn=document.getElementById("bkSave");
  const cnt={}; BULK.rows.forEach(r=>{ const k=empNorm(r.cid); if(k)cnt[k]=(cnt[k]||0)+1; });
  if(ch.some(r=>{ const k=empNorm(r.cid); return k&&cnt[k]>1; })){ msg.textContent="Make each company ID unique first (highlighted red)."; return; }
  btn.disabled=true; msg.textContent=`Saving... 0 of ${ch.length}`;
  const ok=[], fail=[]; let done=0;
  for(let k=0;k<ch.length;k+=8){
    await Promise.all(ch.slice(k,k+8).map(async r=>{
      const upd={}; if(STORE.hasCid&&r.cid.trim()!==r.cid0)upd.company_id=r.cid.trim()||null; if(STORE.hasSt&&r.st!==r.st0)upd.employment_status=r.st||null;
      try{ const {error}=await sb.from("employees").update(upd).eq("name",r.name); if(error)throw error; ok.push(r); }
      catch(e){ fail.push(r.name+": "+(e.message||e)); }
      done++; msg.textContent=`Saving... ${done} of ${ch.length}`; })); }
  if(ok.length) logAudit("bulk_update","employee",ok.length+" employee"+(ok.length!==1?"s":"")+" (company ID / status)");
  // Same login rules as the single Edit form: newly inactive -> offer to remove login; back to active -> restore login.
  const emailOf=n=>(STORE.empEmail||{})[n];
  const gone=ok.filter(r=>emailOf(r.name)&&bkIsInactive(r.st)&&!bkIsInactive(r.st0));
  const back=ok.filter(r=>emailOf(r.name)&&!bkIsInactive(r.st)&&bkIsInactive(r.st0));
  let restoreFail=0;
  for(const r of back){ try{ await loginSync(r.name,emailOf(r.name),""); }catch(e){ restoreFail++; } }
  closeModal(); await reloadRender();
  let t=`Updated ${ok.length} employee${ok.length!==1?"s":""}.`;
  if(back.length) t+=restoreFail?` ${restoreFail} login${restoreFail!==1?"s":""} could not be restored; open Edit on those employees.`:` ${back.length} login${back.length!==1?"s":""} restored.`;
  if(fail.length) t+=` ${fail.length} failed (${esc(fail[0])}${fail.length>1?", ...":""}).`;
  toast(t);
  if(gone.length){
    const names=gone.slice(0,5).map(r=>esc(r.name)).join(", ")+(gone.length>5?` and ${gone.length-5} more`:"");
    confirmModal(`Remove login for ${gone.length} inactive employee${gone.length!==1?"s":""}?`,
      `${names} ${gone.length===1?"is":"are"} now inactive. Remove ${gone.length===1?"their login":"their logins"} so they can no longer sign in? Loans and payment history are kept. Choosing Cancel leaves the logins active. Setting an active status again restores them.`,
      (async()=>{ let bad=0; for(const r of gone){ try{ const {data,error}=await sb.functions.invoke("manage-user",{body:{action:"disable_email",email:emailOf(r.name)}});
            if(error||(data&&data.error))throw new Error(); logAudit("access_removed","employee",r.name+" ("+empStatusLabel0(r.st)+")"); }catch(e){ bad++; } }
        toast(bad?`Removed ${gone.length-bad} login${gone.length-bad!==1?"s":""}; ${bad} could not be removed.`:`Removed ${gone.length} login${gone.length!==1?"s":""}.`); }),null,"Remove logins"); }
}

const XLSX_URL="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
let _xlsxPromise=null;
function loadXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!_xlsxPromise) _xlsxPromise=new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=XLSX_URL; s.async=true;
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("Excel library unavailable"));
    s.onerror=()=>rej(new Error("Could not load the Excel library")); document.head.appendChild(s); })
    .catch(e=>{ _xlsxPromise=null; throw e; });
  return _xlsxPromise;
}
const stamp=()=>new Date().toISOString().slice(0,10);
function saveBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
// Excel stores dates as day counts; this is the serial for the 1st of a month label (no timezone involved).
function monthSerial(label){ const i=monthIndex(label); if(i<0)return null; const y=BASE_YEAR+Math.floor(i/12), m=((i%12)+12)%12; return Math.round((Date.UTC(y,m,1)-Date.UTC(1899,11,30))/86400000); }
// Column types: text (default), money, int, month
function colValue(c,raw){ return (raw===null||raw===undefined||raw===""||(typeof raw==="number"&&isNaN(raw)))?"":raw; }
function toCSV(cols,rows){
  const q=v=>{ let s=String(v==null?"":v); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const out=[cols.map(c=>q(c.h)).join(",")];
  rows.forEach(r=>out.push(cols.map(c=>{ const v=colValue(c,c.v(r)); if(v==="")return ""; return (c.t==="money"&&typeof v==="number")?v.toFixed(2):(c.t==="dec"&&typeof v==="number")?v.toFixed(1):(typeof v==="number"?String(v):q(v)); }).join(",")));
  return "\ufeff"+out.join("\r\n");
}
function buildSheet(X,cols,rows){
  const aoa=[cols.map(c=>c.h)];
  rows.forEach(r=>aoa.push(cols.map(c=>{ const v=colValue(c,c.v(r)); if(v==="")return null;
    if(c.t==="month"){ const sn=monthSerial(v); return sn==null?String(v):sn; }
    return v; })));
  const ws=X.utils.aoa_to_sheet(aoa);
  const fmt={money:"#,##0.00",int:"0",dec:"0.0",month:"mmmm yyyy"};
  for(let r=1;r<aoa.length;r++) cols.forEach((c,ci)=>{ const f=fmt[c.t]; if(!f)return; const cell=ws[X.utils.encode_cell({r,c:ci})]; if(cell&&cell.t==="n")cell.z=f; });
  ws["!cols"]=cols.map(c=>({wch:c.w||14}));
  ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(aoa.length-1,0),c:cols.length-1}})};
  return ws;
}
// extras: more sheets for the same workbook, [{name,cols,rows}]
async function toXlsxFile(cols,rows,sheetName,filename,extras){
  const X=await loadXlsx();
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,buildSheet(X,cols,rows),sheetName);
  (extras||[]).forEach(s=>X.utils.book_append_sheet(wb,buildSheet(X,s.cols,s.rows),s.name));
  X.writeFile(wb,filename);
}
const EXPORT_NOUN={calc:"payment",notices:"reminder",ledger:"payment",loans:"loan",arrears:"loan",clearance:"employee","remit-range":"payment",remittances:"reconciliation row"};
// opts.extras: extra worksheets (Excel only). opts.csv: {cols,rows} to use if Excel is unavailable or CSV is chosen. opts.count: number of records for the log/toast.
async function runExport(kind,fmt,cols,rows,sheetName,base,opts){
  opts=opts||{};
  if(!need("export"))return;
  const n=opts.count!=null?opts.count:rows.length;
  if(!n){ toast("Nothing to export yet."); return; }
  const cc=opts.csv?opts.csv.cols:cols, cr=opts.csv?opts.csv.rows:rows;
  let used=fmt;
  if(fmt==="xlsx"){
    toast("Preparing Excel file...");
    try{ await toXlsxFile(cols,rows,sheetName,base+"-"+stamp()+".xlsx",opts.extras); }
    catch(e){ used="csv"; saveBlob(new Blob([toCSV(cc,cr)],{type:"text/csv;charset=utf-8"}),base+"-"+stamp()+".csv");
      toast("Could not load the Excel library, so a CSV was downloaded instead (it opens in Excel too)."); logAudit("export",kind,"CSV \u00b7 "+n+" rows"); return; }
  } else saveBlob(new Blob([toCSV(cc,cr)],{type:"text/csv;charset=utf-8"}),base+"-"+stamp()+".csv");
  logAudit("export",kind,used.toUpperCase()+" \u00b7 "+n+" rows");
  const noun=EXPORT_NOUN[kind]||"record";

}

// A loan is behind when the amortization due through the "as of" month (capped at the loan's total)
// is more than what has actually been paid. Same rule as the dashboard, with a selectable month.
function arrearsData(asOf){
  const ai=monthIndex(asOf), all=[]; let skipped=0;
  STORE.loans.filter(l=>l.status==="active").forEach(l=>{
    const s=loanStats(l); if(s.fullyPaid) return;
    const fi=monthIndex(l.firstMonth);
    if(typeof s.obligation!=="number"||!(l.monthlyAmort>0)||fi<0){ skipped++; return; }
    const expected=round2(Math.min(Math.max(0,ai-fi+1)*l.monthlyAmort,s.obligation));
    const behind=round2(expected-s.totalPaid); if(behind<=0.005) return;
    const mb=behind/l.monthlyAmort;
    all.push({l,s,expected,behind,mb,bucket:Math.min(SETTINGS.sevMonths,Math.max(1,Math.ceil(mb-0.001))),email:(STORE.empEmail||{})[l.employee]||""});
  });
  all.sort((a,b)=>b.behind-a.behind||a.l.employee.localeCompare(b.l.employee));
  return {asOf,all,skipped};
}
const ARR_G={behind:x=>x.behind,employee:x=>x.l.employee,agency:x=>agencyDisp(x.l.agency),monthly:x=>numOrNull(x.l.monthlyAmort),paid:x=>x.s.totalPaid,mb:x=>x.mb,lastMonth:x=>(x.s.lastMonth&&x.s.lastMonth!=="none")?monIdxOrNull(x.s.lastMonth):null,balance:x=>numOrNull(x.s.balance)};

  const rows=sortRows("arrears",d.all.filter(x=>(!q||empMatches(x.l.employee,q))&&(!ag||x.l.agency===ag)&&x.bucket>=mn),ARR_G,(a,b)=>a.l.employee.localeCompare(b.l.employee));
  const sum=a=>round2(a.reduce((t,x)=>t+x.behind,0));
  return {asOf,rows,all:d.all,skipped:d.skipped,total:sum(rows),sss:sum(rows.filter(x=>x.l.agency==="SSS")),hdmf:sum(rows.filter(x=>x.l.agency==="HDMF")),
    people:new Set(rows.map(x=>x.l.employee)).size,severe:rows.filter(x=>x.bucket>=SETTINGS.sevMonths).length,filtered:rows.length!==d.all.length};

function attDropped(ev){ ev.preventDefault(); ev.currentTarget.classList.remove("over"); attPick(ev.dataTransfer&&ev.dataTransfer.files); }
function attPick(files){

/* ===================== SCHEDULED BACKUPS ===================== */
/* A database job (pg_cron) copies every table into backup_snapshots once a day and keeps the newest 30.
   Admins can also take one on demand and download any snapshot as a JSON file. */
const BK_COLS="id,created_at,kind,row_counts,size_bytes,created_by";
const BK={rows:[],loaded:false,loading:false,failed:false,error:"",busy:false};
async function bkLoad(force){
  if(BK.loading||!caps().admin)return; if(BK.loaded&&!force){ bkPaint(); return; }
  BK.loading=true;
  const res=await sb.from("backup_snapshots").select(BK_COLS).order("created_at",{ascending:false}).limit(60);
  BK.loading=false; BK.loaded=true;
  if(res.error){ BK.rows=[]; BK.failed=true; BK.error=String(res.error.message||res.error); }
  else { BK.rows=res.data||[]; BK.failed=false; }
  bkPaint(); if(STATE.view==="dashboard")render(); }
function bkInit(){ if(caps().admin)bkLoad(); }
function bkPaint(){ const el=document.getElementById("bkCard"); if(el)el.innerHTML=bkInner(); }
function bkLastScheduled(){ return BK.rows.find(r=>r.kind==="scheduled")||null; }
function bkNotice(){
  if(!caps().admin||!BK.loaded||BK.failed)return "";
  const last=bkLastScheduled(), hrs=last?(Date.now()-new Date(last.created_at).getTime())/36e5:null;
  if(last&&hrs<=36)return "";
  return `<div class="notice" style="margin-bottom:16px"><b>${last?"The last scheduled backup was "+Math.floor(hrs/24)+" day"+(Math.floor(hrs/24)===1?"":"s")+" ago.":"No scheduled backup has run yet."}</b> The daily job should run every night. <button class="btn btn-ghost btn-sm" onclick="go('settings')">Check backups</button></div>`;
}
function bkInner(){
  const head=`<h3>Backups <span class="tag">${BK.loaded&&!BK.failed?BK.rows.length+" snapshot"+(BK.rows.length===1?"":"s"):"daily, automatic"}</span></h3>
    <p class="sub">A copy of all loans, payments, employees, settings, users and the activity log is saved automatically every day at 2:00 AM Philippine time. The newest 30 daily snapshots are kept. Only administrators can see or download them.</p>`;
  if(BK.failed) return head+`<div class="notice">Could not load backups: ${esc(BK.error)} <button class="btn btn-ghost btn-sm" onclick="bkLoad(true)">Try again</button></div>`;
  if(!BK.loaded) return head+`<div class="muted" style="padding:10px 0">Loading backups...</div>`;
  const last=bkLastScheduled(), w=last?fmtWhen(new Date(last.created_at).getTime()):null, stale=last&&(Date.now()-new Date(last.created_at).getTime())>36*36e5;
  const status=last?`<div class="${stale?"notice":"hintline"}" style="margin:0 0 12px;font-size:13px">Last scheduled backup: <b>${esc(w.abs)}</b>${w.rel?" ("+esc(w.rel)+")":""}${stale?". That is overdue, so check the daily job in Supabase.":""}</div>`
    :`<div class="notice" style="margin-bottom:12px">No scheduled backup has run yet. The first one runs tonight at 2:00 AM, or take one now.</div>`;
  const cnt=r=>{ const c=r.row_counts||{}; return `${(c.loans||0).toLocaleString()} loans, ${(c.ledger_entries||0).toLocaleString()} payments, ${(c.employees||0).toLocaleString()} employees`; };
  const rows=BK.rows.map(r=>{ const t=fmtWhen(new Date(r.created_at).getTime());
    return `<tr><td data-label="When"><b>${esc(t.abs)}</b>${t.rel?`<span class="sub">${esc(t.rel)}</span>`:""}</td>
      <td data-label="Type"><span class="pill ${r.kind==="scheduled"?"ok":"sss"}">${r.kind==="scheduled"?"Scheduled":"Manual"}</span>${r.kind==="manual"&&r.created_by?`<span class="sub">${esc(String(r.created_by).replace(/@bploans\.local$/i,""))}</span>`:""}</td>
      <td data-label="Contents">${esc(cnt(r))}</td><td class="num" data-label="Size">${fmtBytes(r.size_bytes)}</td>
      <td class="act" data-label=""><button class="rowbtn" onclick="bkDownload('${r.id}')">Download</button><button class="rowbtn del" onclick="bkDelete('${r.id}')">Delete</button></td></tr>`; }).join("");
  return head+status+`<div class="setfoot" style="margin:0 0 12px;padding:0;border:none;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="bkNowBtn" onclick="bkNow()" ${BK.busy?"disabled":""}>${BK.busy?"Backing up...":"Back up now"}</button>
      <button class="btn btn-ghost" onclick="exportData()">&#8681;&nbsp; Download current data (JSON)</button></div>
    ${rows?`<div class="tablewrap" style="box-shadow:none;max-height:340px"><table><thead><tr><th>When</th><th>Type</th><th>Contents</th><th class="num">Size</th><th class="act"></th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<div class="actstate" style="padding:18px 10px"><b>No snapshots yet.</b></div>`}`; }
async function bkNow(){
  if(!need("admin")||BK.busy)return; BK.busy=true; bkPaint();
  const {error}=await sb.rpc("take_backup",{p_kind:"manual"}); BK.busy=false;
  if(error){ const m=String(error.message||error); bkPaint(); toast("Backup failed: "+esc(m)); return; }
  logAudit("backup","backup","manual snapshot"); toast("Backup saved"); await bkLoad(true); }
async function bkDownload(id){
  if(!need("admin"))return; toast("Preparing download...");
  const {data,error}=await sb.from("backup_snapshots").select("created_at,kind,data").eq("id",id).maybeSingle();
  if(error||!data){ toast("Could not download: "+esc((error&&error.message)||"snapshot not found")); return; }
  const d=new Date(data.created_at), stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
  const blob=new Blob([JSON.stringify(data.data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`loan-monitoring-snapshot-${data.kind}-${stamp}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  logAudit("export","backup","snapshot "+stamp); toast("Snapshot downloaded"); }
function bkDelete(id){
  if(!need("admin"))return; const r=BK.rows.find(x=>x.id===id); if(!r)return;
  confirmModal("Delete this snapshot?",`The ${r.kind} backup from ${fmtWhen(new Date(r.created_at).getTime()).abs} is removed for good. The daily job keeps making new ones.`,
    (async()=>{ const d=await sb.from("backup_snapshots").delete().eq("id",id); if(d.error){ toast("Delete failed: "+esc(d.error.message)); return; }
      logAudit("backup","backup","deleted snapshot"); toast("Snapshot deleted"); await bkLoad(true); })); }

/* ===================== EDITABLE LOAN + PAYMENT TYPES (Settings) ===================== */
/* The lists live in app_settings so everyone sees the same ones. A type that is already used by a loan or payment cannot be
   renamed or removed (its description can still be edited). Before a NEW type is saved, the database is tested for restrictions
   (a CHECK constraint or enum on loans.loan_type / ledger_entries.payment_type would reject it). The test inserts a row that is
   guaranteed to fail the foreign key, so nothing is stored; if a row ever did slip in, it is deleted straight away. */

const loanUse=(ag,c)=>c?STORE.loans.filter(l=>l.agency===ag&&l.loanType===c).length:0;
const payUse=c=>c?STORE.entries.filter(e=>e.paymentType===c).length:0;
function payTypesWith(cur){ const l=PAYMENT_TYPES.slice(); if(cur&&!l.includes(cur)) l.push(cur); return l; }
function loanTypeFilterOpts(){
  const codes=[]; Object.keys(AGENCY_TYPES).forEach(ag=>AGENCY_TYPES[ag].forEach(o=>{ if(!codes.includes(o[0]))codes.push(o[0]); }));
  STORE.loans.forEach(l=>{ if(l.loanType&&!codes.includes(l.loanType))codes.push(l.loanType); });

  return (err&&err.code==="23514")||/violates check constraint|invalid input value for enum/i.test(m)

async function tySave(){
  if(!need("admin"))return; const msg=document.getElementById("tyMsg"); msg.textContent="";
  const errs=[], loan={}, newLoan=[], newPay=[];
  Object.keys(TY.loan).forEach(ag=>{ const seen={}; loan[ag]=[];
    TY.loan[ag].forEach(x=>{ const c=String(x.c||"").trim().toUpperCase(), n=String(x.n||"").trim();
      if(!c){ errs.push(AGENCY_NAME(ag)+": a loan type has no code."); return; }
      if(!/^[A-Z0-9][A-Z0-9_-]{0,11}$/.test(c)){ errs.push(`${AGENCY_NAME(ag)}: code "${c}" can only use letters, numbers, - and _ (max 12).`); return; }
      if(seen[c]){ errs.push(`${AGENCY_NAME(ag)}: code "${c}" appears twice.`); return; } seen[c]=1;
      loan[ag].push({c,n}); if(c!==x.orig)newLoan.push({ag,c}); });
    if(!loan[ag].length)errs.push(AGENCY_NAME(ag)+" needs at least one loan type."); });
  const pay=[], seenP={};
  TY.pay.forEach(x=>{ const c=String(x.c||"").trim().toUpperCase().replace(/\s+/g," ");
    if(!c){ errs.push("A payment type has no name."); return; }
    if(!/^[A-Z0-9][A-Z0-9 ()_\/.-]{0,23}$/.test(c)){ errs.push(`Payment type "${c}" can only use letters, numbers, spaces and ( ) _ / . - (max 24).`); return; }
    if(seenP[c]){ errs.push(`Payment type "${c}" appears twice.`); return; } seenP[c]=1;
    pay.push(c); if(c!==x.orig)newPay.push(c); });
  if(!seenP.REGULAR)errs.push("The REGULAR payment type is required.");
  if(errs.length){ msg.textContent=errs[0]+(errs.length>1?` (${errs.length-1} more problem${errs.length>2?"s":""})`:""); return; }
  const next=cleanSettings(Object.assign({},SETTINGS,{loanTypes:loan,payTypes:pay}));
  if(JSON.stringify([next.loanTypes,next.payTypes])===JSON.stringify([SETTINGS.loanTypes,SETTINGS.payTypes])){ toast("No changes"); return; }
  if(!await persistSettings(next))return;
  SETTINGS=next; afterSettings();
  const bits=[]; if(newLoan.length)bits.push("loan types "+newLoan.map(x=>x.c).join(", ")); if(newPay.length)bits.push("payment types "+newPay.join(", "));
  logAudit("settings_update","settings","types updated"+(bits.length?": "+bits.join("; "):""));
  render(); toast("Types saved"); }

/* ===================== COLLECTION NOTICES + REMINDER LOG ===================== */
/* One notice per employee covering all of their loans that are behind. Print it, email it, or copy it.
   Every notice (and any phone / in-person follow-up) is recorded in the reminder log, kept in the collection_notices table.
   Notices also appear in Activity. */
let ARSEG="loans"; const ARSEL=new Set(); let NOTE_ROWS=[], NOTE_ASOF="", NCUR=null;
const NOTICES={rows:[],loaded:false,loading:false,failed:false,error:""};
const NOTICE_STAGES=[["reminder1","1st reminder"],["reminder2","2nd reminder"],["final","Final notice"]];
const NOTICE_CHANNELS={print:"Printed",email:"Emailed",copy:"Copied text",phone:"Phone call",inperson:"In person",other:"Other"};
const stageLabel=k=>(NOTICE_STAGES.find(x=>x[0]===k)||[k,k||"Notice"])[1];
const stagePill=k=>`<span class="pill ${k==="final"?"danger":(k==="reminder2"?"warn":"sss")}">${esc(stageLabel(k))}</span>`;
async function loadNotices(force){
  if(NOTICES.loading||(NOTICES.loaded&&!force))return; NOTICES.loading=true;
  const res=await fetchAll(()=>sb.from("collection_notices").select("*").order("created_at",{ascending:false}).order("id",{ascending:false}),{max:20000});
  NOTICES.loading=false; NOTICES.loaded=true;
  if(res.error){ NOTICES.rows=[]; NOTICES.failed=true; NOTICES.error=friendlyErr(String(res.error.message||res.error)); }
  else { NOTICES.rows=res.data||[]; NOTICES.failed=false; NOTICES.error=""; }
  if(STATE.view==="arrears"&&ARSEG!=="loans")renderArrears();
}
const noticeHistory=emp=>NOTICES.rows.filter(r=>r.employee===emp);
const noticeAutoStage=emp=>{ const n=noticeHistory(emp).filter(r=>["print","email","copy"].includes(r.channel)).length; return n>=2?"final":(n===1?"reminder2":"reminder1"); };
const noticeWhen=r=>{ const t=r.created_at?new Date(r.created_at).getTime():NaN; return isNaN(t)?"":fmtWhen(t).abs; };
function setArSeg(sg){ ARSEG=sg; renderArrears(); }
function arSegUI(){
  document.querySelectorAll("#arSeg button").forEach(b=>b.classList.toggle("on",b.dataset.s===ARSEG));
  document.querySelectorAll(".arlo").forEach(el=>el.classList.toggle("hidden",ARSEG==="log")); }

/* ---- notice content (shared by print, email and copy) ---- */
const pesoTxt=n=>"PHP "+Number(n||0).toLocaleString(PREF.locale,{minimumFractionDigits:2,maximumFractionDigits:2});
function noticeData(emp,asOf){
  const items=arrearsData(asOf).all.filter(x=>x.l.employee===emp);
  const total=round2(items.reduce((t,x)=>t+x.behind,0));
  return {emp,asOf,items,total,maxMb:items.reduce((m,x)=>Math.max(m,x.mb),0)}; }
function noticeParts(nd,o){
  const org=SETTINGS.org||"our office", n=nd.items.length, plural=n>1;
  const first=nd.emp.includes(",")?nd.emp.split(",").slice(1).join(",").trim():nd.emp;
  const lead={reminder1:`Our records show that your salary deductions for the loan${plural?"s":""} listed below are behind schedule as of ${nd.asOf}. This is a friendly reminder so that you can get back on track.`,
    reminder2:`This is our second reminder. Our records still show that your salary deductions for the loan${plural?"s":""} listed below are behind schedule as of ${nd.asOf}.`,
    final:`This is a final notice. Our records still show that your salary deductions for the loan${plural?"s":""} listed below remain behind schedule as of ${nd.asOf}, despite our earlier reminders.`}[o.stage]||"";
  const ask=o.settleBy?`Please settle the total arrears of ${pesoTxt(nd.total)} on or before ${o.settleBy}.`:`Please settle the total arrears of ${pesoTxt(nd.total)} or get in touch with us to arrange payment.`;
  const contact=`For questions, or to arrange payment, please contact ${o.contact||"the loan administrator"}.`;
  return {subject:`${stageLabel(o.stage)}: loan arrears as of ${nd.asOf}`,greet:`Dear ${first||nd.emp},`,lead,ask,contact,note:o.note||"",
    close:`If you have already settled this amount, please disregard this notice and let us know so we can update our records. Thank you.`,org}; }
function noticeHTML(nd,o){
  const t=noticeParts(nd,o), cid=empCid(nd.emp), hist=noticeHistory(nd.emp).slice(0,5);
  const rows=nd.items.map(x=>`<tr><td>${agencyDisp(x.l.agency)} ${esc(x.l.loanType)}${x.l.reference?"<br>"+esc(x.l.reference):""}</td><td class="num">${peso(x.l.monthlyAmort)}</td><td class="num">${peso(x.expected)}</td><td class="num">${peso(x.s.totalPaid)}</td><td>${esc(x.s.lastMonth!=="none"?x.s.lastMonth:"no payments")}</td><td class="num">${fmtMB(x.mb)}</td><td class="num"><b>${peso(x.behind)}</b></td></tr>`).join("");
  return `<div class="ph">Date: ${esc(new Date().toLocaleDateString(PREF.locale,{year:"numeric",month:"long",day:"numeric"}))} &middot; As of applicable month: ${esc(nd.asOf)}</div>
    <p><b>To:</b> ${esc(nd.emp)}${cid?" (Company ID "+esc(cid)+")":""}<br><b>Subject:</b> ${esc(t.subject)}</p>
    <p>${esc(t.greet)}</p><p>${esc(t.lead)}</p>
    <table><thead><tr><th>Loan</th><th class="num">Monthly</th><th class="num">Due to date</th><th class="num">Paid to date</th><th>Paid through</th><th class="num">Behind by</th><th class="num">Arrears</th></tr></thead><tbody>${rows}
      <tr><td colspan="6"><b>Total arrears</b></td><td class="num"><b>${peso(nd.total)}</b></td></tr></tbody></table>
    <p><b>${esc(t.ask)}</b></p>${t.note?`<p>${esc(t.note).replace(/\n/g,"<br>")}</p>`:""}<p>${esc(t.contact)}</p><p>${esc(t.close)}</p>
    ${hist.length?`<p style="font-size:11.5px;color:#555">Earlier follow-ups: ${hist.map(r=>esc(noticeWhen(r).replace(/,? \d{1,2}:\d{2}.*$/,""))+" ("+esc(NOTICE_CHANNELS[r.channel]||r.channel)+", "+esc(stageLabel(r.level))+")").join("; ")}</p>`:""}
    <div class="sig">Issued by: ______________________________ &nbsp;&nbsp; Received by employee: ______________________________ &nbsp;&nbsp; Date: ____________</div>`; }
function noticeText(nd,o){
  const t=noticeParts(nd,o);
  const lines=nd.items.map(x=>`- ${agencyDisp(x.l.agency)} ${x.l.loanType}${x.l.reference?" ("+x.l.reference+")":""}: behind ${pesoTxt(x.behind)} (${fmtMB(x.mb)}); monthly ${pesoTxt(x.l.monthlyAmort)}; paid through ${x.s.lastMonth!=="none"?x.s.lastMonth:"no payments"}`);
  return [t.greet,"",t.lead,"",...lines,"",`Total arrears: ${pesoTxt(nd.total)}`,"",t.ask,...(t.note?["",t.note]:[]),"",t.contact,"",t.close,"",SETTINGS.org||""].join("\n").trim(); }
function noticeOpts(){
  const g=id=>(document.getElementById(id)||{}).value||"";
  const d=g("ntBy"); let settleBy=""; if(d){ const dt=new Date(d+"T00:00:00"); if(!isNaN(dt)) settleBy=dt.toLocaleDateString(PREF.locale,{year:"numeric",month:"long",day:"numeric"}); }
  const contact=g("ntContact").trim(); try{ localStorage.setItem("elms_notice_contact",contact); }catch(e){}
  return {stage:g("ntStage")||"reminder1",settleBy,contact,note:g("ntNote").trim()}; }
async function logNotice(emp,channel,stage,asOf,amount,loans,note){
  const by=String(CURRENT_USER||"").replace(/@bploans\.local$/i,"");
  logAudit("notice","employee",`${emp} \u00b7 ${NOTICE_CHANNELS[channel]||channel} \u00b7 ${stageLabel(stage)} \u00b7 ${asOf} \u00b7 ${pesoTxt(amount)}`);
  const {error}=await sb.from("collection_notices").insert({employee:emp,channel,level:stage,as_of:asOf,amount,loans,sent_by:by||null,note:note||null});
  if(error){ return false; }
  return true; }
async function afterNoticeLog(ok,what){
  NOTICES.loaded=false; await loadNotices(true);
  toast(ok?`${what} Added to the reminder log.`:`${what} Recorded in Activity only: set up the reminder log table (Reminder log tab) to keep history here.`); }

  const body=NOTE_ROWS.map((r,i)=>{ const l=lastOf(r.emp), cntN=noticeHistory(r.emp).length;
    return `<tr><td data-label="Select"><input type="checkbox" ${ARSEL.has(r.emp)?"checked":""} onchange="arSel(${i},this.checked)" aria-label="Select ${esc(r.emp)}"></td>
    <td data-label="Employee"><b>${esc(r.emp)}</b>${empIsInactive(r.emp)?" "+empStatusPill(r.emp):""}<span class="sub">${r.email?esc(r.email):"no email on file"}</span></td>

    <td data-label="Behind by">${bucketPill(r.bucket)}<span class="sub">${fmtMB(r.mb)}</span></td>
    <td data-label="Last reminder">${logOk?(l?`${esc(noticeWhen(l).replace(/,? \d{1,2}:\d{2}.*$/,""))}<span class="sub">${esc(stageLabel(l.level))} &middot; ${esc(NOTICE_CHANNELS[l.channel]||l.channel)}</span>`:'<span class="muted">none yet</span>'):'<span class="muted">&#8211;</span>'}</td>
    <td class="num" data-label="Sent">${logOk?cntN:"&#8211;"}</td>

function arSel(i,on){ const r=NOTE_ROWS[i]; if(!r)return; if(on)ARSEL.add(r.emp); else ARSEL.delete(r.emp); arSelUpdate(); }
function arSelAll(on){ NOTE_ROWS.forEach(r=>{ if(on)ARSEL.add(r.emp); else ARSEL.delete(r.emp); }); document.querySelectorAll("#arBody tbody input[type=checkbox]").forEach(c=>{ c.checked=on; }); arSelUpdate(); }
function arSelUpdate(){ const b=document.getElementById("arPrintSel"); if(!b)return; const n=ARSEL.size; b.textContent=n?`Print ${n} selected notice${n!==1?"s":""}`:"Print selected notices"; b.disabled=!n; }

/* ---- single notice dialog ---- */
function openNotice(i){

function noticePreview(){ const el=document.getElementById("ntPrev"); if(!el||!NCUR)return; el.innerHTML=noticeHTML(NCUR.nd,noticeOpts()); }
async function noticeAct(kind){

async function bulkNoticePrint(){

// Totals are by applicable month (same basis as the monthly summary); each month is payable the following month.
function rangeData(){
  const from=readMonthYear("rgF"), to=readMonthYear("rgT"), fi=monthIndex(from), ti=monthIndex(to);
  if(fi<0||ti<0) return {error:"Choose a start and end month."};
  if(fi>ti) return {error:"The start month is after the end month."};
  if(ti-fi+1>RANGE_MAX_MONTHS) return {error:"That range is longer than "+RANGE_MAX_MONTHS/12+" years. Pick a shorter one."};
  const detail=STORE.entries.map(e=>({e,l:loanById(e.loanId),i:monthIndex(e.applicableMonth)})).filter(x=>x.l&&x.i>=fi&&x.i<=ti)
    .sort((a,b)=>a.i-b.i||a.l.employee.localeCompare(b.l.employee)||a.l.agency.localeCompare(b.l.agency)||a.l.loanType.localeCompare(b.l.loanType));
  const months=[]; for(let i=fi;i<=ti;i++) months.push({idx:i,month:monthLabel(i),due:nextMonth(monthLabel(i)),sss:0,hdmf:0,total:0,n:0});
  const emps={}; let review=0;
  detail.forEach(({e,l,i})=>{ const a=appliedOf(e), m=months[i-fi], k=l.agency==="SSS"?"sss":"hdmf";
    m[k]=round2(m[k]+a); m.total=round2(m.total+a); m.n++;

    r[k]=round2(r[k]+a); r.total=round2(r.total+a); r.n++; if(needsReview(e))review++; });
  const empRows=Object.values(emps).sort((a,b)=>a.employee.localeCompare(b.employee));
  const sum=k=>round2(months.reduce((t,m)=>t+m[k],0));
  return {from,to,fi,ti,months,empRows,detail,review,sss:sum("sss"),hdmf:sum("hdmf"),total:sum("total"),n:detail.length,
    empty:months.filter(m=>!m.n&&m.idx<=monthIndex(currentMonthName())).length};
}

/* ===================== AGENCY REMITTANCES & RECONCILIATION ===================== */
/* Each payment made to SSS or Pag-IBIG is stored as a remittance: payment reference, official receipt number, date and amount.
   One agency and month can have several (for example a split payment). The agency's own statement for that month is stored
   separately (a total, plus optional per-employee lines). Reconciliation then compares three figures:
   what the ledger says was deducted, what was remitted, and what the agency says it received. */
const REM={rem:[],stm:[],loaded:false,loading:false,failed:false,error:"",month:""};
async function loadRem(force){
  if(REM.loading||(REM.loaded&&!force))return; REM.loading=true;
  const [a,b]=await Promise.all([
    fetchAll(()=>sb.from("agency_remittances").select("*").order("created_at").order("id"),{max:50000}),
    fetchAll(()=>sb.from("agency_statements").select("*").order("created_at").order("id"),{max:50000})]);
  REM.loading=false; REM.loaded=true; const err=a.error||b.error;
  if(err){ REM.rem=[]; REM.stm=[]; REM.failed=true; REM.error=friendlyErr(String(err.message||err)); }
  else { REM.rem=a.data||[]; REM.stm=b.data||[]; REM.failed=false; REM.error=""; }
  if(STATE.view==="remittances")renderRem();
}
const remTol=()=>Math.max(Number(SETTINGS.tol)||0,0.005);
const remAmt=v=>(v===null||v===undefined||v==="")?null:Number(v);
function remNameKey(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9\u00f1]+/g," ").trim().split(" ").filter(Boolean).sort().join(" "); }
function remMatchEmployee(raw){ /* company ID first, then name in any order ("Cruz, Juan" = "Juan Cruz") */
  const t=String(raw||"").trim(); if(!t)return null; const lc=t.toLowerCase();
  const byId=(STORE.employees||[]).find(n=>empCid(n)&&empCid(n).toLowerCase()===lc); if(byId)return byId;
  const k=remNameKey(t); return (STORE.employees||[]).find(n=>remNameKey(n)===k)||null; }
function remParseLines(text){ /* "name, amount" per line (comma or tab separated); lines with no readable amount are returned as skipped */
  const lines=[], skipped=[];
  String(text||"").replace(/\r/g,"").split("\n").forEach(raw=>{ if(!raw.trim())return;
    const cells=(raw.includes("\t")?raw.split("\t"):(parseCSV(raw)[0]||[])).map(x=>String(x).trim());
    for(let i=cells.length-1;i>=2;i--){ /* an unquoted 1,250.00 was split at its comma: join it back */
      if(/^\d{3}(\.\d+)?$/.test(cells[i])&&/^\u20b1?\s*\d{1,3}$/.test(cells[i-1])) cells.splice(i-1,2,cells[i-1]+cells[i]); }
    let amt=NaN, ai=-1; for(let i=cells.length-1;i>=1;i--){ const c=cells[i].replace(/[\u20b1,\s]|php/gi,"").replace(/^\((.*)\)$/,"-$1"); if(c!==""&&!isNaN(Number(c))){ amt=Number(c); ai=i; break; } }
    const name=cells.slice(0,ai>0?ai:1).join(" ").trim();
    if(ai<1||!name||isNaN(amt)) skipped.push(raw.trim()); else lines.push({name,amount:round2(amt)}); });
  return {lines,skipped}; }
/* The three-way comparison for one agency and month. d (optional) is remitData(month), passed in when many months are computed. */
function remRecon(agency,month,d){
  d=d||remitData(month); const key=agency==="SSS"?"sss":"hdmf", rows=d[key], ledger=agency==="SSS"?d.sssTot:d.hdmfTot, tol=remTol();
  const rems=REM.rem.filter(r=>r.agency===agency&&r.applicable_month===month);
  const remitted=round2(rems.reduce((t,r)=>t+(remAmt(r.amount)||0),0));
  const stm=REM.stm.find(r=>r.agency===agency&&r.applicable_month===month)||null;
  const lines=stm&&Array.isArray(stm.lines)?stm.lines:[], linesSum=round2(lines.reduce((t,x)=>t+(Number(x.amount)||0),0));
  const stmTotal=stm?(remAmt(stm.total)!==null?remAmt(stm.total):(lines.length?linesSum:null)):null;
  const dRem=rems.length?round2(remitted-ledger):null, dStmRem=(stmTotal!==null&&rems.length)?round2(stmTotal-remitted):null, dStmLed=stmTotal!==null?round2(stmTotal-ledger):null;
  const off=x=>x!==null&&Math.abs(x)>tol+1e-9;
  let status, label;
  if(!rems.length&&!stm&&ledger<=tol){ status="none"; label="No deductions"; }
  else if(!rems.length&&ledger>tol){ status=stm?"var":"notrem"; label=stm?"Variance":"Not remitted"; }
  else if(!stm){ status=off(dRem)?"var":"await"; label=off(dRem)?"Variance":"Awaiting statement"; }
  else { status=(off(dRem)||off(dStmRem)||off(dStmLed))?"var":"ok"; label=status==="ok"?"Reconciled":"Variance"; }
  const missingReceipt=rems.filter(r=>!String(r.receipt_no||"").trim()).length;
  /* per employee, only when the statement has lines */
  let emp=null;
  if(lines.length){ const m={}; const row=n=>m[n]||(m[n]={name:n,ledger:0,stmt:0,matched:true});
    rows.forEach(x=>{ row(x.l.employee).ledger=round2(row(x.l.employee).ledger+appliedOf(x.e)); });
    lines.forEach(ln=>{ const e=remMatchEmployee(ln.name), n=e||ln.name; const r=row(n); if(!e)r.matched=false; r.stmt=round2(r.stmt+(Number(ln.amount)||0)); });
    emp=Object.values(m).map(r=>{ const diff=round2(r.stmt-r.ledger); let st;
      if(!r.matched)st="unknown"; else if(r.stmt===0&&r.ledger>0)st="missing"; else if(r.ledger===0&&r.stmt!==0)st="notledger"; else st=Math.abs(diff)<=tol+1e-9?"ok":(diff<0?"short":"over");
      return Object.assign(r,{diff,st}); }).sort((a,b)=>a.name.localeCompare(b.name)); }
  return {agency,month,ledger,count:rows.length,rems,remitted,stm,lines,linesSum,stmTotal,dRem,dStmRem,dStmLed,status,label,missingReceipt,emp,
    totalMismatch:!!(stm&&remAmt(stm.total)!==null&&lines.length&&Math.abs(remAmt(stm.total)-linesSum)>tol+1e-9)}; }
const REM_PILL={ok:"ok",var:"danger",notrem:"warn",await:"sss",none:"none"};
const remPill=r=>`<span class="pill ${REM_PILL[r.status]||"type"}">${esc(r.label)}</span>`;
const remDiffTxt=(v,okTxt)=>v===null?'<span class="muted">&#8211;</span>':(Math.abs(v)<=remTol()+1e-9?`<span class="var-pos">${okTxt||"matches"}</span>`:`<span class="var-neg">${v>0?"+":"&minus;"}${peso(Math.abs(v))}</span>`);
function remMonthList(){ /* every month that has deductions, a remittance or a statement, newest first */
  const s=new Set(); STORE.entries.forEach(e=>{ if(monthIndex(e.applicableMonth)>=0)s.add(e.applicableMonth); });
  REM.rem.forEach(r=>{ if(monthIndex(r.applicable_month)>=0)s.add(r.applicable_month); }); REM.stm.forEach(r=>{ if(monthIndex(r.applicable_month)>=0)s.add(r.applicable_month); });
  return [...s].sort((a,b)=>monthIndex(b)-monthIndex(a)); }

function remCardHTML(r){

  const remTable=rows.length?`<div class="tablewrap" style="box-shadow:none;max-height:240px"><table><thead><tr><th>Payment reference</th><th>Receipt no.</th><th>Date paid</th><th class="num">Amount</th><th>Note</th><th class="act"></th></tr></thead><tbody>${tbody}</tbody>

    const line=x=>`<tr><td>${esc(x.name)}</td><td class="num">${peso(x.ledger)}</td><td class="num">${peso(x.stmt)}</td><td class="num">${x.st==="ok"?'<span class="var-pos">matches</span>':`<span class="var-neg">${x.diff>0?"+":"&minus;"}${peso(Math.abs(x.diff))}</span>`}</td><td>${x.st==="ok"?'<span class="pill ok">Matched</span>':`<span class="pill ${stLabel[x.st][0]}">${stLabel[x.st][1]}</span>`}</td></tr>`;
    const th=`<thead><tr><th>Employee</th><th class="num">Ledger</th><th class="num">Statement</th><th class="num">Difference</th><th>Result</th></tr></thead>`;
    empBlock=`<div style="margin-top:12px"><b style="font-size:13px">Employee by employee</b> <span class="hintline">${good.length} of ${r.emp.length} match${bad.length?`, ${bad.length} need attention`:""}</span>

  return `<div class="card" style="margin-bottom:18px"><h3>${agencyPill(ag)} ${esc(agencyDisp(ag))} remittance ${remPill(r)}
      <span style="margin-left:auto;display:flex;gap:6px">${can?`<button class="btn btn-primary btn-sm" onclick="editRem(null,'${ag}')">+ Add remittance</button>`:""}</span></h3>
    <div class="facts" style="margin:0 0 12px">
      ${fact("Deducted per ledger",peso(r.ledger),r.count+" loan"+(r.count===1?"":"s"))}
      ${fact("Remitted to agency",r.rems.length?peso(r.remitted):"&#8211;",r.rems.length+" payment"+(r.rems.length===1?"":"s")+" recorded")}
      ${fact("Per agency statement",r.stmTotal!==null?peso(r.stmTotal):"&#8211;",r.stm?"entered":"not entered")}
      ${fact("Remitted vs ledger",remDiffTxt(r.dRem),r.dRem===null?"nothing remitted yet":(r.dRem<-remTol()?"remitted less than deducted":(r.dRem>remTol()?"remitted more than deducted":"")))}
      ${fact("Statement vs remitted",remDiffTxt(r.dStmRem),r.dStmRem===null?"needs both figures":(r.dStmRem<-remTol()?"agency recorded less than you paid":(r.dStmRem>remTol()?"agency recorded more than you paid":"")))}
      ${fact("Statement vs ledger",remDiffTxt(r.dStmLed),r.dStmLed===null?"needs the statement":"")}</div>
    ${warn.length?`<div class="notice" style="margin:0 0 12px">${warn.map(esc).join(" ")}</div>`:""}
    <div style="margin:4px 0 6px"><b style="font-size:13px">Remittances</b></div>${remTable}
    <div style="margin:12px 0 4px;display:flex;align-items:center;gap:8px"><b style="font-size:13px">Agency statement</b>${can?`<button class="btn btn-ghost btn-sm" onclick="editStm('${ag}')">${r.stm?"Edit statement":"Enter statement"}</button>`:""}</div>${stmBlock}
    ${empBlock}</div>`; }
function renderRem(){

    <div class="tablewrap" style="box-shadow:none;border:none;max-height:360px"><table><thead><tr><th>Applicable month</th><th>SSS</th><th>Pag-IBIG</th></tr></thead><tbody>${mrows||'<tr><td colspan="3" class="muted" style="padding:14px">No months yet.</td></tr>'}</tbody></table></div>
    <p class="actnote">Reconciled means the ledger, the remittances and the statement all agree (within the variance tolerance set in Settings). Variance means at least one pair differs.</p></div>`; }
function remPickMonth(m,toDetail){ REM.month=m; const i=monthIndex(m); if(i>=0)REM.year=BASE_YEAR+Math.floor((i+1)/12); render();

async function saveRem(id){
  if(!need("pay")||saveRem._b)return; const msg=document.getElementById("rfMsg"), g=i=>document.getElementById(i).value.trim();
  const agency=g("rfAg"), month=readMonthYear("rfM"), ref=g("rfRef"), rcpt=g("rfRcpt"), date=g("rfDate"), amt=fnum("rfAmt");
  if(!month){ msg.textContent="Choose the applicable month."; return; } if(!ref){ msg.textContent="Enter the payment reference number."; return; }
  if(amt===null||isNaN(amt)||amt<=0){ msg.textContent="Enter the amount remitted as a number above zero."; return; }
  const dup=REM.rem.find(r=>r.id!==id&&r.agency===agency&&String(r.payment_ref).toLowerCase()===ref.toLowerCase());
  if(dup){ msg.textContent=`Payment reference ${ref} is already recorded for ${agencyDisp(agency)} (${dup.applicable_month}).`; return; }
  const rdup=rcpt?REM.rem.find(r=>r.id!==id&&r.agency===agency&&String(r.receipt_no||"").toLowerCase()===rcpt.toLowerCase()):null;
  if(rdup){ msg.textContent=`Receipt no. ${rcpt} is already recorded for ${agencyDisp(agency)} (${rdup.applicable_month}).`; return; }
  const rec={agency,applicable_month:month,payment_ref:ref,receipt_no:rcpt||null,date_paid:date||null,amount:amt,note:g("rfNote")||null,updated_at:new Date().toISOString()};
  saveRem._b=true; msg.textContent="Saving...";
  try{ let r, rid=id;

    else { rec.created_by=CURRENT_USER; r=await sb.from("agency_remittances").insert(rec).select("id").single(); if(r.data)rid=r.data.id; }
    if(r.error){ msg.textContent="Could not save: "+(r.error.message||r.error); return; }
    logAudit(id?"update":"create","remittance",rid||""); REM.month=month; closeModal(); toast(id?"Remittance updated":"Remittance added"); await loadRem(true); if(STATE.view==="remittances")render();

/* ---- remittance due calendar ---- */
/* Deductions for an applicable month are payable the following month. For each payable month and agency the calendar shows the
   amount due and whether it was remitted: remitted, partly remitted, due this month, overdue, or not yet due. */
REM.year=REM.year||new Date().getFullYear();
function remDue(r){
  const tol=remTol(), cur=monthIndex(currentMonthName()), pay=monthIndex(r.month)+1, out=Math.max(0,round2(r.ledger-r.remitted));
  let k,label,cls;
  if(r.ledger<=tol&&!r.rems.length){ k="none"; label="Nothing payable"; cls="none"; }
  else if(r.rems.length&&r.remitted>=r.ledger-tol-1e-9){ if(r.remitted>r.ledger+tol){ k="over"; label="Over-remitted"; cls="warn"; } else { k="done"; label="Remitted"; cls="ok"; } }
  else if(r.rems.length){ k="partial"; label="Partly remitted"; cls=pay<cur?"danger":"warn"; }
  else if(pay<cur){ k="overdue"; label="Overdue"; cls="danger"; }

const remMonthTitle=s=>{ s=String(s||""); return s.charAt(0)+s.slice(1).toLowerCase(); };

  const tiles=[]; for(let k=0;k<12;k++){ const payIdx=(year-BASE_YEAR)*12+k, app=monthLabel(payIdx-1); tiles.push({payIdx,pay:monthLabel(payIdx),app,v:get(app)}); }
  const late=[]; let lateAmt=0, dueAmt=0, dueN=0, paidYear=0; const cur=monthIndex(currentMonthName());

    <p class="actnote">Each month's deductions are payable the following month. Status comes from the remittances recorded below; it does not know the agency's own deadline, so confirm it with the agency. "Left" is deducted but not yet remitted.</p></div>`; }

async function submitPaymentInner(){

  const w=document.getElementById("apWarn"); if(!w)return; id=id||apCheck._id; apCheck._id=id;
  const r=PR.rows.find(x=>x.id===id), l=r&&loanById(r.loan_id); if(!l){ w.innerHTML=""; return; }
  const month=readMonthYear("apM")||r.applicable_month, amt=fnum("apAmt"), s=loanStats(l); let h="";
  const dup=STORE.entries.find(e=>e.loanId===l.id&&e.applicableMonth===month);
  if(dup) h+=`<div class="notice" style="margin:0 0 10px"><b>${esc(month)} is already recorded on this loan (${peso(appliedOf(dup))}).</b> Change the month, edit that entry, or reject this request.</div>`;
  if(amt!==null&&!isNaN(amt)&&typeof s.balance==="number"&&amt>s.balance+0.005) h+=`<div class="notice" style="margin:0 0 10px">This is more than the remaining balance of ${peso(s.balance)}.</div>`;
  w.innerHTML=h;
}
async function doApprove(id){ if(doApprove._busy)return; doApprove._busy=true; try{ await doApproveInner(id); } finally{ doApprove._busy=false; } }
async function doApproveInner(id){
  if(!need("admin"))return; const r=PR.rows.find(x=>x.id===id), l=r&&loanById(r.loan_id); if(!r||!l)return;
  const g=x=>document.getElementById(x), msg=g("apMsg"), btn=g("apGo");
  const month=readMonthYear("apM")||r.applicable_month, amt=fnum("apAmt"), type=g("apType").value, ref=g("apRef").value.trim()||null, rem=g("apRem").value.trim()||null, note=g("apNote").value.trim();
  if(amt===null||isNaN(amt)||amt<=0){ msg.textContent="Enter an amount greater than zero."; return; }
  const dup=STORE.entries.find(e=>e.loanId===l.id&&e.applicableMonth===month);
  if(dup){ msg.textContent=month+" is already recorded on this loan ("+pesoTxt(appliedOf(dup))+"). Change the month, edit that entry, or reject this request."; return; }
  { const fr=await freshEntries([{loanId:l.id,month}]); /* the database is the authority */
    if(fr.error){ msg.textContent="Could not check for an existing payment, so nothing was posted: "+(fr.error.message||fr.error)+" Try again."; return; }
    const hit=(fr.map.get(dupKey(l.id,month))||[])[0];
    if(hit){ msg.textContent=month+" was just recorded on this loan ("+pesoTxt(appliedOf(hit))+"). Close this, refresh, and edit that entry or reject the request."; return; } }
  btn.disabled=true; msg.textContent="Posting...";
  const {data:{user}}=await sb.auth.getUser();
  const adjusted=Math.abs(Number(r.amount)-amt)>0.004||month!==r.applicable_month;
  const reviewNote=[adjusted?"Posted "+pesoTxt(amt)+" for "+month+" (requested "+pesoTxt(r.amount)+" for "+r.applicable_month+")":"",note].filter(Boolean).join(". ")||null;
  // 1) claim it first so two admins can never post the same request twice
  const claim=await sb.from("payment_requests").update({status:"approved",reviewed_by:user.id,reviewed_at:new Date().toISOString(),review_note:reviewNote}).eq("id",id).eq("status","pending").select("id");
  if(claim.error){ btn.disabled=false; msg.textContent="Could not approve: "+friendlyErr(claim.error); return; }
  if(!claim.data||!claim.data.length){ btn.disabled=false; msg.textContent="Someone else already handled this request. Close this and refresh."; return; }
  // 2) post it to the ledger
  const ins=await sb.from("ledger_entries").insert({loan_id:l.id,applicable_month:month,or_ref:ref,first15:null,second15:null,total_recorded:round2(amt),payment_type:type,remarks:rem}).select("id");
  if(ins.error){ await sb.from("payment_requests").update({status:"pending",reviewed_by:null,reviewed_at:null,review_note:null}).eq("id",id); // undo the claim
    btn.disabled=false; msg.textContent="Could not post the payment, so the request is still pending: "+friendlyErr(ins.error)+typeErrHint(ins.error); return; }
  const eid=ins.data&&ins.data[0]&&ins.data[0].id; if(eid) await sb.from("payment_requests").update({entry_id:eid}).eq("id",id);
  logAudit("request_approve","request",l.employee+" "+month+" "+pesoTxt(amt)+(adjusted?" (adjusted)":""));
  closeModal(); toast("Approved and posted to "+esc(l.employee)+"'s ledger"); await reloadRender(); if(STATE.view==="approvals")apprRefresh();
}
function rejectRequest(id){
  if(!need("admin"))return; const r=PR.rows.find(x=>x.id===id); if(!r||r.status!=="pending"){ toast("This request was already handled."); apprRefresh(); return; }
  const l=loanById(r.loan_id);
  modal(`<h3>Reject payment</h3><p class="muted" style="margin:0 0 10px;font-size:13px">${esc(l?l.employee:"")} submitted ${peso(Number(r.amount))} for ${esc(r.applicable_month)}. Tell them why so they can correct it and submit again.</p>
    <div class="field"><label>Reason (the employee will see this)</label><input id="rjReason" type="text" maxlength="200" autocomplete="off" placeholder="e.g. Reference number not found"></div>
    <div class="form-msg" id="rjMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" id="rjGo" onclick="doReject('${id}')">Reject</button></div>`,"narrow");
}
async function doReject(id){
  if(doReject._busy)return; if(!need("admin"))return; const r=PR.rows.find(x=>x.id===id); if(!r)return;
  const reason=document.getElementById("rjReason").value.trim(), msg=document.getElementById("rjMsg"), btn=document.getElementById("rjGo");
  if(!reason){ msg.textContent="Please give a short reason."; return; }
  doReject._busy=true; btn.disabled=true; msg.textContent="Saving...";
  try{
    const {data:{user}}=await sb.auth.getUser();
    const res=await sb.from("payment_requests").update({status:"rejected",reviewed_by:user.id,reviewed_at:new Date().toISOString(),review_note:reason}).eq("id",id).eq("status","pending").select("id");
    if(res.error){ btn.disabled=false; msg.textContent="Could not reject: "+friendlyErr(res.error); return; }
    if(!res.data||!res.data.length){ btn.disabled=false; msg.textContent="Someone else already handled this request."; return; }
    const l=loanById(r.loan_id); logAudit("request_reject","request",((l&&l.employee)||"")+" "+r.applicable_month+" "+pesoTxt(r.amount));
    closeModal(); toast("Request rejected"); await loadRequests(true); apprPaint();
  } finally { doReject._busy=false; }
}

/* ===================== LOAN REQUESTS (employee asks, admin decides) ===================== */
/* The employee only asks. HR sets the real terms: approving opens the normal Add loan form prefilled from the request, and the
   request is marked approved (and linked to the new loan) when that form is saved. Closing the form leaves it pending. */
const LR={rows:[],loaded:false,loading:false,failed:false,error:"",filter:"pending",pending:0,q:""};
let APPR_TAB="pay", LOANREQ_LINK=null;
const lrAgTxt=r=>agencyDisp(r.agency)+" "+r.loan_type;
async function loadLoanRequests(force){
  if(LR.loading)return; if(LR.loaded&&!force)return; LR.loading=true;
  const res=await sb.from("loan_requests").select("*").order("created_at",{ascending:false}).limit(500);
  LR.loading=false;
  if(res.error){ LR.failed=true; LR.error=friendlyErr(res.error); LR.rows=[]; LR.loaded=false; }
  else { LR.rows=res.data||[]; LR.failed=false; LR.error=""; LR.loaded=true; if(CURRENT_ROLE==="admin")LR.pending=LR.rows.filter(r=>r.status==="pending").length; }
  prBadge();
}
/* the employee's other loans of the same kind that are still running */
const lrActiveSame=r=>STORE.loans.filter(l=>l.employee===r.employee&&l.agency===r.agency&&l.loanType===r.loan_type&&l.status==="active"&&!loanStats(l).fullyPaid);

/* ---------- Employee side ---------- */
function myLoanReqInit(){ if(CURRENT_ROLE!=="member")return; if(LR.loaded){ myLoanReqPaint(); return; } loadLoanRequests().then(myLoanReqPaint); }
function myLoanReqPaint(){
  const box=document.getElementById("myLoanReqBox"); if(!box||CURRENT_ROLE!=="member")return;
  if(!LR.loaded&&!LR.failed){ box.innerHTML=""; return; }
  if(LR.failed){ box.innerHTML=`<div class="notice">Your loan requests could not be loaded: ${esc(LR.error)}</div>`; return; }
  const pend=LR.rows.filter(r=>r.status==="pending").length;
  const rows=LR.rows.map(r=>{
    const info=r.status==="rejected"?`<b>Reason:</b> ${esc(r.review_note||"No reason given")}`:(r.status==="approved"?esc(r.review_note||"Approved. HR has set up your loan; it appears in My Loans."):(r.status==="pending"?"Waiting for HR":""));
    return `<tr><td data-label="Requested">${esc(prWhen(r.created_at))}</td><td data-label="Loan"><b>${esc(lrAgTxt(r))}</b>${r.reason?`<span class="sub">${esc(r.reason)}</span>`:""}</td>
      <td class="num" data-label="Amount"><b>${peso(Number(r.amount_requested))}</b></td><td class="num" data-label="Term">${r.term_months?r.term_months+" mo":"&#8211;"}</td>
      <td data-label="Status">${prPill(r.status)}</td><td class="detail" data-label="Details">${info}</td>
      <td class="act" data-label="">${r.status==="pending"?`<button class="rowbtn del" onclick="cancelLoanRequest('${r.id}')">Cancel</button>`:""}</td></tr>`; }).join("");

      <button class="btn btn-primary btn-sm" onclick="openRequestLoan()">+ Request a loan</button></div>
    <p class="sub-p">Need a new SSS or Pag-IBIG loan? Send your request here. HR reviews it and sets the final amount and terms, and the loan appears in My Loans once it is set up.</p>
    ${rows?`<div class="tablewrap" style="box-shadow:none;border-left:none;border-right:none;border-bottom:none;border-radius:0 0 var(--radius) var(--radius)"><table class="atable"><thead><tr><th>Requested</th><th>Loan</th><th class="num">Amount</th><th class="num">Term</th><th>Status</th><th>Details</th><th class="act"></th></tr></thead><tbody>${rows}</tbody></table></div>`
      :`<div class="actstate" style="padding:6px 18px 20px">No requests yet.</div>`}</div>`;
}
function openRequestLoan(){
  if(CURRENT_ROLE!=="member"){ toast("Loan requests are sent from an employee account."); return; }
  if(!CURRENT_EMP){ toast("Your account isn't linked to an employee record yet. Please contact HR."); return; }
  modal(`<h3>Request a loan</h3><p class="muted" style="margin:0 0 12px;font-size:13px">HR reviews your request and sets the final amount and terms. Sending it does not create a loan.</p>
    <div class="form-grid">
      <div class="field"><label>Agency</label><select id="rqAg" onchange="rqSync()">${opt(AGENCIES,"SSS")}</select></div>
      <div class="field"><label>Loan type</label><select id="rqType" onchange="rqSync(true)"></select></div>
      <div class="field"><label>Amount you want to borrow (&#8369;)</label><input id="rqAmt" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
      <div class="field"><label>Preferred term (months) <span class="muted" style="font-weight:400">(optional)</span></label><input id="rqTerm" type="text" inputmode="numeric" placeholder="e.g. 24" autocomplete="off"></div>
      <div class="field full"><label>Purpose / reason</label><input id="rqReason" type="text" maxlength="200" autocomplete="off" placeholder="e.g. Tuition for the new school year"></div>
    </div><div id="rqWarn"></div><div class="form-msg" id="rqMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="rqGo" onclick="submitLoanRequest()">Send request</button></div>`);
