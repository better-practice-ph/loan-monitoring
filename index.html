/* ===================== LOAN DOCUMENTS (vouchers, scanned SSS / Pag-IBIG papers) ===================== */
/* Files go to a private Supabase Storage bucket; the list lives in the loan_attachments table.
   Files open through short-lived signed links, so nothing is publicly reachable. */
const ATT_BUCKET="loan-documents", ATT_MAX=10*1024*1024, ATT_MAX_FILES=10;
const ATT_CATS=["Voucher","SSS document","Pag-IBIG document","Promissory note / agreement","Official receipt","Other"];
const ATT_EXT={pdf:"application/pdf",jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",heic:"image/heic",heif:"image/heif",
  doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"};
const ATT={loanId:null,rows:[],loaded:false,loading:false,failed:false,error:"",thumbs:{},pick:[]};
const fmtBytes=n=>{ n=Number(n)||0; return n>=1048576?(n/1048576).toFixed(1)+" MB":n>=1024?Math.round(n/1024)+" KB":n+" B"; };
const attExt=name=>{ const m=String(name||"").toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:""; };
const attIsImg=r=>/^image\/(jpeg|png|webp|gif)$/.test(r.mime_type||ATT_EXT[attExt(r.file_name)]||"");
function attInit(){
  if(ATT.loanId!==STATE.loanId){ ATT.loanId=STATE.loanId; ATT.rows=[]; ATT.loaded=false; ATT.failed=false; ATT.thumbs={}; attPaint(); }
  loadAttachments(); }
async function loadAttachments(force){
  if(ATT.loading)return; if(ATT.loaded&&!force){ attPaint(); return; }
  ATT.loading=true; const id=STATE.loanId;
  const res=await sb.from("loan_attachments").select("*").eq("loan_id",id).order("created_at",{ascending:false});
  ATT.loading=false; if(STATE.loanId!==id||STATE.view!=="loanDetail")return;
  ATT.loaded=true;
  if(res.error){ ATT.rows=[]; ATT.failed=true; ATT.error=String(res.error.message||res.error); }
  else { ATT.rows=res.data||[]; ATT.failed=false; }
  attPaint();
  const imgs=ATT.rows.filter(r=>attIsImg(r)&&!ATT.thumbs[r.storage_path]);
  if(imgs.length){ try{ const t=await sb.storage.from(ATT_BUCKET).createSignedUrls(imgs.map(r=>r.storage_path),3600);
      (t.data||[]).forEach(x=>{ if(x.signedUrl&&x.path)ATT.thumbs[x.path]=x.signedUrl; }); if(STATE.loanId===id)attPaint(); }catch(e){ swallow("loadAttachments",e); } } }
function attPaint(){ const el=document.getElementById("attCard"); if(el)el.innerHTML=attInner(); }
function attInner(){
  const l=loanById(STATE.loanId), canEdit=caps().pay, n=ATT.rows.length;
  const head=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0;flex:1">Documents &amp; vouchers <span class="tag">${ATT.loaded&&!ATT.failed?n+" file"+(n!==1?"s":""):"scanned papers"}</span></h3>
    ${canEdit?`<button class="btn btn-primary btn-sm" onclick="openAttUpload()">+ Upload</button>`:""}</div>
    <p class="hintline" style="margin:4px 0 10px;font-size:12.5px">Keep the voucher and the scanned SSS or Pag-IBIG papers with the loan. PDF, photos and Office files up to ${ATT_MAX/1048576} MB each.</p>`;
  if(ATT.failed) return head+`<div class="notice">Could not load documents: ${esc(ATT.error)} <button class="btn btn-ghost btn-sm" onclick="loadAttachments(true)">Try again</button></div>`;
  if(!ATT.loaded) return head+`<div class="muted" style="padding:12px 0">Loading documents...</div>`;
  if(!n) return head+`<div class="actstate" style="padding:22px 10px"><b>No documents yet.</b><br>${canEdit?"Use Upload to attach a voucher or a scanned form.":"Nothing has been attached to this loan."}</div>`;
  const rows=ATT.rows.map(r=>{ const th=ATT.thumbs[r.storage_path], ext=attExt(r.file_name).toUpperCase().slice(0,4)||"FILE";
    const when=r.created_at?new Date(r.created_at).toLocaleDateString(PREF.locale,{timeZone:ELMS_TIME.tz,year:"numeric",month:"short",day:"numeric"}):"";
    return `<tr><td data-label="">${th?`<img class="attth" src="${esc(th)}" alt="">`:`<div class="attfile">${esc(ext)}</div>`}</td>
      <td data-label="File"><b>${esc(r.file_name)}</b>${r.note?`<span class="sub">${esc(r.note)}</span>`:""}</td>
      <td data-label="Type">${typePill(r.category)}</td><td class="num" data-label="Size">${fmtBytes(r.size_bytes)}</td>
      <td data-label="Added">${esc(when)}<span class="sub">${esc(r.uploaded_by||"")}</span></td>
      <td class="act" data-label=""><button class="rowbtn" onclick="attOpen('${r.id}',false)">View</button><button class="rowbtn" onclick="attOpen('${r.id}',true)">Download</button>${canEdit?`<button class="rowbtn del" onclick="attDelete('${r.id}')">Delete</button>`:""}</td></tr>`; }).join("");
  return head+`<div class="tablewrap" style="box-shadow:none;border:none"><table class="atable"><thead><tr><th style="width:1%"></th><th>File</th><th>Type</th><th class="num">Size</th><th>Added</th><th class="act"></th></tr></thead><tbody>${rows}</tbody></table></div>`; }

/* ---- upload ---- */
function openAttUpload(){
  if(!need("pay"))return; const l=loanById(STATE.loanId); if(!l)return; ATT.pick=[];
  const def=l.agency==="SSS"?"SSS document":"Pag-IBIG document";
  modal(`<h3>Attach documents</h3>
    <p class="hintline" style="margin:-8px 0 10px;font-size:12.5px">${esc(l.employee)} &middot; ${agencyDisp(l.agency)} ${esc(l.loanType)}${l.reference?" ("+esc(l.reference)+")":""}</p>
    <div class="attdrop" id="attDrop" onclick="document.getElementById('attFile').click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="attDropped(event)">
      <b>Drop files here</b> or click to choose<br><span style="font-size:11.5px">Up to ${ATT_MAX_FILES} files, ${ATT_MAX/1048576} MB each. On a phone you can take a photo of the paper.</span></div>
    <input type="file" id="attFile" class="hidden" multiple accept="${Object.keys(ATT_EXT).map(e=>"."+e).join(",")},image/*" onchange="attPick(this.files);this.value=''">
    <div id="attPicked" style="margin:8px 0"></div>
    <div class="form-grid"><div class="field"><label>Document type</label><select id="attCat">${opt(ATT_CATS,def)}</select></div>
      <div class="field"><label>Note <span class="muted" style="font-weight:400">(optional)</span></label><input id="attNote" type="text" maxlength="120" placeholder="e.g. Voucher for MARCH 2026"></div></div>
    <div class="form-msg" id="attMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="attGo" onclick="attUpload()" disabled>Upload</button></div>`,"wide"); }
function attDropped(ev){ ev.preventDefault(); ev.currentTarget.classList.remove("over"); attPick(ev.dataTransfer&&ev.dataTransfer.files); }
function attPick(files){
  const msg=document.getElementById("attMsg"); const bad=[];
  [...(files||[])].forEach(f=>{ const e=attExt(f.name);
    if(!ATT_EXT[e]){ bad.push(f.name+" (file type not allowed)"); return; }
    if(f.size>ATT_MAX){ bad.push(f.name+" (over "+ATT_MAX/1048576+" MB)"); return; }
    if(f.size===0){ bad.push(f.name+" (empty)"); return; }
    if(ATT.pick.length>=ATT_MAX_FILES){ bad.push(f.name+" (limit of "+ATT_MAX_FILES+" files)"); return; }
    if(!ATT.pick.some(x=>x.name===f.name&&x.size===f.size)) ATT.pick.push(f); });
  if(msg)msg.textContent=bad.length?"Skipped: "+bad.join("; "):"";
  attPickedPaint(); }
function attPickedPaint(){ const box=document.getElementById("attPicked"), go=document.getElementById("attGo"); if(!box)return;
  box.innerHTML=ATT.pick.map((f,i)=>`<div class="attpick"><span class="nm">${esc(f.name)}</span><span class="muted">${fmtBytes(f.size)}</span><button class="rowbtn del" onclick="ATT.pick.splice(${i},1);attPickedPaint()">Remove</button></div>`).join("");
  if(go){ go.disabled=!ATT.pick.length; go.textContent=ATT.pick.length>1?`Upload ${ATT.pick.length} files`:"Upload"; } }
async function attUpload(){
  if(!need("pay"))return; const l=loanById(STATE.loanId); if(!l||!ATT.pick.length)return;
  const msg=document.getElementById("attMsg"), go=document.getElementById("attGo");
  const cat=document.getElementById("attCat").value, note=(document.getElementById("attNote").value||"").trim()||null;
  const by=String(CURRENT_USER||"").replace(/@bploans\.local$/i,""); go.disabled=true; msg.classList.remove("ok");
  let ok=0; const fails=[]; const total=ATT.pick.length;
  for(let i=0;i<total;i++){ const f=ATT.pick[i]; msg.textContent=`Uploading ${i+1} of ${total}: ${f.name}`;
    const safe=f.name.replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80), path=`${l.id}/${uid()}-${safe}`, mime=ATT_EXT[attExt(f.name)]||f.type||"application/octet-stream";
    const up=await sb.storage.from(ATT_BUCKET).upload(path,f,{contentType:mime,upsert:false});
    if(up.error){ const m=String(up.error.message||up.error);
      fails.push(f.name+": "+m+(/row-level security|policy|not authorized/i.test(m)?" (your role is not allowed to upload documents)":"")); continue; }
    const ins=await sb.from("loan_attachments").insert({loan_id:l.id,category:cat,file_name:f.name,storage_path:path,mime_type:mime,size_bytes:f.size,note,uploaded_by:by||null});
    if(ins.error){ try{ await sb.storage.from(ATT_BUCKET).remove([path]); }catch(e){ swallow("attUpload",e); } const m=String(ins.error.message||ins.error);
      fails.push(f.name+": "+m); continue; }
    ok++; logAudit("attach","document",`${l.employee} \u00b7 ${agencyDisp(l.agency)} ${l.loanType} \u00b7 ${cat} \u00b7 ${f.name}`); }
  if(ok){ STORE.attCount=STORE.attCount||{}; STORE.attCount[l.id]=(STORE.attCount[l.id]||0)+ok; STORE.attCats=STORE.attCats||{}; const cc=STORE.attCats[l.id]=STORE.attCats[l.id]||{}; cc[cat]=(cc[cat]||0)+ok; }
  if(fails.length){ msg.textContent=(ok?`${ok} uploaded. `:"")+"Problem: "+fails.join("; "); go.disabled=false; ATT.pick=ATT.pick.filter(f=>fails.some(m=>m.startsWith(f.name+":"))); attPickedPaint(); if(ok){ ATT.loaded=false; loadAttachments(true); } return; }
  closeModal(); ATT.pick=[]; toast(`${ok} document${ok!==1?"s":""} attached`); ATT.loaded=false; await loadAttachments(true); render_keepScroll(); }
function render_keepScroll(){ const y=window.scrollY; render(); window.scrollTo(0,y); }

async function attOpen(id,dl){

function attDelete(id){

/* ===================== SCHEDULED BACKUPS ===================== */
/* A database job (pg_cron) copies every table into backup_snapshots once a day and keeps the newest 30.
   Admins can also take one on demand and download any snapshot as a JSON file. */
const BK_COLS="id,created_at,kind,row_counts,size_bytes,created_by";
const BK={rows:[],loaded:false,loading:false,failed:false,error:"",busy:false,testing:false,report:null,last:null,autoTried:false};
async function bkLoad(force){
  if(BK.loading||!caps().admin)return; if(BK.loaded&&!force){ bkPaint(); return; }
  BK.loading=true;
  const res=await sb.from("backup_snapshots").select(BK_COLS).order("created_at",{ascending:false}).limit(60);
  BK.loading=false; BK.loaded=true;
  if(res.error){ BK.rows=[]; BK.failed=true; BK.error=String(res.error.message||res.error); }
  else { BK.rows=res.data||[]; BK.failed=false; }
  try{ const t=await sb.from("app_settings").select("value").eq("key","restore_test").maybeSingle(); BK.last=(t.data&&t.data.value)||null; }catch(e){ swallow("bkLoad restore_test",e); }
  bkPaint(); if(STATE.view==="dashboard")render();
  /* once a week, test the newest snapshot without being asked */
  if(!BK.autoTried&&!BK.failed&&BK.rows.length){ BK.autoTried=true; const age=BK.last&&BK.last.at?(Date.now()-new Date(BK.last.at).getTime())/864e5:null;
    if(age===null||age>7)bkRestoreTest(null,true); } }
function bkInit(){ if(caps().admin)bkLoad(); }
function bkPaint(){ const el=document.getElementById("bkCard"); if(el)el.innerHTML=bkInner(); }
function bkLastScheduled(){ return BK.rows.find(r=>r.kind==="scheduled")||null; }
function bkNotice(){
  if(!caps().admin||!BK.loaded||BK.failed)return "";
  const last=bkLastScheduled(), hrs=last?(Date.now()-new Date(last.created_at).getTime())/36e5:null;
  if(last&&hrs<=36){ const t=BK.last&&BK.last.at?(Date.now()-new Date(BK.last.at).getTime())/864e5:null;
    if(BK.last&&BK.last.ok===false)return `<div class="notice" style="margin-bottom:16px"><b>The last backup restore test found problems.</b> A backup may not be restorable. <button class="btn btn-ghost btn-sm" onclick="go('settings')">See details</button></div>`;
    return ""; }
  return `<div class="notice" style="margin-bottom:16px"><b>${last?"The last scheduled backup was "+Math.floor(hrs/24)+" day"+(Math.floor(hrs/24)===1?"":"s")+" ago.":"No scheduled backup has run yet."}</b> The daily job should run every night. <button class="btn btn-ghost btn-sm" onclick="go('settings')">Check backups</button></div>`;
}
function bkInner(){
  const head=`<h3>Backups <span class="tag">${BK.loaded&&!BK.failed?BK.rows.length+" snapshot"+(BK.rows.length===1?"":"s"):"daily, automatic"}</span></h3>
    <p class="sub">A copy of all loans, payments, employees, settings, users and the activity log is saved automatically every day at 2:00 AM Philippine time. The newest 30 daily snapshots are kept. Only administrators can see or download them.</p>`;
  if(BK.failed) return head+`<div class="notice">Could not load backups: ${esc(BK.error)} <button class="btn btn-ghost btn-sm" onclick="bkLoad(true)">Try again</button></div>`;
  if(!BK.loaded) return head+`<div class="muted" style="padding:10px 0">Loading backups...</div>`;
  const last=bkLastScheduled(), w=last?fmtWhen(new Date(last.created_at).getTime()):null, stale=last&&(Date.now()-new Date(last.created_at).getTime())>36*36e5;
  const status=last?`<div class="${stale?"notice":"hintline"}" style="margin:0 0 12px;font-size:13px">Last scheduled backup: <b>${esc(w.abs)}</b>${w.rel?" ("+esc(w.rel)+")":""}${stale?". That is overdue, so check the daily job in Supabase.":""}</div>`
    :`<div class="notice" style="margin-bottom:12px">No scheduled backup has run yet. The first one runs tonight at 2:00 AM, or take one now.</div>`;
  const cnt=r=>{ const c=r.row_counts||{}; return `${(c.loans||0).toLocaleString()} loans, ${(c.ledger_entries||0).toLocaleString()} payments, ${(c.employees||0).toLocaleString()} employees`; };
  const rows=BK.rows.map(r=>{ const t=fmtWhen(new Date(r.created_at).getTime());
    return `<tr><td data-label="When"><b>${esc(t.abs)}</b>${t.rel?`<span class="sub">${esc(t.rel)}</span>`:""}</td>
      <td data-label="Type"><span class="pill ${r.kind==="scheduled"?"ok":"sss"}">${r.kind==="scheduled"?"Scheduled":"Manual"}</span>${r.kind==="manual"&&r.created_by?`<span class="sub">${esc(String(r.created_by).replace(/@bploans\.local$/i,""))}</span>`:""}</td>
      <td data-label="Contents">${esc(cnt(r))}</td><td class="num" data-label="Size">${fmtBytes(r.size_bytes)}</td>

/* ---- Restore test: proves a snapshot can actually be read and rebuilt. Read-only; it never writes to loans or payments. ---- */
function bkTables(d){ const t=(d&&d.tables&&typeof d.tables==="object")?d.tables:d; return (t&&typeof t==="object")?t:{}; }
async function bkRestoreTest(id,silent){
  if(!caps().admin||BK.testing)return; const snap=id?BK.rows.find(r=>r.id===id):BK.rows[0];
  if(!snap){ if(!silent)toast("There is no snapshot to test yet. Take a backup first."); return; }
  BK.testing=true; BK.report=null; bkPaint();
  const checks=[], chk=(name,ok,detail,info)=>checks.push({name,ok:!!ok,detail:detail||"",info:!!info});
  try{
    const g=await sb.from("backup_snapshots").select("id,created_at,kind,row_counts,data").eq("id",snap.id).maybeSingle();
    if(g.error||!g.data)throw new Error((g.error&&g.error.message)||"The snapshot could not be read.");
    let d=g.data.data; if(typeof d==="string")d=JSON.parse(d);
    const T=bkTables(d), loans=Array.isArray(T.loans)?T.loans:null, ents=Array.isArray(T.ledger_entries)?T.ledger_entries:null, emps=Array.isArray(T.employees)?T.employees:null;
    chk("Snapshot opens and holds loans, payments and employees",!!(loans&&ents&&emps),(loans?loans.length.toLocaleString():"no")+" loans, "+(ents?ents.length.toLocaleString():"no")+" payments, "+(emps?emps.length.toLocaleString():"no")+" employees");
    if(loans&&ents){
      const rc=g.data.row_counts||{}, bad=[["loans",loans.length],["ledger_entries",ents.length],["employees",emps?emps.length:0]].filter(x=>rc[x[0]]!=null&&Number(rc[x[0]])!==x[1]);
      chk("Row counts match what was recorded when the snapshot was taken",!bad.length,bad.length?bad.map(x=>x[0]+": "+x[1]+" in file, "+rc[x[0]]+" recorded").join("; "):"all match");
      const dupL=loans.length-new Set(loans.map(r=>String(r.id))).size, dupE=ents.length-new Set(ents.map(r=>String(r.id))).size;
      chk("No repeated record ids",!dupL&&!dupE,dupL||dupE?(dupL+" repeated loan ids, "+dupE+" repeated payment ids"):"none");
      const lid=new Set(loans.map(r=>String(r.id))), orphan=ents.filter(r=>!lid.has(String(r.loan_id))).length;
      chk("Every payment belongs to a loan in the snapshot",!orphan,orphan?orphan+" payments point to a loan that is not in the snapshot":"none orphaned");
      let rebuilt=0,fail=0; for(const r of loans){ try{ rowToLoan(r); rebuilt++; }catch(e){ fail++; } } for(const r of ents){ try{ rowToEntry(r); rebuilt++; }catch(e){ fail++; } }
      const nonNum=ents.filter(r=>r.total_recorded!=null&&!isFinite(Number(r.total_recorded))).length;
      chk("Every record can be rebuilt with usable numbers",!fail&&!nonNum,(rebuilt.toLocaleString())+" rebuilt"+(fail||nonNum?", "+(fail+nonNum)+" unusable":""));
      const [ll,le]=await Promise.all([fetchAll(()=>sb.from("loans").select("id").order("id")),fetchAll(()=>sb.from("ledger_entries").select("id").order("id"))]);
      if(!ll.error&&!le.error){ const liveL=new Set(ll.data.map(r=>String(r.id))), liveE=new Set(le.data.map(r=>String(r.id)));
        const lostL=loans.filter(r=>!liveL.has(String(r.id))).length, lostE=ents.filter(r=>!liveE.has(String(r.id))).length;
        const sl=new Set(loans.map(r=>String(r.id))), se=new Set(ents.map(r=>String(r.id)));
        const newL=[...liveL].filter(x=>!sl.has(x)).length, newE=[...liveE].filter(x=>!se.has(x)).length;
        chk("Compared with live data",true,`restoring would bring back ${lostL} loan${lostL===1?"":"s"} and ${lostE} payment${lostE===1?"":"s"} that no longer exist; ${newL} loan${newL===1?"":"s"} and ${newE} payment${newE===1?"":"s"} were added after the snapshot`,true); } }
    const failed=checks.filter(c=>!c.ok).length, rep={at:new Date().toISOString(),snapshot_id:snap.id,snapshot_at:snap.created_at,ok:failed===0,failed};
    BK.report={snap,checks,ok:failed===0}; BK.last=rep;
    try{ await sb.from("app_settings").upsert({key:"restore_test",value:rep,updated_at:rep.at}); }catch(e){ swallow("bkRestoreTest save",e); }
    logAudit("backup","backup","restore test "+(rep.ok?"passed":"FAILED ("+failed+")")+" for snapshot "+fmtWhen(new Date(snap.created_at).getTime()).abs);
    if(!silent||!rep.ok)toast(rep.ok?"Restore test passed":"Restore test found "+failed+" problem"+(failed===1?"":"s"));
  }catch(e){ BK.report={snap,checks:checks.concat([{name:"Test could not finish",ok:false,detail:friendlyErr(e)}]),ok:false}; BK.last={at:new Date().toISOString(),snapshot_id:snap.id,snapshot_at:snap.created_at,ok:false,failed:1};
    if(!silent)toast("Restore test failed: "+esc(friendlyErr(e))); }
  BK.testing=false; bkPaint(); }
function bkTestPanel(){
  if(BK.testing)return `<div class="hintline" style="margin:0 0 12px">Testing the snapshot... this reads it and checks it against the live data. Nothing is changed.</div>`;
  const L=BK.last, w=L&&L.at?fmtWhen(new Date(L.at).getTime()):null, old=L&&L.at&&(Date.now()-new Date(L.at).getTime())>14*864e5;
  const line=L?`<div class="${L.ok&&!old?"hintline":"notice"}" style="margin:0 0 8px;font-size:13px">Last restore test: <b>${esc(w.abs)}</b> &ndash; ${L.ok?"passed":"<b>"+(L.failed||1)+" problem"+((L.failed||1)===1?"":"s")+" found</b>"}${old?". It is more than 2 weeks old, so test again.":"."}</div>`
    :`<div class="notice" style="margin:0 0 8px;font-size:13px"><b>No restore test has been done.</b> A backup is only useful if it can be restored. Run the test below.</div>`;

async function tySave(){
  if(!need("admin"))return; const msg=document.getElementById("tyMsg"); msg.textContent="";
  const errs=[], loan={}, newLoan=[], newPay=[];
  Object.keys(TY.loan).forEach(ag=>{ const seen={}; loan[ag]=[];
    TY.loan[ag].forEach(x=>{ const c=String(x.c||"").trim().toUpperCase(), n=String(x.n||"").trim();

// Totals are by applicable month (same basis as the monthly summary); each month is payable the following month.
function rangeData(){
  const from=readMonthYear("rgF"), to=readMonthYear("rgT"), fi=monthIndex(from), ti=monthIndex(to);
  if(fi<0||ti<0) return {error:"Choose a start and end month."};
  if(fi>ti) return {error:"The start month is after the end month."};
  if(ti-fi+1>RANGE_MAX_MONTHS) return {error:"That range is longer than "+RANGE_MAX_MONTHS/12+" years. Pick a shorter one."};
  const detail=STORE.entries.map(e=>({e,l:loanById(e.loanId),i:monthIndex(e.applicableMonth)})).filter(x=>x.l&&x.i>=fi&&x.i<=ti)
    .sort((a,b)=>a.i-b.i||a.l.employee.localeCompare(b.l.employee)||a.l.agency.localeCompare(b.l.agency)||a.l.loanType.localeCompare(b.l.loanType));
  const months=[]; for(let i=fi;i<=ti;i++) months.push({idx:i,month:monthLabel(i),due:nextMonth(monthLabel(i)),sss:0,hdmf:0,total:0,n:0});
  const emps={}; let review=0;
  detail.forEach(({e,l,i})=>{ const a=appliedOf(e), m=months[i-fi], k=l.agency==="SSS"?"sss":"hdmf";
    m[k]=round2(m[k]+a); m.total=round2(m.total+a); m.n++;
    const r=emps[l.employee]||(emps[l.employee]={employee:l.employee,sss:0,hdmf:0,total:0,n:0});
    r[k]=round2(r[k]+a); r.total=round2(r.total+a); r.n++; if(needsReview(e))review++; });
  const empRows=Object.values(emps).sort((a,b)=>a.employee.localeCompare(b.employee));
  const sum=k=>round2(months.reduce((t,m)=>t+m[k],0));
  return {from,to,fi,ti,months,empRows,detail,review,sss:sum("sss"),hdmf:sum("hdmf"),total:sum("total"),n:detail.length,
    empty:months.filter(m=>!m.n&&m.idx<=monthIndex(currentMonthName())).length};
}

  printDoc("Remittance Reconciliation",`<div class="ph">Applicable month: ${esc(month)} &middot; Payable ${esc(nextMonth(month))} &middot; Generated ${new Date().toLocaleDateString(PREF.locale,{timeZone:ELMS_TIME.tz})}</div>${sec("SSS")}${sec("HDMF")}

/* ---- remittance due calendar ---- */
/* Deductions for an applicable month are payable the following month. For each payable month and agency the calendar shows the
   amount due and whether it was remitted: remitted, partly remitted, due this month, overdue, or not yet due. */
REM.year=REM.year||ELMS_TIME.year();
function remDue(r){
  const tol=remTol(), cur=monthIndex(currentMonthName()), pay=monthIndex(r.month)+1, out=Math.max(0,round2(r.ledger-r.remitted));
  let k,label,cls;
  if(r.ledger<=tol&&!r.rems.length){ k="none"; label="Nothing payable"; cls="none"; }
  else if(r.rems.length&&r.remitted>=r.ledger-tol-1e-9){ if(r.remitted>r.ledger+tol){ k="over"; label="Over-remitted"; cls="warn"; } else { k="done"; label="Remitted"; cls="ok"; } }
  else if(r.rems.length){ k="partial"; label="Partly remitted"; cls=pay<cur?"danger":"warn"; }
  else if(pay<cur){ k="overdue"; label="Overdue"; cls="danger"; }
  else if(pay===cur){ k="due"; label="Due this month"; cls="warn"; }
  else { k="upcoming"; label="Not yet due"; cls="sss"; }
  return {k,label,cls,out,pay,late:pay<cur&&out>tol}; }
const remMonthTitle=s=>{ s=String(s||""); return s.charAt(0)+s.slice(1).toLowerCase(); };
function remCalData(year){ /* everything the calendar needs, computed once per render */
  const cache={}, get=m=>{ if(!cache[m]){ const d=remitData(m); cache[m]={}; ["SSS","HDMF"].forEach(ag=>{ const r=remRecon(ag,m,d); cache[m][ag]={r,x:remDue(r)}; }); } return cache[m]; };
  const tiles=[]; for(let k=0;k<12;k++){ const payIdx=(year-BASE_YEAR)*12+k, app=monthLabel(payIdx-1); tiles.push({payIdx,pay:monthLabel(payIdx),app,v:get(app)}); }
  const late=[]; let lateAmt=0, dueAmt=0, dueN=0, paidYear=0; const cur=monthIndex(currentMonthName());
  remMonthList().forEach(m=>{ const v=get(m); ["SSS","HDMF"].forEach(ag=>{ const x=v[ag].x; if(x.late){ late.push({m,ag,out:x.out,k:x.k}); lateAmt=round2(lateAmt+x.out); }
    if(x.pay===cur&&x.out>remTol()&&x.k!=="none"){ dueAmt=round2(dueAmt+x.out); dueN++; } }); });
  tiles.forEach(t=>["SSS","HDMF"].forEach(ag=>{ paidYear=round2(paidYear+t.v[ag].r.remitted); }));
  late.sort((a,b)=>monthIndex(a.m)-monthIndex(b.m)||a.ag.localeCompare(b.ag));
  return {tiles,late,lateAmt,dueAmt,dueN,paidYear,cur}; }
function remCalendarHTML(){
  const y=REM.year, c=remCalData(y), curY=ELMS_TIME.year(), ys=new Set([curY-1,curY,curY+1,y]);
  remMonthList().forEach(m=>{ const i=monthIndex(m); if(i>=0)ys.add(BASE_YEAR+Math.floor((i+1)/12)); });
  const yearOpts=[...ys].sort((a,b)=>b-a).map(v=>`<option value="${v}"${v===y?" selected":""}>${v}</option>`).join("");
  const kpi=(cls,lab,val,hint)=>`<div class="kpi ${cls}"><div class="lab">${lab}</div><div class="val" style="font-size:18px">${val}</div><div class="hint">${hint}</div></div>`;
  const tile=t=>{ const cur=t.payIdx===c.cur, sel=t.app===REM.month;
    const row=ag=>{ const o=t.v[ag], x=o.x, r=o.r;
      return `<div class="rt-r">${agencyPill(ag)}<span class="rt-a">${x.k==="none"?'<span class="muted">&#8211;</span>':peso(r.ledger)}</span></div>
        <div class="rt-s"><span class="pill ${x.cls}">${esc(x.label)}</span>${(x.out>remTol()&&x.k!=="none"&&r.rems.length)?`<span class="rt-o">${peso(x.out)} left</span>`:""}</div>`; };
    return `<div class="remtile${cur?" cur":""}${sel?" sel":""}" onclick="remPickMonth('${t.app}',true)" title="Open ${esc(remMonthTitle(t.app))} deductions">
      <div class="rt-h"><b>${esc(remMonthTitle(t.pay))}</b><span>for ${esc(remMonthTitle(t.app))} deductions</span></div>${row("SSS")}${row("HDMF")}<div class="rt-go">Open details &rsaquo;</div></div>`; };
  const lateChips=sortRows("remCal",c.late.filter(x=>remHit(REM._H,x.m,agencyDisp(x.ag))),{month:x=>monIdxOrNull(x.m),status:x=>null,amount:x=>x.out,out:x=>x.out,agency:x=>x.ag}).slice(0,14).map(x=>`<button class="rowbtn" style="margin:2px 4px 2px 0" onclick="remPickMonth('${x.m}',true)">${esc(agencyDisp(x.ag))} &middot; ${esc(remMonthTitle(x.m))} &middot; ${peso(x.out)}</button>`).join("");
  return `<div class="card" style="margin-bottom:18px"><h3>Remittance due calendar <span class="tag">tap a month to open it</span>
      <span style="margin-left:auto;display:flex;gap:6px;align-items:center"><label style="font-size:12px;color:var(--muted);font-weight:500">Payable in <select style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe" onchange="remSetYear(this.value)">${yearOpts}</select></label>
      <button class="btn btn-ghost btn-sm" onclick="printRemCal()">Print</button></span></h3>
    <div class="kpis" style="margin-bottom:12px">
      ${kpi(c.late.length?"accent-brand":"",c.late.length?"Overdue":"Overdue",`<span class="${c.late.length?"var-neg":"var-pos"}">${c.late.length?peso(c.lateAmt):"None"}</span>`,c.late.length?c.late.length+" agency-month"+(c.late.length>1?"s":"")+" not fully remitted":"Every earlier month is remitted")}
      ${kpi("","Due this month",c.dueAmt>0?peso(c.dueAmt):"Nothing",c.dueN?c.dueN+" agency payment"+(c.dueN>1?"s":"")+" still to remit":"for "+esc(remMonthTitle(monthLabel(c.cur-1)))+" deductions")}
      ${kpi("","Remitted, payable in "+y,peso(c.paidYear),"recorded in the remittance list")}</div>
    ${c.late.length?`<div class="notice" style="margin:0 0 12px"><b>Overdue remittances.</b> The payable month has passed and the full amount isn't recorded as remitted. Click one to open it. <div style="margin-top:6px">${lateChips}${c.late.length>14?` <span class="muted">and ${c.late.length-14} more</span>`:""}</div></div>`:""}
    <div class="remgrid">${sortRows("remCal",c.tiles.filter(t=>remHit(REM._H,t.app,remMonthTitle(t.pay))),REM_CALG,(a,b)=>a.payIdx-b.payIdx).map(tile).join("")||'<div class="hintline">No calendar months match your search.</div>'}</div>
    <p class="actnote">Each month's deductions are payable the following month. Status comes from the remittances recorded below; it does not know the agency's own deadline, so confirm it with the agency. "Left" is deducted but not yet remitted.</p></div>`; }
function remSetYear(v){ REM.year=Number(v)||ELMS_TIME.year(); renderRem(); }
function printRemCal(){
  if(!REM.loaded||REM.failed){ toast("Remittance records are not available yet."); return; }
  const y=REM.year, c=remCalData(y), cell=(o)=>{ const x=o.x, r=o.r; return `<td class="num">${x.k==="none"?"&#8211;":peso(r.ledger)}</td><td class="num">${r.rems.length?peso(r.remitted):"&#8211;"}</td><td>${esc(x.label)}${(x.out>remTol()&&x.k!=="none"&&r.rems.length)?" ("+peso(x.out)+" left)":""}</td>`; };
  const body=c.tiles.map(t=>`<tr><td>${esc(remMonthTitle(t.pay))}</td><td>${esc(remMonthTitle(t.app))}</td>${cell(t.v.SSS)}${cell(t.v.HDMF)}</tr>`).join("");
  printDoc("Remittance Due Calendar",`<div class="ph">Payable in ${y} &middot; Generated ${new Date().toLocaleDateString(PREF.locale,{timeZone:ELMS_TIME.tz})}</div>
    <table><thead><tr><th rowspan="2">Payable month</th><th rowspan="2">Deductions for</th><th colspan="3">SSS</th><th colspan="3">Pag-IBIG</th></tr>
    <tr><th class="num">Payable</th><th class="num">Remitted</th><th>Status</th><th class="num">Payable</th><th class="num">Remitted</th><th>Status</th></tr></thead><tbody>${body}</tbody></table>
    <p style="font-size:11px;margin-top:8px">${c.late.length?`Overdue: ${peso(c.lateAmt)} across ${c.late.length} agency-month${c.late.length>1?"s":""}.`:"No overdue remittances."} Deductions are payable the month after they are taken.</p>
    <div class="sig">Prepared by: ______________________________ &nbsp;&nbsp; Checked by: ______________________________</div>`); }

const PR={rows:[],loaded:false,loading:false,failed:false,error:"",filter:"pending",pending:0,q:""};
const PR_STATUS={pending:["Pending","warn"],approved:["Approved","ok"],rejected:["Rejected","danger"],cancelled:["Cancelled","closed"]};
const prPill=s=>{ const m=PR_STATUS[s]||[s,"type"]; return `<span class="pill ${m[1]}">${esc(m[0])}</span>`; };
const prWhen=ts=>fmtWhen(new Date(ts).getTime()).abs;
const prLoanText=l=>l?(agencyDisp(l.agency)+" "+l.loanType+(l.reference?" ("+l.reference+")":"")+(l.code?" "+l.code:"")):"(loan removed)";
function prBadge(){ const b=document.getElementById("apprBadge"); if(!b)return;
  const n=PR.pending+LR.pending+BAQ.pending+PW.pending; b.title=PW.pending?(PW.pending+" password reset request"+(PW.pending===1?"":"s")+" waiting"):""; b.textContent=n>99?"99+":String(n); b.style.display=(CURRENT_ROLE==="admin"&&n>0)?"":"none"; }
async function refreshPending(){
  if(CURRENT_ROLE!=="admin")return;
  const r=await sb.from("payment_requests").select("id",{count:"exact",head:true}).eq("status","pending");
  if(r.error){ PR.pending=0; } else PR.pending=r.count||0;
  const q=await sb.from("loan_requests").select("id",{count:"exact",head:true}).eq("status","pending");
  if(q.error){ LR.pending=0; } else LR.pending=q.count||0;
  const w=await sb.from("password_reset_requests").select("id",{count:"exact",head:true}).eq("status","pending");
  const prev=PW.pending; PW.pending=w.error?0:(w.count||0);
  try{ const bq=await sb.from("bulk_requests").select("id",{count:"exact",head:true}).eq("status","pending"); BAQ.ok=!bq.error; BAQ.at=Date.now(); BAQ.pending=bq.error?0:(bq.count||0); }catch(err){ BAQ.pending=0; swallow("refreshPending bulk",err); }
  prBadge(); nfBadgeSoon();
  if(PW._seen&&PW.pending>prev) toast(PW.pending===1?"New password reset request from an employee":PW.pending+" password reset requests are waiting");
  if(PW.pending!==prev&&STATE.view==="dashboard"&&!document.querySelector("#modalHost .modal")){ try{ render(); }catch(e){ swallow("pw render",e); } }
  PW._seen=true;
}
setInterval(()=>{ if(CURRENT_ROLE==="admin"&&!document.hidden)refreshPending(); },90000);
async function loadRequests(force){
  if(PR.loading)return; if(PR.loaded&&!force)return; PR.loading=true;
  const res=await sb.from("payment_requests").select("*").order("created_at",{ascending:false}).limit(500);
  PR.loading=false;
  if(res.error){ PR.failed=true; PR.error=friendlyErr(res.error); PR.rows=[]; PR.loaded=false; }
  else { PR.rows=res.data||[]; PR.failed=false; PR.error=""; PR.loaded=true; if(CURRENT_ROLE==="admin")PR.pending=PR.rows.filter(r=>r.status==="pending").length; }
  prBadge();
}

/* ---------- Employee side ---------- */
const myReqEligible=()=>STORE.loans.filter(l=>l.status==="active"&&!loanStats(l).fullyPaid);
function myReqInit(){ if(CURRENT_ROLE!=="member")return; if(PR.loaded){ myReqPaint(); return; } loadRequests().then(myReqPaint); }
function myReqPaint(){
  const box=document.getElementById("myReqBox"); if(!box||CURRENT_ROLE!=="member")return;
  if(!PR.loaded&&!PR.failed){ box.innerHTML=""; return; } // still loading
  if(PR.failed){ box.innerHTML=`<div class="notice">Your payment submissions could not be loaded: ${esc(PR.error)}</div>`; return; }

    const info=r.status==="rejected"?`<b>Reason:</b> ${esc(r.review_note||"No reason given")}`:(r.status==="approved"?esc(r.review_note||"Added to your loan"):(r.status==="pending"?"Waiting for admin approval":""));
    return `<tr><td data-label="Submitted">${esc(prWhen(r.created_at))}</td><td data-label="Loan">${esc(prLoanText(l))}</td><td data-label="Month">${esc(r.applicable_month)}</td>
      <td class="num" data-label="Amount"><b>${peso(Number(r.amount))}</b></td><td data-label="Status">${prPill(r.status)}</td><td class="detail" data-label="Details">${info}</td>

      ${can?`<button class="btn btn-primary btn-sm" onclick="openSubmitPayment()">+ Submit a payment</button>`:""}</div>

      :`<div class="actstate" style="padding:6px 18px 20px">No submissions yet.</div>`}</div>`;
}
function openSubmitPayment(){
  if(CURRENT_ROLE!=="member"){ toast("Payments are submitted from an employee account."); return; }
  const loans=myReqEligible(); if(!loans.length){ toast("You have no active loan to pay."); return; }
  const today=ELMS_TIME.todayISO();
  modal(`<h3>Submit a payment</h3><p class="muted" style="margin:0 0 12px;font-size:13px">An admin reviews this before it is added to your loan.</p>
    <div class="form-grid">
      <div class="field full"><label>Loan</label><select id="srLoan">${loans.map(l=>`<option value="${l.id}">${esc(prLoanText(l))}</option>`).join("")}</select></div>
      <div class="field"><label>Applicable month</label>${monthYearPicker('srM',currentMonthName(),{})}<div class="hintline">The month this payment covers.</div></div>
      <div class="field"><label>Amount (&#8369;)</label><input id="srAmt" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
      <div class="field"><label>Date paid</label><input id="srDate" type="date" value="${today}"></div>
      <div class="field"><label>Receipt / reference no.</label><input id="srRef" type="text" autocomplete="off" placeholder="OR number or transaction ID"></div>
      <div class="field full"><label>Note <span class="muted" style="font-weight:400">(optional)</span></label><input id="srNote" type="text" autocomplete="off"></div>
    </div><div class="form-msg" id="srMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="srGo" onclick="submitPayment()">Submit for approval</button></div>`);
}
async function submitPayment(){
  if(submitPayment._busy)return; submitPayment._busy=true; try{ await submitPaymentInner(); } finally{ submitPayment._busy=false; }
}
async function submitPaymentInner(){
  if(CURRENT_ROLE!=="member")return;
  const g=id=>document.getElementById(id), msg=g("srMsg");
  const loan=loanById(g("srLoan").value), month=readMonthYear("srM")||currentMonthName(), amt=fnum("srAmt"), ref=g("srRef").value.trim(), note=g("srNote").value.trim()||null, paid=g("srDate").value||null;
  if(!loan){ msg.textContent="Choose a loan."; return; }
  if(amt===null||isNaN(amt)||amt<=0){ msg.textContent="Enter the amount you paid (more than zero)."; return; }
  const s=loanStats(loan); if(typeof s.balance==="number"&&amt>s.balance+0.005){ msg.textContent="That is more than your remaining balance of "+pesoTxt(s.balance)+"."; return; }
  if(!ref){ msg.textContent="Enter the receipt or reference number so HR can verify the payment."; return; }
  if(STORE.entries.some(e=>e.loanId===loan.id&&e.applicableMonth===month)){ msg.textContent="A payment for "+month+" is already recorded on this loan. If it looks wrong, please ask HR."; return; }
  if(PR.rows.some(r=>r.loan_id===loan.id&&r.applicable_month===month&&r.status==="pending")){ msg.textContent="You already have a pending submission for "+month+" on this loan."; return; }
  const btn=g("srGo"); btn.disabled=true; msg.textContent="Submitting...";
  const {error}=await sb.from("payment_requests").insert({loan_id:loan.id,applicable_month:month,amount:round2(amt),paid_on:paid,reference:ref,note});
  if(error){ btn.disabled=false;
    msg.textContent=/row-level security/i.test(error.message||"")?"This loan can't take submissions right now. It may be closed, so please contact HR.":"Could not submit: "+friendlyErr(error); return; }
  logAudit("request_submit","request",loan.employee+" "+month+" "+pesoTxt(amt));
  closeModal(); toast("Submitted. An admin will review it."); await loadRequests(true); myReqPaint();
}
function cancelRequest(id){
  const r=PR.rows.find(x=>x.id===id); if(!r)return;
  confirmModal("Cancel this submission?","Your "+esc(r.applicable_month)+" payment of "+peso(Number(r.amount))+" will be withdrawn. You can submit it again later.",
    (async()=>{ const res=await sb.from("payment_requests").update({status:"cancelled"}).eq("id",id).eq("status","pending").select("id");
      if(res.error){ toast("Could not cancel: "+esc(friendlyErr(res.error))); return; }
      if(!res.data||!res.data.length){ toast("That submission was already reviewed."); }
      else { const l=loanById(r.loan_id); logAudit("request_cancel","request",((l&&l.employee)||"")+" "+r.applicable_month+" "+pesoTxt(r.amount)); toast("Submission cancelled"); }

function apCheck(id){
  const w=document.getElementById("apWarn"); if(!w)return; id=id||apCheck._id; apCheck._id=id;
  const r=PR.rows.find(x=>x.id===id), l=r&&loanById(r.loan_id); if(!l){ w.innerHTML=""; return; }
  const month=readMonthYear("apM")||r.applicable_month, amt=fnum("apAmt"), s=loanStats(l); let h="";
  const dup=STORE.entries.find(e=>e.loanId===l.id&&e.applicableMonth===month);
  if(dup) h+=`<div class="notice" style="margin:0 0 10px"><b>${esc(month)} is already recorded on this loan (${peso(appliedOf(dup))}).</b> Change the month, edit that entry, or reject this request.</div>`;
  if(amt!==null&&!isNaN(amt)&&typeof s.balance==="number"&&amt>s.balance+0.005) h+=`<div class="notice" style="margin:0 0 10px">This is more than the remaining balance of ${peso(s.balance)}.</div>`;
  w.innerHTML=h;
}
async function doApprove(id){ if(doApprove._busy)return; doApprove._busy=true; try{ await doApproveInner(id); } finally{ doApprove._busy=false; } }
async function doApproveInner(id){
  if(!need("admin"))return; const r=PR.rows.find(x=>x.id===id), l=r&&loanById(r.loan_id); if(!r||!l)return;
  const g=x=>document.getElementById(x), msg=g("apMsg"), btn=g("apGo");
  const month=readMonthYear("apM")||r.applicable_month, amt=fnum("apAmt"), type=g("apType").value, ref=g("apRef").value.trim()||null, rem=g("apRem").value.trim()||null, note=g("apNote").value.trim();
  if(amt===null||isNaN(amt)||amt<=0){ msg.textContent="Enter an amount greater than zero."; return; }
  const dup=STORE.entries.find(e=>e.loanId===l.id&&e.applicableMonth===month);
  if(dup){ msg.textContent=month+" is already recorded on this loan ("+pesoTxt(appliedOf(dup))+"). Change the month, edit that entry, or reject this request."; return; }
  { const fr=await freshEntries([{loanId:l.id,month}]); /* the database is the authority */
    if(fr.error){ msg.textContent="Could not check for an existing payment, so nothing was posted: "+(fr.error.message||fr.error)+" Try again."; return; }
    const hit=(fr.map.get(dupKey(l.id,month))||[])[0];
    if(hit){ msg.textContent=month+" was just recorded on this loan ("+pesoTxt(appliedOf(hit))+"). Close this, refresh, and edit that entry or reject the request."; return; } }
  { const info=overpayInfo(l,amt,null); if(info&&overMode()==="block"){ msg.textContent="Not posted. "+overText(info)+" Lower the amount, or reject the request."; return; } }
  btn.disabled=true; msg.textContent="Posting...";
  const {data:{user}}=await sb.auth.getUser();
  const adjusted=Math.abs(Number(r.amount)-amt)>0.004||month!==r.applicable_month;
  const reviewNote=[adjusted?"Posted "+pesoTxt(amt)+" for "+month+" (requested "+pesoTxt(r.amount)+" for "+r.applicable_month+")":"",note].filter(Boolean).join(". ")||null;
  // 1) claim it first so two admins can never post the same request twice
  const claim=await sb.from("payment_requests").update({status:"approved",reviewed_by:user.id,reviewed_at:new Date().toISOString(),review_note:reviewNote}).eq("id",id).eq("status","pending").select("id");
  if(claim.error){ btn.disabled=false; msg.textContent="Could not approve: "+friendlyErr(claim.error); return; }
  if(!claim.data||!claim.data.length){ btn.disabled=false; msg.textContent="Someone else already handled this request. Close this and refresh."; return; }
  // 2) post it to the ledger
  const ins=await sb.from("ledger_entries").insert({loan_id:l.id,applicable_month:month,or_ref:ref,first15:null,second15:null,total_recorded:round2(amt),payment_type:type,remarks:rem}).select("id");
  if(ins.error){ await sb.from("payment_requests").update({status:"pending",reviewed_by:null,reviewed_at:null,review_note:null}).eq("id",id); // undo the claim
    btn.disabled=false; msg.textContent="Could not post the payment, so the request is still pending: "+friendlyErr(ins.error)+typeErrHint(ins.error); return; }
  const eid=ins.data&&ins.data[0]&&ins.data[0].id; if(eid) await sb.from("payment_requests").update({entry_id:eid}).eq("id",id);
  logAudit("request_approve","request",l.employee+" "+month+" "+pesoTxt(amt)+(adjusted?" (adjusted)":""));
  closeModal(); toast("Approved and posted to "+esc(l.employee)+"'s ledger"); await reloadRender(); if(STATE.view==="approvals")apprRefresh();
}
function rejectRequest(id){
  if(!need("admin"))return; const r=PR.rows.find(x=>x.id===id); if(!r||r.status!=="pending"){ toast("This request was already handled."); apprRefresh(); return; }

    <div class="field"><label>Reason (the employee will see this)</label><input id="rjReason" type="text" maxlength="200" autocomplete="off" placeholder="e.g. Reference number not found"></div>

async function doReject(id){
  if(doReject._busy)return; if(!need("admin"))return; const r=PR.rows.find(x=>x.id===id); if(!r)return;
  const reason=document.getElementById("rjReason").value.trim(), msg=document.getElementById("rjMsg"), btn=document.getElementById("rjGo");
  if(!reason){ msg.textContent="Please give a short reason."; return; }
  doReject._busy=true; btn.disabled=true; msg.textContent="Saving...";
  try{
    const {data:{user}}=await sb.auth.getUser();
    const res=await sb.from("payment_requests").update({status:"rejected",reviewed_by:user.id,reviewed_at:new Date().toISOString(),review_note:reason}).eq("id",id).eq("status","pending").select("id");
    if(res.error){ btn.disabled=false; msg.textContent="Could not reject: "+friendlyErr(res.error); return; }
    if(!res.data||!res.data.length){ btn.disabled=false; msg.textContent="Someone else already handled this request."; return; }
    const l=loanById(r.loan_id); logAudit("request_reject","request",((l&&l.employee)||"")+" "+r.applicable_month+" "+pesoTxt(r.amount));
    closeModal(); toast("Request rejected"); await loadRequests(true); apprPaint();
  } finally { doReject._busy=false; }
}

function rqSync(typeOnly){

async function submitLoanRequest(){
  if(submitLoanRequest._busy)return; submitLoanRequest._busy=true; try{ await submitLoanRequestInner(); } finally{ submitLoanRequest._busy=false; }
}
async function submitLoanRequestInner(){
  if(CURRENT_ROLE!=="member"||!CURRENT_EMP)return;
  const g=id=>document.getElementById(id), msg=g("rqMsg");
  const ag=g("rqAg").value, type=g("rqType").value, amt=fnum("rqAmt"), termRaw=fnum("rqTerm"), reason=g("rqReason").value.trim();
  if(!type){ msg.textContent="Choose a loan type."; return; }
  if(amt===null||isNaN(amt)||amt<=0){ msg.textContent="Enter the amount you want to borrow (more than zero)."; return; }
  if(termRaw!==null&&(isNaN(termRaw)||termRaw<1||termRaw>600)){ msg.textContent="The term must be a number of months, or leave it blank."; return; }
  if(reason.length<3){ msg.textContent="Please tell HR briefly what the loan is for."; return; }
  if(LR.rows.some(r=>r.status==="pending"&&r.agency===ag&&r.loan_type===type)){ msg.textContent="You already have a pending request for this loan type. Cancel it first if you want to change it."; return; }
  const btn=g("rqGo"); btn.disabled=true; msg.textContent="Sending...";
  const {error}=await sb.from("loan_requests").insert({employee:CURRENT_EMP,agency:ag,loan_type:type,amount_requested:round2(amt),term_months:termRaw===null?null:Math.round(termRaw),reason});
  if(error){ btn.disabled=false;
    msg.textContent=/row-level security/i.test(error.message||"")?"Your account isn't linked to an employee record, so the request can't be sent. Please contact HR.":"Could not send: "+friendlyErr(error); return; }
  logAudit("loanreq_submit","loanrequest",CURRENT_EMP+" "+agencyDisp(ag)+" "+type+" "+pesoTxt(amt));
  closeModal(); toast("Request sent. HR will review it."); await loadLoanRequests(true); myLoanReqPaint();
}
function cancelLoanRequest(id){
  const r=LR.rows.find(x=>x.id===id); if(!r)return;
  confirmModal("Cancel this request?","Your "+esc(lrAgTxt(r))+" request for "+peso(Number(r.amount_requested))+" will be withdrawn. You can send a new one later.",
    (async()=>{ const res=await sb.from("loan_requests").update({status:"cancelled"}).eq("id",id).eq("status","pending").select("id");
      if(res.error){ toast("Could not cancel: "+esc(friendlyErr(res.error))); return; }
      if(!res.data||!res.data.length){ toast("That request was already reviewed."); }
      else { logAudit("loanreq_cancel","loanrequest",r.employee+" "+lrAgTxt(r)+" "+pesoTxt(r.amount_requested)); toast("Request cancelled"); }
      await loadLoanRequests(true); myLoanReqPaint(); }),null,"Cancel request");
}

async function deptRenameGo(i){
  if(!need("admin"))return; const old=deptNames()[i], el=document.getElementById("dmEdit"); if(old==null||!el)return;
  const nu=(el.value||"").replace(/\s+/g," ").trim();
  if(!nu){ DM.editing=i; deptMgrRender("The name can't be empty."); return; }
  if(nu===old){ DM.editing=null; deptMgrRender(); return; }
  if(deptClash(nu,old)){ DM.editing=i; deptMgrRender('"'+nu+'" already exists. Pick a different name.'); return; }
  const vars=deptVariants(old), hasEmps=Object.values(STORE.empDept||{}).some(d=>vars.includes(d));
  if(hasEmps){ const {error}=await sb.from("employees").update({department:nu}).in("department",vars); if(error){ DM.editing=i; deptMgrRender("Could not rename: "+friendlyErr(error)); return; } }
  const list=(SETTINGS.departments||[]).filter(d=>d.toLowerCase()!==old.toLowerCase()).concat([nu]);
  if(!await deptPersist(list)){ deptMgrRender("The employees were renamed but the list could not be saved. Add \""+nu+"\" again to keep it."); await reloadRender(); return; }
  logAudit("dept_rename","department",old+" \u2192 "+nu); toast("Department renamed"); DM.editing=null; await reloadRender(); deptMgrRender(); }
function deptRemove(i){
  if(!need("admin"))return; const name=deptNames()[i]; if(name==null)return; const r=deptStats()[name]||{emps:0,withActive:0};
  confirmModal(`Remove <b>${esc(name)}</b>?`,r.emps?`${r.emps} employee${r.emps===1?"":"s"} will become <b>Unassigned</b>. Their loans and payments are not affected.`:"No employees are in this department.",
    (async()=>{ const vars=deptVariants(name);
      if(r.emps){ const {error}=await sb.from("employees").update({department:null}).in("department",vars); if(error){ toast("Could not remove: "+esc(friendlyErr(error))); deptMgrRender(); return; } }
      if(!await deptPersist((SETTINGS.departments||[]).filter(d=>d.toLowerCase()!==name.toLowerCase()))){ deptMgrRender(); return; }
      logAudit("dept_remove","department",name+(r.emps?" ("+r.emps+" unassigned)":"")); toast("Department removed"); DM.editing=null; await reloadRender(); deptMgrRender(); }),null,"Remove");
}
const EMP_EXPORT_COLS=[
  {h:"Employee",w:28,v:r=>r.name},{h:"Department",w:20,v:r=>r.dept},{h:"Company ID",w:14,v:r=>r.cid},{h:"Status",w:16,v:r=>r.status},{h:"Email",w:30,v:r=>r.email},
  {h:"Has loan",w:10,v:r=>r.active?"Yes":(r.total?"Closed only":"No")},{h:"Active loans",w:12,t:"int",v:r=>r.active},{h:"All loans",w:10,t:"int",v:r=>r.total},
  {h:"Monthly deduction",w:18,t:"money",v:r=>r.deduction},{h:"Total paid",w:14,t:"money",v:r=>r.paid},{h:"Remaining balance",w:17,t:"money",v:r=>r.remaining}];
function employeeExportRows(){
  const by={}; STORE.loans.forEach(l=>{ (by[l.employee]||(by[l.employee]=[])).push(l); });
  return STORE.employees.slice().sort((a,b)=>(empDeptOf(a)||"\uffff").localeCompare(empDeptOf(b)||"\uffff")||a.localeCompare(b)).map(n=>{
    const ls=by[n]||[], act=ls.filter(l=>l.status==="active"); let paid=0,rem=0,ded=0,hasBal=false;
    ls.forEach(l=>{ const s=loanStats(l); paid+=s.totalPaid; if(typeof s.balance==="number"){ rem+=Math.max(0,s.balance); hasBal=true; } });
    act.forEach(l=>{ if(typeof l.monthlyAmort==="number")ded+=l.monthlyAmort; });
    return {name:n,dept:empDeptOf(n),cid:empCid(n),status:empStatusLabel(n),email:(STORE.empEmail||{})[n]||"",active:act.length,total:ls.length,deduction:round2(ded),paid:round2(paid),remaining:hasBal?round2(rem):""}; }); }
function exportEmployees(){ if(!need("export"))return; const rows=employeeExportRows(); return runExport("employees","xlsx",EMP_EXPORT_COLS,rows,"Employees","employees-by-department"); }
function deptCardHTML(){ const n=(SETTINGS.departments||[]).length;
  return `<div class="setcard"><h3>Departments</h3><p class="sub">Group employees by department so you can see who in each department has a loan. ${n?`<b>${n}</b> department${n===1?"":"s"} defined.`:"None defined yet."}</p>
    <div class="setfoot"><button class="btn btn-primary" onclick="openDeptManager()">Manage departments</button></div></div>`; }

/* Top bar: live Philippine clock, Desktop/Mobile view, Light/Dark theme */
(function(){
  var root=document.documentElement;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){ swallow("set",e); }}
  var MQ_VIEWPORT='width=device-width, initial-scale=1.0';

  /* ---- Philippine Standard Time (UTC+8, no daylight saving) ---- */
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function p2(n){return n<10?'0'+n:''+n}
  var clockTimer=null;
  var TF=get('elms_timefmt')==='24'?'24':'12';
  window.ELMS_H12=(TF!=='24');
  function tick(){
    var now=Date.now(), d=new Date(now+8*3600*1000);
    var h=d.getUTCHours(), ap=h>=12?'PM':'AM', h12=h%12||12;
    var tEl=document.getElementById('pcTime'), dEl=document.getElementById('pcDate');
    if(tEl&&window.ELMS_TIME&&tEl.parentNode){ var lb=ELMS_TIME.label(); if(tEl.parentNode.title!==lb)tEl.parentNode.title=lb; }
    if(tEl)tEl.textContent=(TF==='24')?(p2(h)+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds())):(h12+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds())+' '+ap);
    if(dEl)dEl.textContent=DAYS[d.getUTCDay()]+', '+MONS[d.getUTCMonth()]+' '+d.getUTCDate()+', '+d.getUTCFullYear();
    clearTimeout(clockTimer);
    clockTimer=setTimeout(tick,1000-(now%1000)+4);
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
  document.addEventListener('elms-time',function(){tick()});

  /* ---- Theme ---- */
  function setTheme(t,save){
    if(t!=='dark')t='light';
    root.setAttribute('data-theme',t);
    if(save)set('elms_theme',t);
    var m=document.querySelector('meta[name=theme-color]');
    if(m)m.setAttribute('content',t==='dark'?'#050d14':'#00111c');
    syncButtons();
  }

  /* ---- View (Desktop / Mobile) ---- */
  function isPhone(){try{return Math.min(screen.width,screen.height)<=820&&window.matchMedia('(pointer:coarse)').matches}catch(e){return false}}
  function effView(){
    var v=get('elms_view');
    if(v==='desktop'||v==='mobile')return v;
    return window.innerWidth<=640?'mobile':'desktop';
  }
  function applyView(v,save){
    if(save)set('elms_view',v);
    root.classList.toggle('force-mobile',v==='mobile');
    var m=document.querySelector('meta[name=viewport]');
    if(m)m.setAttribute('content',(v==='desktop'&&isPhone())?'width=1100':MQ_VIEWPORT);
    syncButtons();
    measure();
  }

  function setTimeFmt(f,save){
    TF=(f==='24')?'24':'12'; window.ELMS_H12=(TF!=='24');
    if(save)set('elms_timefmt',TF);
    syncButtons(); tick();
    try{ var app=document.getElementById('app'); if(save&&app&&!app.classList.contains('hidden')&&typeof render==='function')render(); }catch(e){}
  }
  function syncButtons(){
    Array.prototype.forEach.call(document.querySelectorAll('#timeSeg button'),function(b){
      var on=b.getAttribute('data-tf')===TF; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
    });
    var th=root.getAttribute('data-theme')==='dark'?'dark':'light', vw=effView();
    Array.prototype.forEach.call(document.querySelectorAll('#themeSeg button'),function(b){
      var on=b.getAttribute('data-theme-set')===th; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#viewSeg button'),function(b){
      var on=b.getAttribute('data-view')===vw; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');
    });
  }

  /* Keep the sticky stack (top bar, header, tabs) aligned even when the header wraps */
  function measure(){
    var u=document.getElementById('utilbar'), h=document.querySelector('header.top');
    if(u)root.style.setProperty('--util-h',u.offsetHeight+'px');
    if(h&&h.offsetHeight)root.style.setProperty('--hdr-h',h.offsetHeight+'px');
  }

  /* Re-apply the existing phone-size rules (max-width media queries) when Mobile view is
     chosen on a wide screen, by cloning them under html.force-mobile. */
  function splitSel(s){var out=[],depth=0,cur='';for(var i=0;i<s.length;i++){var c=s[i];
    if(c==='('||c==='[')depth++; else if(c===')'||c===']')depth--;
    if(c===','&&depth===0){out.push(cur);cur='';}else cur+=c;}
    if(cur.trim())out.push(cur);return out;}
  function cloneMobileRules(){
    var css='';
    Array.prototype.forEach.call(document.styleSheets,function(ss){
      var rules; try{rules=ss.cssRules}catch(e){return}
      if(!rules||(ss.ownerNode&&(ss.ownerNode.id==='chromeCss'||ss.ownerNode.id==='forceMobileCss')))return;
      Array.prototype.forEach.call(rules,function(r){
        if(r.type!==4)return;
        var cond=(r.conditionText||(r.media&&r.media.mediaText)||'');
        if(!/max-width\s*:\s*\d+px/.test(cond)||/print/.test(cond))return;
        Array.prototype.forEach.call(r.cssRules,function(x){
          if(x.type!==1)return;
          var sel=splitSel(x.selectorText).map(function(s){return 'html.force-mobile '+s.trim()}).join(',');
          css+=sel+'{'+x.style.cssText+'}\n';
        });
      });
    });
    if(css){var st=document.createElement('style');st.id='forceMobileCss';st.textContent='@media screen{'+css+'}';document.head.appendChild(st);}
  }

  /* Give every cell its column name so wide tables can show as cards on a phone */
  function cardify(){
    var main=document.getElementById('main'); if(!main)return;
    Array.prototype.forEach.call(main.querySelectorAll('.tablewrap > table'),function(t){
      if(t.classList.contains('utable')||t.classList.contains('atable')||t.classList.contains('bktbl')||t.classList.contains('gridtable'))return;
      var hr=t.tHead&&t.tHead.rows[t.tHead.rows.length-1]; if(!hr)return;
      var ths=Array.prototype.slice.call(hr.cells); if(ths.length<4)return;
      for(var i=0;i<ths.length;i++)if(ths[i].colSpan>1)return;
      var labels=ths.map(function(h){return h.textContent.replace(/[\u25B2\u25BC\u2191\u2193\u21C5]/g,'').replace(/\s+/g,' ').trim()});
      t.classList.add('mcards');
      var fr=t.tBodies[0]&&t.tBodies[0].rows[0];
      t._hasAct=!!(fr&&fr.cells.length===labels.length&&fr.cells[labels.length-1].classList.contains('act'));
      Array.prototype.forEach.call(t.tBodies,function(tb){Array.prototype.forEach.call(tb.rows,function(tr){
        if(tr.cells.length!==labels.length){tr.classList.add('mc-span');return;}
        tr.classList.remove('mc-span');
        for(var i=0;i<tr.cells.length;i++)tr.cells[i].setAttribute('data-label',labels[i]);
      });});
    });
  }
  function stickAct(){
    Array.prototype.forEach.call(document.querySelectorAll('table.mcards'),function(t){
      var w=t.parentElement, over=w&&w.scrollWidth>w.clientWidth+1;
      t.classList.toggle('sticky-act',!!(t._hasAct&&over&&window.innerWidth>640));
    });
  }
  var cardTimer=null;
  function watchTables(){
    var main=document.getElementById('main'); if(!main||!window.MutationObserver)return;
    new MutationObserver(function(){clearTimeout(cardTimer);cardTimer=setTimeout(function(){cardify();stickAct();},30);}).observe(main,{childList:true,subtree:true});
    cardify(); window.__cardify=function(){ cardify(); stickAct(); };
  }

  function init(){
    watchTables();
    cloneMobileRules();
    document.getElementById('themeSeg').addEventListener('click',function(e){
      var b=e.target.closest('button[data-theme-set]'); if(b)setTheme(b.getAttribute('data-theme-set'),true);
    });
    document.getElementById('timeSeg').addEventListener('click',function(e){
      var b=e.target.closest('button[data-tf]'); if(b)setTimeFmt(b.getAttribute('data-tf'),true);
    });
    document.getElementById('viewSeg').addEventListener('click',function(e){
      var b=e.target.closest('button[data-view]'); if(b)applyView(b.getAttribute('data-view'),true);
    });
    setTheme(root.getAttribute('data-theme'),false);
    var v=get('elms_view'); if(v!=='desktop'&&v!=='mobile')v=null;
    if(v)applyView(v,false); else syncButtons();
    window.addEventListener('resize',function(){ stickAct(); if(!get('elms_view'))syncButtons(); measure(); });
    var h=document.querySelector('header.top');
    if(h&&window.ResizeObserver){new ResizeObserver(measure).observe(h);}
    measure(); setTimeout(measure,300);
    tick();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
