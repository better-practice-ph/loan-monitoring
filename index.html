<meta name="theme-color" content="#00111c">
<script>
/* Display preferences (theme + view) applied before first paint */
(function(){
  var root=document.documentElement;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  var t=get('elms_theme'); if(t!=='dark'&&t!=='light')t='light';
  root.setAttribute('data-theme',t);
  var v=get('elms_view');
  if(v==='mobile')root.classList.add('force-mobile');
  var phone=false;
  try{phone=Math.min(screen.width,screen.height)<=820&&window.matchMedia('(pointer:coarse)').matches}catch(e){}
  if(v==='desktop'&&phone){
    var m=document.querySelector('meta[name=viewport]');
    if(m)m.setAttribute('content','width=1100');
  }
})();
</script>

<style>
  /* Better Practice brand palette: navy #001C2C, blue #00ACE7, cyan #64DFFF, grey #F2F2F2 */
  :root{
    --bg:#eef2f5; --panel:#ffffff; --ink:#10222e; --muted:#566a77; --line:#e1e8ee;
    --brand:#001c2c; --brand2:#0b7fb0; --blue:#00ace7; --cyan:#64dfff;
    --sss:#00ace7; --hdmf:#0a3a52;
    --warn:#b45309; --warn-bg:#fef3c7; --ok:#047857; --ok-bg:#d1fae5;
    --danger:#b91c1c; --danger-bg:#fee2e2; --shadow:0 1px 3px rgba(0,28,44,.08),0 1px 2px rgba(0,28,44,.05);
    --radius:12px;
    --font-body:"Source Sans 3","Source Sans Pro","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --font-head:"Libre Franklin","Source Sans 3","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-body);
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;font-weight:700;font-family:var(--font-head);letter-spacing:-.2px}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--brand2);text-decoration:none}
  .hidden{display:none !important}

  /* LOGIN */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#001c2c 0%,#003a52 55%,#00ace7 135%);padding:20px;z-index:50}
  .login-card{background:var(--panel);width:100%;max-width:400px;border-radius:16px;
    box-shadow:0 20px 45px rgba(2,6,23,.35);padding:34px 30px 26px;text-align:center}
  .badge{width:60px;height:60px;border-radius:15px;margin:0 auto 14px;display:flex;align-items:center;
    justify-content:center;background:#fff;border:1px solid var(--line);padding:8px}
  .badge img{width:100%;height:100%;object-fit:contain;display:block}
  .login-card h1{font-size:20px;letter-spacing:.2px}
  .login-card .sub{color:var(--muted);font-size:12.5px;margin:4px 0 22px;text-transform:uppercase;letter-spacing:1.5px}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;background:#fbfcfe;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .pwwrap{position:relative}
  .pwwrap input{padding-right:62px}
  .pwtog{position:absolute;top:50%;right:6px;transform:translateY(-50%);border:none;background:#eef2f7;color:var(--brand);
    font-size:12px;font-weight:650;padding:6px 10px;border-radius:7px;cursor:pointer}
  .pwtog:hover{background:#e2e8f2}
  .mywrap{display:inline-flex;gap:6px}
  .mywrap select{min-width:0}
  .field .mywrap{display:flex} .field .mywrap select{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:9px;padding:10px 15px;font-weight:650;font-size:13.5px;white-space:nowrap}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:#182f6f}
  .btn-primary.full{width:100%;justify-content:center;padding:11px 16px;font-size:14px}
  .btn-ghost{background:#eef2f7;color:var(--ink)}
  .btn-ghost:hover{background:#e2e8f2}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{background:#991b1b}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:7px}
  .login-msg{color:var(--danger);font-size:12.5px;min-height:16px;margin:2px 0 10px;text-align:left}
  .login-foot{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.6}

  /* SHELL */
  #app{min-height:100vh;display:flex;flex-direction:column}
  header.top{background:var(--brand);color:#fff;padding:0 18px;display:flex;align-items:center;gap:12px;
    height:56px;position:sticky;top:0;z-index:40;box-shadow:0 2px 8px rgba(2,6,23,.18)}
  header.top .logo{width:34px;height:34px;border-radius:8px;background:#fff;padding:4px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  header.top .logo img{width:100%;height:100%;object-fit:contain;display:block}
  header.top .title{font-size:15px;font-weight:700;white-space:nowrap;font-family:var(--font-head)}
  header.top .title small{display:block;font-size:10px;opacity:.7;font-weight:500;letter-spacing:1px}
  header.top .spacer{flex:1}
  header.top .who{font-size:12px;opacity:.9;white-space:nowrap}
  header.top .who b{font-weight:650}
  .iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600}
  .iconbtn:hover{background:rgba(255,255,255,.26)}
  .menu{position:relative}
  .menu-pop{position:absolute;right:0;top:40px;background:#fff;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 30px rgba(2,6,23,.2);min-width:210px;padding:6px;z-index:45}
  .menu-pop button{display:flex;width:100%;text-align:left;background:none;border:none;padding:9px 11px;border-radius:7px;
    font-size:13px;color:var(--ink);gap:8px;align-items:center}
  .menu-pop button:hover{background:#f1f5f9}
  .menu-pop hr{border:none;border-top:1px solid var(--line);margin:5px 0}

  nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px;display:flex;gap:2px;
    position:sticky;top:56px;z-index:35;overflow-x:auto}
  nav.tabs button{background:none;border:none;padding:13px 14px;font-size:13.5px;font-weight:600;color:var(--muted);
    border-bottom:2.5px solid transparent;white-space:nowrap}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
  nav.tabs button:hover{color:var(--ink)}

  main{padding:22px;max-width:1300px;width:100%;margin:0 auto;flex:1}
  .view{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:16px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .page-head .ht{flex:1;min-width:200px}
  .page-head h2{font-size:19px}
  .page-head p{color:var(--muted);margin:3px 0 0;font-size:13px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .kpi .val{font-size:23px;font-weight:750;margin-top:6px;letter-spacing:-.5px}
  .kpi .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi.accent-sss{border-top:3px solid var(--sss)}
  .kpi.accent-hdmf{border-top:3px solid var(--hdmf)}
  .kpi.accent-warn{border-top:3px solid var(--warn)}
  .kpi.accent-brand{border-top:3px solid var(--brand)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card h3{font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h3 .tag{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

  .hbar-row{display:grid;grid-template-columns:135px 1fr 100px;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .hbar-row .nm{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar-track{background:#eef2f7;border-radius:6px;height:16px;overflow:hidden}
  .hbar-fill{height:100%;border-radius:6px}
  .hbar-row .amt{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input[type=search],.toolbar select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel)}
  .toolbar input[type=search]{min-width:210px}
  .toolbar .count{color:var(--muted);font-size:12.5px;margin-left:auto}
  .dashfilters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);margin-bottom:16px}
  .dashfilters .toolbar{margin:0}
  .dashfilters label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;flex-direction:column;gap:3px}
  .dashfilters select{min-width:150px}
  .dashfilters .on select{border-color:var(--brand2);background:#eef7fc}

  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:12.8px}
  thead th{background:#f6f8fb;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--ink)}
  thead th .arr{opacity:.5;font-size:9px}
  thead th[aria-sort="ascending"] .arr,thead th[aria-sort="descending"] .arr{opacity:1;color:var(--brand2)}
  thead th.sortable:focus-visible{outline:2px solid var(--brand2);outline-offset:-2px;border-radius:4px}
  tbody td{padding:9px 12px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f8fafd}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.act,th.act{text-align:right;white-space:nowrap}
  .utable td select{width:100%;max-width:340px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--ink)}
  .clickable{cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:650;letter-spacing:.3px}
  .pill.sss{background:#d3f0fb;color:#036b98}
  .pill.hdmf{background:#d6e1e8;color:#0a3a52}
  .pill.type{background:#f1f5f9;color:#475569}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.none{background:#f1f5f9;color:#94a3b8}
  .pill.closed{background:#e2e8f0;color:#475569}
  .var-neg{color:var(--danger);font-weight:650}

  #netBar{top:var(--util-h)}


  /* ===== Tables and pills: comfortable, compact, never squashed ===== */
  main{max-width:min(1600px,100%);padding-left:18px;padding-right:18px}
  .pill{white-space:nowrap;line-height:1.5}
  td.num,th.num{white-space:nowrap}
  td .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;white-space:normal}
  .toolbar input[type=search]{flex:1 1 220px;max-width:380px}
  .tablewrap:has(table.mcards){max-height:calc(100vh - 170px);scrollbar-gutter:stable}
  table.mcards{font-size:12.5px}
  table.mcards thead th{padding:8px 8px;z-index:3;letter-spacing:.3px}
  table.mcards tbody td{padding:6px 8px}
  table.mcards tbody td:first-child{min-width:150px;max-width:240px;font-weight:600}
  table.mcards thead th:first-child,table.mcards tbody td:first-child{position:sticky;left:0;box-shadow:1px 0 0 var(--line)}
  table.mcards tbody td:first-child{z-index:2;background:var(--panel)}
  table.mcards thead th:first-child{z-index:5}
  table.mcards tbody tr:hover td:first-child{background:#f8fafd}
  table.sticky-act thead th:last-child,table.sticky-act tbody td:last-child{position:sticky;right:0;box-shadow:-1px 0 0 var(--line)}
  table.sticky-act tbody td:last-child{z-index:2;background:var(--panel)}
  table.sticky-act thead th:last-child{z-index:5}
  table.sticky-act tbody tr:hover td:last-child{background:#f8fafd}
  table.mcards tbody td .rowbtn{white-space:nowrap;padding:4px 8px;margin-left:3px}
  table.mcards td.act{padding-left:6px;padding-right:8px}
  html[data-theme="dark"] table.mcards thead th:first-child,html[data-theme="dark"] table.sticky-act thead th:last-child{background:#0e1b25}
  html[data-theme="dark"] table.mcards tbody tr:hover td:first-child,html[data-theme="dark"] table.sticky-act tbody tr:hover td:last-child{background:#15283a}
  html[data-theme="dark"] table.mcards tbody tr.bk-ch td:first-child{background:#0f2b3b}

  /* ===== Forced mobile layout on a wide screen: phone-width column ===== */
  html.force-mobile{background:#c9d4dc}
  html.force-mobile body{max-width:440px;margin:0 auto;min-height:100vh;box-shadow:0 0 0 1px rgba(0,28,44,.12),0 12px 48px rgba(0,28,44,.22)}
  html.force-mobile #login,html.force-mobile .modal-bg{inset:0 auto 0 50%;width:min(440px,100%);margin-left:calc(min(440px,100%) / -2)}
  html.force-mobile .modal{max-width:100%}
  html.force-mobile .toast{max-width:420px}

  /* ===== Dark theme ===== */
  html[data-theme="dark"]{color-scheme:dark;
    --bg:#0a141c; --panel:#11202b; --ink:#e5edf3; --muted:#9bb0bf; --line:#243846;
    --brand:#8dd6f5; --brand2:#4cc3f0; --hdmf:#6f9fbd;
    --warn:#f5b73b; --warn-bg:#3a2d0c; --ok:#34d399; --ok-bg:#0d3a2d; --danger:#f87171; --danger-bg:#411a1a;
    --shadow:0 1px 3px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3)}

  html[data-theme="dark"].force-mobile body{box-shadow:0 0 0 1px #1c2e3a,0 12px 48px rgba(0,0,0,.6)}
  html[data-theme="dark"] #utilbar{background:#050d14;border-bottom-color:#1a2b37}
  html[data-theme="dark"] header.top{background:#06283b;border-bottom:1px solid #123a52;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  html[data-theme="dark"] .btn-primary{background:#0b7fb0;color:#fff}
  html[data-theme="dark"] .btn-danger{background:#b91c1c;color:#fff}
  html[data-theme="dark"] .btn-danger:hover{background:#dc2626}
  html[data-theme="dark"] .btn-primary:hover{background:#0e93cf}
  html[data-theme="dark"] .btn-ghost,html[data-theme="dark"] .rowbtn,html[data-theme="dark"] .pwtog{background:#1b2f3d;color:var(--ink)}
  html[data-theme="dark"] .btn-ghost:hover,html[data-theme="dark"] .rowbtn:hover,html[data-theme="dark"] .pwtog:hover{background:#26404f}
  html[data-theme="dark"] .rowbtn.del:hover{background:var(--danger-bg);color:var(--danger)}
  html[data-theme="dark"] #login{background:linear-gradient(135deg,#050d14 0%,#08283b 55%,#0b6a93 135%)}
  html[data-theme="dark"] .login-card{box-shadow:0 20px 45px rgba(0,0,0,.6);border:1px solid var(--line)}
  html[data-theme="dark"] .badge{background:#fff}
  html[data-theme="dark"] input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),
  html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#0c1923;color:var(--ink);border-color:var(--line)}
  html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:#6f8696}
  html[data-theme="dark"] input:disabled,html[data-theme="dark"] select:disabled,
  html[data-theme="dark"] .tyrow input[readonly],html[data-theme="dark"] .tyrow input:disabled,
  html[data-theme="dark"] .bktbl input:disabled,html[data-theme="dark"] .bktbl select:disabled{background:#14222d !important;color:var(--muted) !important}
  html[data-theme="dark"] .menu-pop{background:var(--panel);border-color:var(--line);box-shadow:0 12px 30px rgba(0,0,0,.55)}
  html[data-theme="dark"] .menu-pop button:hover{background:#1b2f3d}
  html[data-theme="dark"] .hbar-track,html[data-theme="dark"] .arseg{background:#1b2f3d}
  html[data-theme="dark"] .arseg button.on{background:#2b4658;color:var(--ink)}
  html[data-theme="dark"] thead th{background:#0e1b25}
  html[data-theme="dark"] tbody td{border-bottom-color:#1a2c39}
  html[data-theme="dark"] tbody tr:hover{background:#15283a}
  html[data-theme="dark"] .pill.sss{background:#0c3a52;color:#7fd8fb}
  html[data-theme="dark"] .pill.hdmf{background:#1c3647;color:#a9cde3}
  html[data-theme="dark"] .pill.type,html[data-theme="dark"] .pill.closed{background:#1f3341;color:#b5c7d3}
  html[data-theme="dark"] .pill.none{background:#1b2c38;color:#7d93a3}
  html[data-theme="dark"] .notice{background:#33270b;border-color:#5b4513;color:#f3c777}
  html[data-theme="dark"] .notice.info{background:#0f2338;border-color:#1e4468;color:#9cc8f5}
  html[data-theme="dark"] .notice[style*="e7f7ef"]{background:#0d3a2d !important;border-color:#17604a !important;color:#7de3bd !important}
  html[data-theme="dark"] select[style*="fbfcfe"]{background:#0c1923 !important;color:var(--ink)}
  html[data-theme="dark"] .attth,html[data-theme="dark"] .attfile{background:#1b2f3d}
  html[data-theme="dark"] .attdrop{background:#0e1b25;border-color:#34505f}
  html[data-theme="dark"] .attdrop.over{background:#0f2b3b}
  html[data-theme="dark"] .remtile{background:#0e1b25}
  html[data-theme="dark"] .remtile.cur{background:#0f2b3b;border-color:#1f6a8d}
  html[data-theme="dark"] .empdd{box-shadow:0 12px 32px rgba(0,0,0,.6)}
  html[data-theme="dark"] .empdd .eo.on,html[data-theme="dark"] .empdd .eo:hover{background:#15354a}
  html[data-theme="dark"] .credbox{background:#0c1923}
  html[data-theme="dark"] tr.sched-due td{background:#33270b}
  html[data-theme="dark"] tr.sched-now td{background:#0f2b3b}
  html[data-theme="dark"] .bktbl tr.bk-ch td{background:#0f2b3b}
  html[data-theme="dark"] .dashfilters .on select{background:#0f2b3b}
  html[data-theme="dark"] .pager select,html[data-theme="dark"] .pager .pg-in{background:#0c1923}
  html[data-theme="dark"] .toast{background:#e5edf3;color:#0a141c}
  html[data-theme="dark"] .modal-bg{background:rgba(2,8,13,.72)}
  html[data-theme="dark"] .modal{border:1px solid var(--line);box-shadow:0 20px 45px rgba(0,0,0,.65)}
  html[data-theme="dark"] .ntprev{background:#fff;color:#10222e}
  html[data-theme="dark"] .ntprev th,html[data-theme="dark"] .ntprev td{color:#10222e;background:#fff}
  html[data-theme="dark"] .ntprev th{background:#f6f8fb}
  html[data-theme="dark"] .ntprev .ph,html[data-theme="dark"] .ntprev .sig{color:#566a77}
  html[data-theme="dark"] svg text[fill="#1a2130"]{fill:#e5edf3}
  html[data-theme="dark"] svg text[fill="#5b6577"],html[data-theme="dark"] svg text[fill="#94a3b8"]{fill:#8aa0af}
  html[data-theme="dark"] svg line[stroke="#e2e7ef"]{stroke:#243846}
  html[data-theme="dark"] img.attth{opacity:.92}
  html[data-theme="dark"] ::-webkit-scrollbar{width:11px;height:11px}
  html[data-theme="dark"] ::-webkit-scrollbar-track{background:#0c1923}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2c4455;border-radius:8px;border:2px solid #0c1923}

  /* Printing always uses the light look, hides the bar and lays reports out cleanly */
  @page{margin:12mm}
  @media print{
    html,body{height:auto !important;background:#fff !important;color:#111 !important}
    #printArea{display:block !important}
    #printArea .print-doc{max-width:100%;padding:0;color:#111;font-size:12px}
    #printArea .print-doc table{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:14px;table-layout:auto;border:0}
    #printArea .print-doc thead{display:table-header-group}
    #printArea .print-doc tfoot{display:table-row-group}
    #printArea .print-doc tr{page-break-inside:avoid;break-inside:avoid}
    #printArea .print-doc th,#printArea .print-doc td{border:1px solid #9aa5ad;padding:4px 6px;text-align:left;vertical-align:top;color:#111;background:#fff;position:static;white-space:normal;overflow-wrap:break-word}
    #printArea .print-doc th{background:#e9edf0 !important;font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #printArea .print-doc td.num,#printArea .print-doc th.num{text-align:right;white-space:nowrap}
    #printArea .print-doc tbody tr:hover{background:#fff}
    #printArea .print-doc .muted,#printArea .print-doc .sub{color:#555}
    #printArea .print-doc .pill{background:none !important;color:#111 !important;padding:0;border:0;font-weight:700}
    #printArea .print-doc h1{font-size:19px;margin:0 0 2px;color:#111}
    #printArea .print-doc h2{font-size:14px;color:#111}

    #utilbar{display:none !important}
    html[data-theme="dark"]{--bg:#fff;--panel:#fff;--ink:#10222e;--muted:#566a77;--line:#e1e8ee;color-scheme:light}
    html.force-mobile body{max-width:none !important;margin:0 !important;box-shadow:none !important}
    html.force-mobile{background:#fff !important}
  }
</style>
<style id="phoneCss">
  /* ===== Phone layout (applies on small screens and in forced Mobile view) ===== */
  @media(max-width:640px){
    /* top bar: one slim row, every button keeps its label */
    #utilbar{padding:0 8px;gap:6px}
    .phclock .pc-lab,.phclock .pc-date,.phclock .pc-live{display:none}
    .phclock .pc-time{font-size:13px;min-width:0}
    .seg{padding:2px;gap:1px;border-radius:9px}
    .seg button{padding:6px 7px;gap:3px;font-size:11px}
    .seg button svg{width:13px;height:13px}
    /* header: logo, title, Data, Log out on one row; "Signed in as" underneath; scrolls away so the tabs stay pinned */
    header.top{position:static;flex-wrap:wrap;height:auto;min-height:0;padding:8px 12px;gap:6px 8px}
    header.top .logo{width:30px;height:30px}
    header.top .title{order:2;flex:1 1 0;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header.top .menu{order:3}
    header.top > .iconbtn[onclick^="openPw"]{display:none}
    header.top > .iconbtn[onclick^="logout"]{order:4}
    header.top .who{order:6;flex:0 0 100%;margin:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    nav.tabs{top:var(--util-h)}
    main{padding:14px 12px}
    /* page headings: title on top, action buttons share the next row */
    .page-head{flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:10px}
    .page-head .ht{flex:1 1 100%;min-width:0}
    .page-head .btn{flex:1 1 calc(50% - 5px);justify-content:center}
    .btn-ghost{box-shadow:inset 0 0 0 1px var(--line)}
    /* nothing may push the page wider than the screen */
    .grid2{grid-template-columns:minmax(0,1fr)}
    .card,.kpi,.fact{min-width:0}
    .hbar-row{grid-template-columns:96px minmax(0,1fr) 84px;gap:8px}
    .tablewrap{max-width:100%}
    .toolbar select{width:auto;flex:1 1 calc(50% - 5px);min-width:0}
    .toolbar input[type=search]{flex:1 1 100%;max-width:none}
    .utable tr{width:auto}
    .utable td select,.utable td input{min-width:0;max-width:62%}
    /* long tables become compact two-column cards */
    .tablewrap:has(table.mcards){background:transparent;border:none;box-shadow:none;overflow:visible;max-height:none !important}
    table.mcards,table.mcards tbody{display:block;width:100%}
    table.mcards thead{display:none}
    table.mcards tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:11px 13px;box-shadow:var(--shadow)}
    table.mcards tr:hover{background:var(--panel)}
    table.mcards td,table.mcards tbody td{display:block;padding:0;border:none;text-align:left;white-space:normal;min-width:0;overflow-wrap:anywhere;position:static !important;box-shadow:none !important;background:transparent !important;max-width:none}
    table.mcards td::before{content:attr(data-label);display:block;font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
    table.mcards td.num{text-align:left}
    table.mcards td:first-child{grid-column:1/-1;font-size:14.5px;font-weight:700;padding-bottom:2px}
    table.mcards td:first-child::before,table.mcards td[data-label=""]::before,table.mcards td.act::before{display:none}
    table.mcards td.act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:10px}
    table.mcards td.act .rowbtn{margin-left:0;flex:1 1 auto;text-align:center;padding:9px 12px;font-size:12.5px}
    table.mcards tr.mc-span{display:block;padding:0}
    table.mcards tr.mc-span td{display:block;padding:14px}
    table.mcards tr.mc-span td::before{display:none}
  }
  @media(max-width:370px){
    .seg button{padding:6px 5px;gap:2px;font-size:10.5px}
  }
</style>
</head>

<script>
/* ===================== MONTHS ===================== */
const MONTH_NAMES=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
// Month handling is arithmetic (no fixed range), so any year works, past or future.
const BASE_YEAR=1990;
function monthNumFromName(mn){ return MONTH_NAMES.indexOf(String(mn||"").trim().toUpperCase()); }
function parseMY(s){ const p=String(s||"").trim().split(/\s+/); const mi=monthNumFromName(p[0]); const yr=parseInt(p[1],10); return (mi>=0&&!isNaN(yr))?{mi,yr}:null; }
const monthIndex=s=>{ const o=parseMY(s); return o?((o.yr-BASE_YEAR)*12+o.mi):-1; };
function monthLabel(idx){ if(idx==null||idx<0)return ""; const mi=((idx%12)+12)%12; const yr=BASE_YEAR+Math.floor(idx/12); return MONTH_NAMES[mi]+" "+yr; }
const nextMonth=s=>{ const i=monthIndex(s); return i>=0?monthLabel(i+1):""; };
function currentMonthName(){const d=new Date();return MONTH_NAMES[d.getMonth()]+" "+d.getFullYear();}
// Reusable Month + Year picker. Year list spans a wide window and always includes the selected/existing year.
function yearList(sel){ const now=new Date().getFullYear(); const set=new Set(); for(let y=now-15;y<=now+30;y++)set.add(y); const o=parseMY(sel); if(o)set.add(o.yr); return [...set].sort((a,b)=>a-b); }
function monthYearPicker(prefix,value,opts){ opts=opts||{}; const o=parseMY(value); const blank=!!opts.allowBlank&&!o; const d=new Date(); const selMi=o?o.mi:d.getMonth(); const selYr=o?o.yr:d.getFullYear(); const oc=opts.onchange?` onchange="${opts.onchange}"`:"";
  const monOpts=(opts.allowBlank?`<option value=""${blank?" selected":""}>Month</option>`:"")+MONTH_NAMES.map((mn,i)=>`<option value="${i}"${(!blank&&i===selMi)?" selected":""}>${mn.charAt(0)+mn.slice(1).toLowerCase()}</option>`).join("");
  const yrOpts=(opts.allowBlank?`<option value=""${blank?" selected":""}>Year</option>`:"")+yearList(value).map(y=>`<option value="${y}"${(!blank&&y===selYr)?" selected":""}>${y}</option>`).join("");
  return `<span class="mywrap"><select id="${prefix}Mon" aria-label="Month"${oc}>${monOpts}</select><select id="${prefix}Yr" aria-label="Year"${oc}>${yrOpts}</select></span>`; }
function readMonthYear(prefix){ const mv=document.getElementById(prefix+"Mon"),yv=document.getElementById(prefix+"Yr"); if(!mv||!yv||mv.value===""||yv.value==="")return ""; const mi=parseInt(mv.value,10); return isNaN(mi)?"":(MONTH_NAMES[mi]+" "+yv.value); }
/* Loan and payment types are editable in Settings (stored in app_settings). These are the built-in defaults;
   PAYMENT_TYPES and AGENCY_TYPES are rebuilt from the saved settings by applyTypes(). */
const DEFAULT_PAYMENT_TYPES=["REGULAR","ADVANCE","ARREARS CATCH-UP","ADJUSTMENT","FULL SETTLEMENT"];
const DEFAULT_LOAN_TYPES={SSS:[{c:"SL",n:"Salary Loan"},{c:"CL",n:"Calamity Loan"}],HDMF:[{c:"MPL",n:"Multi-Purpose Loan"},{c:"CL",n:"Calamity Loan"}]};
const PAYMENT_TYPES=DEFAULT_PAYMENT_TYPES.slice();
const AGENCY_TYPES={};
const loanTypeLabel=x=>x.n?x.c+" - "+x.n:x.c;
Object.keys(DEFAULT_LOAN_TYPES).forEach(ag=>{ AGENCY_TYPES[ag]=DEFAULT_LOAN_TYPES[ag].map(x=>[x.c,loanTypeLabel(x)]); });
const AGENCIES=[["SSS","SSS"],["HDMF","Pag-IBIG (HDMF)"]];

/* ===================== CONNECTION & ERROR HANDLING ===================== */
/* Every request to the database goes through netFetch, so a dropped connection, a timeout or an unreachable server is noticed
   in one place. A banner then says so plainly, saves fail with a clear message instead of "Failed to fetch", the app keeps
   checking in the background, and it reloads the data once the connection is back. */
const NET={down:false,offline:false,restored:false,refreshed:false,dataFail:"",timer:null,hide:null};
const NET_SHORT="No connection to the server, so that did not go through. Check your internet connection and try again.";
const netLike=m=>/failed to fetch|networkerror|network request failed|load failed|fetch failed|network error|timed out|err_internet/i.test(String(m||""));
function friendlyErr(m){ m=String((m&&m.message)?m.message:(m||"")); if(netLike(m))return NET_SHORT;
  if(/jwt expired|invalid jwt|refresh token/i.test(m))return "Your session has expired. Please sign in again."; return m; }
function netPaint(){
  let bar=document.getElementById("netBar"); if(!bar){ bar=document.createElement("div"); bar.id="netBar"; document.body.insertBefore(bar,(document.getElementById("utilbar")||{}).nextSibling||document.body.firstChild); }

function round2(n){return Math.round((n+Number.EPSILON)*100)/100;}

// The full amount that must be repaid over the life of the loan (principal + interest).
// Priority: an explicit total, else amortization x term, else the principal as a fallback.
function obligationOf(l){
  if(typeof l.totalPayable==="number") return l.totalPayable;
  if(typeof l.monthlyAmort==="number" && typeof l.termMonths==="number") return round2(l.monthlyAmort*l.termMonths);
  if(typeof l.loanAmount==="number") return l.loanAmount;
  return null;
}
function loanStats(l){
  const es=entriesForLoan(l);
  let totalPaid=0,monthsPaid=0,lastIdx=-1,lastMonth="none",varRows=0;
  es.forEach(e=>{ const ap=appliedOf(e); totalPaid+=ap; if(ap>0)monthsPaid++;
    const i=monthIndex(e.applicableMonth); if(i>lastIdx){lastIdx=i;lastMonth=e.applicableMonth;}
    if(varianceOf(e)!==0)varRows++; });
  totalPaid=round2(totalPaid);
  const s={entries:es,totalPaid,monthsPaid,lastMonth,lastIdx,varRows};
  const ob=obligationOf(l);
  if(typeof ob==="number"){ s.obligation=ob; s.balance=round2(ob-totalPaid); s.fullyPaid=s.balance<=0; }
  if(typeof l.monthlyAmort==="number"&&l.firstMonth){
    const elapsed=Math.max(0,monthIndex(currentMonthName())-monthIndex(l.firstMonth)+1);
    s.expected=round2(typeof s.obligation==="number"?Math.min(elapsed*l.monthlyAmort,s.obligation):elapsed*l.monthlyAmort); s.advance=round2(totalPaid-s.expected);
    if(typeof s.balance==="number"&&l.monthlyAmort>0&&s.balance>0){ s.monthsToFull=Math.ceil(s.balance/l.monthlyAmort);
      const endIdx=monthIndex(currentMonthName())+s.monthsToFull; if(endIdx>=0)s.projectedEnd=monthLabel(endIdx); }
  }
  return s;
}

}

  const first=monthIndex(l.firstMonth); let last=-1; const have=new Set();
  es.forEach(e=>{const i=monthIndex(e.applicableMonth); have.add(i); if(i>last)last=i;});
  const miss=[]; for(let i=Math.max(first,0);i<=last;i++) if(!have.has(i))miss.push(monthLabel(i));

/* Any list calls pgApply(key, rows): it returns just the rows for the current page and draws the pager into every

const PG={}, PG_SIZES=[25,50,100,200,500];
function pgState(key){ return PG[key]||(PG[key]={page:1,size:PG_SIZES.includes(PREF.pageSize)?PREF.pageSize:50}); }
function pgReset(key){ pgState(key).page=1; }
function pgApply(key,rows){
  const s=pgState(key), n=rows.length, pages=Math.max(1,Math.ceil(n/s.size)); if(s.page>pages)s.page=pages; if(s.page<1)s.page=1;
  const a=(s.page-1)*s.size, part=rows.slice(a,a+s.size), nf=x=>x.toLocaleString(PREF.locale);
  const dis=(c)=>c?" disabled":"";
  const html=n===0?"":`<span class="pg-info">Showing <b>${nf(a+1)}&#8211;${nf(a+part.length)}</b> of <b>${nf(n)}</b></span>
    <span class="pg-ctl"><button class="rowbtn" onclick="pgGo('${key}',1)"${dis(s.page<=1)} title="First page">&laquo;</button><button class="rowbtn" onclick="pgGo('${key}',${s.page-1})"${dis(s.page<=1)}>&lsaquo; Prev</button>
      <span>Page <input class="pg-in" type="text" inputmode="numeric" value="${s.page}" aria-label="Page number" onchange="pgGo('${key}',parseInt(this.value,10)||1)"> of ${nf(pages)}</span>
      <button class="rowbtn" onclick="pgGo('${key}',${s.page+1})"${dis(s.page>=pages)}>Next &rsaquo;</button><button class="rowbtn" onclick="pgGo('${key}',${pages})"${dis(s.page>=pages)} title="Last page">&raquo;</button>
      <select aria-label="Rows per page" onchange="pgSize('${key}',this.value)">${PG_SIZES.map(z=>`<option value="${z}"${z===s.size?" selected":""}>${z} per page</option>`).join("")}</select></span>`;
  document.querySelectorAll(`[data-pager="${key}"]`).forEach(el=>{ el.innerHTML=html; el.style.display=n===0?"none":""; });
  return part; }
const PG_REPAINT={
  loans:()=>{ const b=document.getElementById("loanRows"); if(b)b.innerHTML=loanRowsHTML(); },
  ledger:()=>{ const b=document.getElementById("gRows"); if(b)b.innerHTML=ledgerRowsHTML(); },
  emps:()=>filterEmpRows() };
function pgGo(key,p){ const s=pgState(key); s.page=Math.max(1,p|0); (PG_REPAINT[key]||(()=>{}))();
  const tb=document.querySelector("#main .toolbar"); if(tb)tb.scrollIntoView({block:"start"}); }
function pgSize(key,v){ const z=parseInt(v,10); if(!PG_SIZES.includes(z))return; PREF.pageSize=z; savePrefs(); Object.keys(PG).forEach(k=>{ PG[k].size=z; PG[k].page=1; }); (PG_REPAINT[key]||(()=>{}))(); }
function pgDebounce(fn,ms){ let t; return function(){ clearTimeout(t); t=setTimeout(fn,ms); }; }
function loanMatch(l,q){ /* search a loan by employee, company ID, email, loan reference, type, agency or notes; every word must match */
  const toks=empNorm(q).split(/\s+/).filter(Boolean); if(!toks.length)return true;
  const hay=empNorm(empHay(l.employee)+" "+(l.reference||"")+" "+(l.loanType||"")+" "+agencyDisp(l.agency)+" "+(l.notes||"")); return toks.every(t=>hay.includes(t)); }

Object.defineProperty(SORTS.activity,"dir",{get:()=>ACT.dir,set:v=>{ACT.dir=v;}}); // newest first by default
const sortF=(key,col)=>{ const S=SORTS[key]; return S.fields.find(f=>f[0]===(col||S.col))||S.fields[0]; };
const sortDirLabel=key=>SORT_KIND[sortF(key)[2]][SORTS[key].dir>0?0:1];
const sortNote=key=>"sorted by "+sortF(key)[1].toLowerCase()+", "+sortDirLabel(key);
function sortBtnInner(key){ const d=SORTS[key].dir>0; return `<span class="sar">${d?"&#9650;":"&#9660;"}</span> ${d?"Ascending":"Descending"} <span class="sdl">${sortDirLabel(key)}</span>`; }
function sortCtl(key,cls){ const S=SORTS[key];
  return `<span class="sortctl${cls?" "+cls:""}" data-sk="${key}"><label for="sc_${key}">Sort by</label><select id="sc_${key}" onchange="sortPick('${key}',this.value)">${S.fields.map(f=>`<option value="${f[0]}"${f[0]===S.col?" selected":""}>${esc(f[1])}</option>`).join("")}</select><button type="button" class="btn btn-ghost btn-sm sortdir" onclick="sortFlip('${key}')" title="Switch between ascending and descending">${sortBtnInner(key)}</button></span>`; }
function sortHd(key,col,label,cls){ const S=SORTS[key]; return sortTh(label,S.col===col?S.dir:0,`sortHdr('${key}','${col}')`,{kind:sortF(key,col)[2],cls:cls||""}).replace("<th",`<th data-sh="${key}:${col}"`); }
function sortRefresh(key){ const S=SORTS[key]; document.querySelectorAll(`[data-sk="${key}"]`).forEach(w=>{ const sel=w.querySelector("select"), b=w.querySelector("button"); if(sel)sel.value=S.col; if(b)b.innerHTML=sortBtnInner(key); }); }
function sortApply(key){ const S=SORTS[key]; if(S.page)pgReset(S.page); sortRefresh(key); if(S.redraw)S.redraw(); }
function sortPick(key,col){ SORTS[key].col=col; sortApply(key); }
function sortFlip(key){ SORTS[key].dir*=-1; sortApply(key); }
function sortHdr(key,col){ const S=SORTS[key]; if(S.col===col)S.dir*=-1; else{S.col=col;S.dir=1;} sortApply(key); const h=document.querySelector(`[data-sh="${key}:${col}"]`); if(h)h.focus(); }
/* data sort: empty values always go last; ties fall back to `tie` then to the original order */
function sortRows(key,rows,get,tie){ const S=SORTS[key], g=get[S.col]||get[S.fields[0][0]], d=S.dir, idx=new Map(rows.map((r,i)=>[r,i]));
  return rows.slice().sort((a,b)=>{ let x=g(a), y=g(b); const nx=x==null||x===""||(typeof x==="number"&&isNaN(x)), ny=y==null||y===""||(typeof y==="number"&&isNaN(y));
    if(nx||ny){ if(nx&&ny)return (tie?tie(a,b):0)||idx.get(a)-idx.get(b); return nx?1:-1; }
    const c=(typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:"base"});
    return c?c*d:((tie?tie(a,b):0)||idx.get(a)-idx.get(b)); }); }
/* DOM sort for tables whose rows hold live inputs or are paged in the browser (rows carry data-s-<field> attributes) */
function sortDom(key,tbody,rowSel,tieCols){ if(!tbody)return; const S=SORTS[key], text=sortF(key)[2]==="text", d=S.dir, rows=[...tbody.querySelectorAll(rowSel)]; if(rows.length<2)return;
  const idx=new Map(rows.map((r,i)=>[r,i])), at=(r,c)=>r.getAttribute("data-s-"+c), cmpT=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:"base"});
  rows.sort((a,b)=>{ let x=at(a,S.col), y=at(b,S.col); const nx=x===null||x==="", ny=y===null||y==="";
    const tie=()=>{ for(const c of (tieCols||[])){ const k=cmpT(at(a,c)||"",at(b,c)||""); if(k)return k; } return idx.get(a)-idx.get(b); };
    if(nx||ny)return (nx&&ny)?tie():(nx?1:-1);
    const c=text?cmpT(x,y):Number(x)-Number(y); return c?c*d:tie(); });
  rows.forEach(r=>tbody.appendChild(r)); }

/* ===================== EMPLOYEE PICKER ===================== */
/* Any <input class="empcombo"> becomes a dropdown of all employees that can also be searched by name, company ID or email.
   data-mode="pick"   : value must be a real employee (used in forms); data-blank="1" allows empty, data-blanklabel sets its text.
   data-mode="search" : free-text filter box; picking a name just fills the box and fires "input". */
const empNorm=v=>String(v==null?"":v).toLowerCase().trim();
function empCid(n){ return (STORE.empCid||{})[n]||""; }
/* Employment status. "Active" = Probationary + Regular; everything else is inactive. */
const EMP_STATUS=[["probationary","Probationary","sss","active"],["regular","Regular","ok","active"],["end_of_contract","End of contract","closed","inactive"],["terminated","Terminated","danger","inactive"],["resigned","Resigned","warn","inactive"],["retired","Retired","hdmf","inactive"]];
const empStKey=n=>(STORE.empStatus||{})[n]||"";
const empStRow=n=>EMP_STATUS.find(x=>x[0]===empStKey(n));
const empStatusLabel=n=>{ const r=empStRow(n); return r?r[1]:""; };
const empIsInactive=n=>{ const r=empStRow(n); return !!r&&r[3]==="inactive"; };
const empStatusPill=n=>{ const r=empStRow(n); return r?`<span class="pill ${r[2]}">${r[1]}</span>`:""; };
/* Warning shown when work is started for someone who has left (resigned, terminated, retired, end of contract). */
let INACT_ACK="";
function updInactiveHint(boxId,emp){ INACT_ACK=""; const b=document.getElementById(boxId); if(!b)return;
  if(emp&&empIsInactive(emp)){ b.style.display=""; b.innerHTML=`<b>${esc(emp)} is ${esc(empStatusLabel(emp))}.</b> You can still continue, for example for a final deduction or settlement, but check before proceeding.`; }
  else { b.style.display="none"; b.innerHTML=""; } }
function inactiveGate(emp,msgEl,what){ if(!empIsInactive(emp)||INACT_ACK===emp)return true; INACT_ACK=emp;
  msgEl.textContent=`${emp} is ${empStatusLabel(emp)}. Press the button again to ${what} anyway.`;
  const bt=document.querySelector(".modal .foot .btn-primary"); if(bt&&!/anyway/i.test(bt.textContent))bt.textContent=bt.textContent+" anyway"; return false; }
function empHay(n){ return empNorm(n+" "+empCid(n)+" "+((STORE.empEmail||{})[n]||"")+" "+empStatusLabel(n)); }
function empMatches(name,q){ q=empNorm(q); if(!q) return true; const h=empHay(name); return q.split(/\s+/).every(t=>h.includes(t)); }
/* exact name = exact match; otherwise treat the text as a search (name / company ID / email) */
function empFilterMatch(name,v){ v=empNorm(v); if(!v) return true; if((STORE.employees||[]).some(e=>empNorm(e)===v)) return empNorm(name)===v; return empMatches(name,v); }
function empCombo(id,opts){ opts=opts||{}; const v=opts.value||"";
  return `<input id="${id}" class="empcombo ${opts.cls||""}" type="${opts.mode==="search"?"search":"text"}" autocomplete="off" spellcheck="false" data-mode="${opts.mode||"pick"}"${opts.blank?` data-blank="1" data-blanklabel="${esc(opts.blankLabel||"")}"`:""} data-committed="${esc(v)}" value="${esc(v)}" placeholder="${esc(opts.placeholder||"Select or search name / company ID")}" ${opts.oninput?`oninput="${opts.oninput}"`:""} ${opts.onchange?`onchange="${opts.onchange}"`:""}>`; }
const EDD={el:null,input:null,items:[],idx:-1,dirty:false};
function eddBox(){ if(!EDD.el){ const d=document.createElement("div"); d.className="empdd"; d.id="empDD";
  d.addEventListener("mousedown",e=>{ e.preventDefault(); const o=e.target.closest(".eo"); if(o) eddPick(o.dataset.v); }); document.body.appendChild(d); EDD.el=d; } return EDD.el; }
function eddPlace(){ const i=EDD.input,d=eddBox(); if(!i)return; const r=i.getBoundingClientRect();
  const below=window.innerHeight-r.bottom, h=Math.min(280,d.scrollHeight||280);
  d.style.left=r.left+"px"; d.style.width=Math.max(r.width,260)+"px";
  if(below<h+12 && r.top>below){ d.style.top="auto"; d.style.bottom=(window.innerHeight-r.top+4)+"px"; d.style.maxHeight=Math.min(280,r.top-12)+"px"; }
  else { d.style.bottom="auto"; d.style.top=(r.bottom+4)+"px"; d.style.maxHeight=Math.min(280,below-12)+"px"; } }
function eddRender(){ const i=EDD.input,d=eddBox(); if(!i)return;
  const q=EDD.dirty?i.value:"", cur=i.dataset.committed||"", blank=i.dataset.blank==="1";
  const all=(STORE.employees||[]).slice().sort((a,b)=>a.localeCompare(b));
  const hit=all.filter(n=>empMatches(n,q)); const LIM=150, shown=hit.slice(0,LIM);
  EDD.items=[]; let h="";
  if(blank&&!q){ EDD.items.push(""); h+=`<div class="eo eblank" data-v="">${esc(i.dataset.blanklabel||"(none)")}</div>`; }
  shown.forEach(n=>{ EDD.items.push(n); const c=empCid(n), em=(STORE.empEmail||{})[n]||"";
    h+=`<div class="eo${n===cur?" cur":""}" data-v="${esc(n)}"><b>${esc(n)}</b>${(c||em||empStatusLabel(n))?`<span class="es">${esc([c?"ID "+c:"",empStatusLabel(n),em].filter(Boolean).join(" · "))}</span>`:""}</div>`; });
  if(!shown.length) h+=i.dataset.mode==="search"?`<div class="ehint">No employee by that name. The table is filtered by "${esc(i.value)}" across OR no., remarks, month and more.</div>`:`<div class="ehint">No employee matches "${esc(i.value)}".</div>`;
  else if(hit.length>LIM) h+=`<div class="ehint">Showing ${LIM} of ${hit.length}. Keep typing to narrow the list.</div>`;
  d.innerHTML=h; d.style.display="block"; eddPlace();
  EDD.idx=EDD.dirty?(EDD.items.length?0:-1):Math.max(0,EDD.items.indexOf(cur)); eddMark(true); }
function eddMark(scroll){ const d=eddBox(); d.querySelectorAll(".eo").forEach((o,k)=>o.classList.toggle("on",k===EDD.idx));
  if(scroll){ const o=d.querySelectorAll(".eo")[EDD.idx]; if(o) o.scrollIntoView({block:"nearest"}); } }
function eddClose(){ if(EDD.el)EDD.el.style.display="none"; EDD.input=null; EDD.dirty=false; }
function eddPick(v){ const i=EDD.input; if(!i)return; const search=i.dataset.mode==="search";
  i.value=v; i.dataset.committed=v; eddClose();
  i.dispatchEvent(new Event(search?"input":"change",{bubbles:true})); if(!search)i.blur(); }
function eddSettle(i){ /* on leaving a pick-mode box, snap to a valid employee */
  if(i.dataset.mode!=="pick")return; const t=empNorm(i.value);
  const exact=(STORE.employees||[]).find(n=>empNorm(n)===t);
  if(exact){ i.value=exact; i.dataset.committed=exact; return; }
  if(!t&&i.dataset.blank==="1"){ i.dataset.committed=""; return; }
  const part=t?(STORE.employees||[]).filter(n=>empMatches(n,t)):[]; /* a single unambiguous match (e.g. a company ID) is accepted */
  if(part.length===1){ i.value=part[0]; i.dataset.committed=part[0]; return; }
  i.value=i.dataset.committed||""; }
document.addEventListener("focusin",e=>{ const i=e.target; if(!i.classList||!i.classList.contains("empcombo"))return;
  EDD.input=i; EDD.dirty=false; eddRender(); if(i.select&&i.dataset.mode==="pick")try{i.select();}catch(x){} });
document.addEventListener("click",e=>{ const i=e.target; if(i.classList&&i.classList.contains("empcombo")&&EDD.input!==i){ EDD.input=i; EDD.dirty=false; eddRender(); } });
document.addEventListener("input",e=>{ const i=e.target; if(!i.classList||!i.classList.contains("empcombo"))return;
  if(EDD.input!==i)EDD.input=i; EDD.dirty=true; eddRender(); });
document.addEventListener("keydown",e=>{ const i=e.target; if(!i.classList||!i.classList.contains("empcombo"))return;
  const open=EDD.el&&EDD.el.style.display==="block";
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!open){EDD.input=i;EDD.dirty=false;eddRender();return;}
    const n=EDD.items.length; if(!n)return; EDD.idx=(EDD.idx+(e.key==="ArrowDown"?1:-1)+n)%n; eddMark(true); }
  else if(e.key==="Enter"){ if(open&&EDD.idx>=0&&EDD.items.length){ e.preventDefault(); eddPick(EDD.items[EDD.idx]); } }
  else if(e.key==="Escape"){ if(open){ e.preventDefault(); e.stopPropagation(); eddSettle(i); eddClose(); } } },true);
document.addEventListener("focusout",e=>{ const i=e.target; if(!i.classList||!i.classList.contains("empcombo"))return; eddSettle(i); setTimeout(()=>{ if(document.activeElement!==i) eddClose(); },0); });
window.addEventListener("resize",()=>{ if(EDD.input)eddPlace(); });
document.addEventListener("scroll",e=>{ if(EDD.input&&!(EDD.el&&EDD.el.contains(e.target)))eddPlace(); },true);

function viewUsers(){

/* ===================== FINAL PAY / CLEARANCE ===================== */
/* Inactive employees (end of contract, terminated, resigned, retired) and what they still owe on active loans. */
function clearanceData(show){
  const by={}; STORE.loans.forEach(l=>{ if(empIsInactive(l.employee)) (by[l.employee]=by[l.employee]||[]).push(l); });
  const all=Object.keys(by).map(name=>{
    const active=by[name].filter(l=>l.status==="active"); let remaining=0,paid=0,unknown=0,deduction=0;
    const items=active.map(l=>{ const s=loanStats(l); paid+=s.totalPaid; const bal=(typeof s.balance==="number")?Math.max(0,s.balance):null;
      if(bal===null)unknown++; else remaining+=bal; if(typeof l.monthlyAmort==="number")deduction+=l.monthlyAmort; return {l,s,bal}; });
    remaining=round2(remaining); paid=round2(paid);
    const state=(remaining>0.005)?"owes":(unknown?"unknown":"cleared");
    return {name,key:empStKey(name),label:empStatusLabel(name),cid:empCid(name),email:(STORE.empEmail||{})[name]||"",items,remaining,paid,unknown,deduction:round2(deduction),state}; })
    .sort((a,b)=>b.remaining-a.remaining||a.name.localeCompare(b.name));
  const rows=(show==="all")?all:all.filter(r=>r.state!=="cleared");
  return {all,rows,total:round2(rows.reduce((t,r)=>t+r.remaining,0)),loans:rows.reduce((t,r)=>t+r.items.length,0),unknown:rows.filter(r=>r.state==="unknown").length}; }
const CLR_G={remaining:r=>r.remaining,employee:r=>r.name,status:r=>r.label,loans:r=>r.items.length,deduction:r=>r.deduction,paid:r=>r.paid,clearance:r=>r.state};
function clearanceFiltered(){
  const g=id=>(document.getElementById(id)||{}).value||"";
  const d=clearanceData(g("clShow")||"owing"), st=g("clStatus"), q=g("clSearch");
  const rows=sortRows("clearance",d.rows.filter(r=>(!st||r.key===st)&&empMatches(r.name,q)),CLR_G,(a,b)=>a.name.localeCompare(b.name));
  return Object.assign({},d,{rows,total:round2(rows.reduce((t,r)=>t+r.remaining,0)),loans:rows.reduce((t,r)=>t+r.items.length,0),unknown:rows.filter(r=>r.state==="unknown").length,filtered:rows.length!==d.rows.length}); }
const clearPill=r=>r.state==="owes"?'<span class="pill danger">Owes balance</span>':(r.state==="unknown"?'<span class="pill warn">Balance incomplete</span>':'<span class="pill ok">Cleared</span>');

function actTs(r){ const v=r.created_at||r.inserted_at||r.logged_at||r.timestamp||r.at||null; const t=v?new Date(v).getTime():NaN; return isNaN(t)?null:t; }

function fmtWhen(ts){ if(ts==null)return {abs:"\u2013",rel:""};

/* ---- trend charts ---- */
const PESO="\u20B1", fmt2=v=>PESO+v.toLocaleString(PREF.locale,{minimumFractionDigits:2});
function monthSeries(maps){ // maps: array of {idx:value}; returns contiguous index range
  const all=[]; maps.forEach(m=>Object.keys(m).forEach(k=>all.push(+k))); if(!all.length)return null;
  const start=Math.min(...all), end=Math.max(...all); const out=[]; for(let i=start;i<=end;i++)out.push(i); return out; }
function monthLabs(shown,x0,bw,H){ return shown.map((i,k)=>{ if(shown.length>10&&k%3!==0)return ""; const [mn,yr]=monthLabel(i).split(" ");
  return `<text x="${x0+k*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="#94a3b8">${mn.slice(0,3)} ${yr.slice(2)}</text>`; }).join(""); }
function stackedBars(idxs,A,B,nameA,nameB,unit){ // B at the bottom (Pag-IBIG), A on top (SSS)
  const shown=DASH.range?idxs.slice(-DASH.range):idxs, W=520,H=150,pad=24,bw=(W-pad*2)/shown.length;
  const tot=i=>(A[i]||0)+(B[i]||0), max=Math.max(...shown.map(tot),1), sc=v=>v/max*(H-pad*2);
  const bars=shown.map((i,k)=>{ const hb=sc(B[i]||0), ha=sc(A[i]||0), x=pad+k*bw+2, w=bw-4;
    const tip=`${monthLabel(i)}: ${unit(tot(i))} (${nameA} ${unit(A[i]||0)}, ${nameB} ${unit(B[i]||0)})`;
    return `<g><title>${tip}</title><rect x="${x}" y="${H-pad-hb}" width="${w}" height="${hb}" fill="var(--hdmf)"/><rect x="${x}" y="${H-pad-hb-ha}" width="${w}" height="${ha}" rx="2" fill="var(--sss)"/></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e2e7ef"/>${bars}${monthLabs(shown,pad,bw,H)}</svg>
    <div class="legend"><span><span class="dot" style="background:var(--sss)"></span>${nameA}</span><span><span class="dot" style="background:var(--hdmf)"></span>${nameB}</span>
    <span style="margin-left:auto">peak ${unit(max)}</span></div>`; }
function trendSVG(E){
  const S={},P={}; E.forEach(e=>{ const i=monthIndex(e.applicableMonth); if(i<0)return; const l=loanById(e.loanId); if(!l)return; const m=l.agency==="SSS"?S:P; m[i]=round2((m[i]||0)+appliedOf(e)); });
  const idxs=monthSeries([S,P]); if(!idxs)return '<p class="muted">No payments recorded for this selection.</p>';
  return stackedBars(idxs,S,P,"SSS","Pag-IBIG",fmt2); }
function cumSVG(E){
  const T={}; E.forEach(e=>{ const i=monthIndex(e.applicableMonth); if(i>=0)T[i]=round2((T[i]||0)+appliedOf(e)); });
  const all=monthSeries([T]); if(!all)return '<p class="muted">No payments recorded for this selection.</p>';
  let run=0; const cum={}; all.forEach(i=>{ run=round2(run+(T[i]||0)); cum[i]=run; });
  const shown=DASH.range?all.slice(-DASH.range):all, W=520,H=150,pad=24, max=Math.max(run,1), n=shown.length, step=n>1?(W-pad*2)/(n-1):0;
  const X=k=>n>1?pad+k*step:W/2, Y=v=>H-pad-(v/max)*(H-pad*2);
  const pts=shown.map((i,k)=>`${X(k).toFixed(1)},${Y(cum[i]).toFixed(1)}`).join(" ");
  const area=n>1?`<polygon points="${X(0)},${H-pad} ${pts} ${X(n-1)},${H-pad}" fill="var(--sss)" opacity=".12"/>`:"";
  const dots=shown.map((i,k)=>`<circle cx="${X(k).toFixed(1)}" cy="${Y(cum[i]).toFixed(1)}" r="3" fill="var(--sss)"><title>${monthLabel(i)}: ${fmt2(cum[i])} paid to date</title></circle>`).join("");
  const labs=shown.map((i,k)=>{ if(n>10&&k%3!==0)return ""; const [mn,yr]=monthLabel(i).split(" "); return `<text x="${X(k)}" y="${H-8}" text-anchor="middle" font-size="8.5" fill="#94a3b8">${mn.slice(0,3)} ${yr.slice(2)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e2e7ef"/>${area}<polyline points="${pts}" fill="none" stroke="var(--sss)" stroke-width="2"/>${dots}${labs}</svg>
    <div class="hintline" style="text-align:right">paid to date ${fmt2(run)}</div>`; }
function startsSVG(L){
  const S={},P={}; L.forEach(l=>{ const i=monthIndex(l.firstMonth); if(i<0)return; const m=l.agency==="SSS"?S:P; m[i]=(m[i]||0)+1; });
  const idxs=monthSeries([S,P]); if(!idxs)return '<p class="muted">No loans with a first deduction month for this selection.</p>';
  return stackedBars(idxs,S,P,"SSS","Pag-IBIG",v=>v+" loan"+(v===1?"":"s")); }

/* ===================== AMORTIZATION SCHEDULE ===================== */
// Remaining schedule: starts the month after the last recorded payment (or the first amortization
// month if nothing is recorded), deducts the monthly amortization, and ends with the exact remainder.
function amortSchedule(l){
  if(l.status==="closed") return {status:"closed"};
  const s=loanStats(l);
  if(typeof s.balance!=="number") return {status:"nobalance"};
  if(s.balance<=0.005) return {status:"paid"};
  let amort=(typeof l.monthlyAmort==="number"&&l.monthlyAmort>0)?l.monthlyAmort:null, derived=false;
  if(amort==null&&typeof l.totalPayable==="number"&&l.termMonths>0){ amort=round2(l.totalPayable/l.termMonths); derived=true; }
  if(!amort) return {status:"noamort"};
  const firstIdx=monthIndex(l.firstMonth);
  let start; if(s.lastIdx>=0) start=s.lastIdx+1; else if(firstIdx>=0) start=firstIdx; else return {status:"nostart"};
  if(firstIdx>=0&&start<firstIdx) start=firstIdx;
  const curIdx=monthIndex(currentMonthName());
  const rows=[]; let bal=s.balance, i=start, n=0;
  while(bal>0.005&&n<600){
    const pay=round2(Math.min(amort,bal)); bal=round2(bal-pay); n++;
    rows.push({n,idx:i,month:monthLabel(i),due:nextMonth(monthLabel(i)),amount:pay,balance:Math.max(0,bal),partial:pay<amort-0.005,
      state:i<curIdx?"past":(i===curIdx?"now":"")});
    i++;
  }
  const pastDue=rows.filter(r=>r.state==="past");
  return {status:"ok",rows,amort,derived,balance:s.balance,pastDue:pastDue.length,pastDueAmt:round2(pastDue.reduce((a,r)=>a+r.amount,0)),
    behind:(typeof s.advance==="number"&&s.advance<0)?Math.abs(s.advance):0,truncated:n>=600&&bal>0.005};
}

/* ===================== INTEREST & AMORTIZATION CALCULATOR ===================== */
/* Estimates from principal, annual rate and term. The agency's own amortization table stays the official figure
   (day counts, rounding and fees can differ), so this is a cross-check and a planning tool. */
const CALC_METHODS=[["dim","Diminishing balance (standard amortization)"],["addon","Add-on / flat rate"],["none","No interest"]];
const calcMethodLabel=m=>(CALC_METHODS.find(x=>x[0]===(m||"dim"))||CALC_METHODS[0])[1];
function calcPlan(P,rate,n,method,startIdx){
  P=Number(P); n=Math.round(Number(n)); rate=Math.max(0,Number(rate)||0); method=method||"dim"; if(method==="none")rate=0;
  if(!(P>0)||!(n>0)||n>600)return null;
  const rows=[], lab=k=>(startIdx>=0?monthLabel(startIdx+k-1):"Payment "+k); let totInt=0,totPay=0,pmt;
  if(method==="addon"||rate===0){ // interest is a flat share of the principal, spread evenly
    const total=round2(P*(1+rate/100*n/12)); pmt=round2(total/n); const intAll=round2(total-P); let bal=total,intSum=0;
    for(let k=1;k<=n;k++){ const pay=(k===n)?round2(bal):pmt, it=(k===n)?round2(intAll-intSum):round2(intAll/n); intSum=round2(intSum+it); bal=round2(bal-pay);
      rows.push({k,month:lab(k),payment:pay,interest:it,principal:round2(pay-it),balance:Math.max(0,bal)}); totInt+=it; totPay+=pay; }
  } else { // diminishing balance: interest each month on what is still owed
    const r=rate/1200; pmt=round2(P*r/(1-Math.pow(1+r,-n))); let bal=P;
    for(let k=1;k<=n;k++){ const it=round2(bal*r); let pay=pmt; if(k===n||pay>=bal+it)pay=round2(bal+it); const pr=round2(pay-it); bal=round2(bal-pr);
      rows.push({k,month:lab(k),payment:pay,interest:it,principal:pr,balance:Math.max(0,bal)}); totInt+=it; totPay+=pay; if(bal<=0.005)break; }
  }
  return {pmt,rows,method:(rate===0&&method!=="none")?method:method,balLabel:(method==="addon"?"Balance to pay":"Balance (principal)"),
    totalInterest:round2(totInt),totalPayable:round2(totPay),principal:P,rate,n,payoffIdx:startIdx>=0?startIdx+rows.length-1:-1};
}
function calcSim(P,rate,pmt,opt){ // diminishing balance with an optional extra amount each month and one lump sum
  opt=opt||{}; const r=rate/1200, rows=[]; let bal=round2(P),k=0,totInt=0,totPay=0;
  while(bal>0.005&&k<1200){ k++; const it=round2(bal*r); const sh=opt.short&&k>=opt.short.from&&k<=opt.short.to; let pay=(sh?opt.short.amt:pmt)+(opt.extra||0)+((opt.lump&&k===opt.lumpAt)?opt.lump:0);
    if(pay>=bal+it)pay=round2(bal+it); const pr=round2(pay-it); bal=round2(bal-pr); totInt+=it; totPay+=pay;
    rows.push({k,payment:round2(pay),interest:it,principal:pr,balance:Math.max(0,bal)}); }
  return {rows,months:k,totalInterest:round2(totInt),totalPaid:round2(totPay),paidOff:bal<=0.005}; }
/* What the ledger says versus the schedule: interest builds on whatever is unpaid, so short or late months cost more
   and extra or early months cost less. Months with nothing recorded count as missed up to last month. */
function calcActual(l,plan){
  const start=monthIndex(l.firstMonth); if(start<0)return {status:"nostart"};
  const cur=monthIndex(currentMonthName()), es=entriesForLoan(l), paidBy={}; let lastPaid=-1,paidTotal=0;
  es.forEach(e=>{ const i=monthIndex(e.applicableMonth); if(i<0)return; paidBy[i]=round2((paidBy[i]||0)+appliedOf(e)); paidTotal=round2(paidTotal+appliedOf(e)); if(i>lastPaid)lastPaid=i; });
  const end=Math.max(lastPaid,cur-1); if(end<start)return {status:"notstarted"};
  const rows=[], months=end-start+1, kNow=Math.min(months,plan.rows.length);
  const schedBal=kNow>=plan.rows.length?0:(kNow>0?plan.rows[kNow-1].balance:plan.principal);
  const schedInt=round2(plan.rows.slice(0,kNow).reduce((t,x)=>t+x.interest,0)), schedPaid=round2(plan.rows.slice(0,kNow).reduce((t,x)=>t+x.payment,0));
  const useAmort=(typeof l.monthlyAmort==="number"&&l.monthlyAmort>0)?l.monthlyAmort:plan.pmt;
  if(plan.method==="addon"||plan.rate===0){
    const remaining=Math.max(0,round2(plan.totalPayable-paidTotal)), left=Math.ceil(remaining/useAmort-1e-9);
    return {status:"ok",kind:"flat",paidTotal,remaining,balance:remaining,schedBal:Math.max(0,round2(plan.totalPayable-schedPaid)),ahead:round2(paidTotal-schedPaid),
      monthsLeft:left,payoffIdx:remaining>0.005?end+left:end,useAmort,rows,months}; }
  const r=plan.rate/1200; let bal=plan.principal,intAcc=0,k=0,payoffAt=-1;
  for(let i=start;i<=end&&k<1200;i++){ k++; const it=round2(bal*r), paid=paidBy[i]||0, nb=round2(bal+it-paid); intAcc=round2(intAcc+it);
    const sp=plan.rows[k-1]; rows.push({idx:i,month:monthLabel(i),paid,interest:it,balance:Math.max(0,nb),sched:sp?sp.payment:0,schedBal:sp?sp.balance:0});
    bal=Math.max(0,nb); if(bal<=0.005&&payoffAt<0)payoffAt=i; if(bal<=0.005)break; }
  const base=calcSim(bal,plan.rate,useAmort,{});
  return {status:"ok",kind:"dim",paidTotal,balance:round2(bal),schedBal,ahead:round2(schedBal-bal),interestAccrued:intAcc,schedInt,extraInterest:round2(intAcc-schedInt),
    monthsLeft:base.months,remainInterest:base.totalInterest,payoffIdx:bal<=0.005?(payoffAt>=0?payoffAt:end):end+base.months,useAmort,rows,months,base,
    unpaidMonths:rows.filter(x=>x.paid<=0.005&&x.idx<cur).length}; }
function calcInitFor(id){ const l=loanById(id); if(!l)return {};
  return {P:typeof l.loanAmount==="number"?l.loanAmount:null,R:typeof l.interestRate==="number"?l.interestRate:null,N:l.termMonths||null,method:l.interestMethod||"dim",first:l.firstMonth||""}; }
/* tolerance: up to 1 peso per month of difference is treated as rounding */
function calcChecks(){
  return STORE.loans.filter(l=>l.status!=="closed"&&typeof l.loanAmount==="number"&&l.loanAmount>0&&l.termMonths>0&&typeof l.interestRate==="number").map(l=>{
    const plan=calcPlan(l.loanAmount,l.interestRate,l.termMonths,l.interestMethod||"dim",monthIndex(l.firstMonth)); if(!plan)return null;
    const flags=[], rec=obligationOf(l);
    if(typeof l.monthlyAmort==="number"&&Math.abs(l.monthlyAmort-plan.pmt)>1)flags.push("amort");
    if(typeof l.totalPayable==="number"&&Math.abs(l.totalPayable-plan.totalPayable)>Math.max(5,l.termMonths))flags.push("total");
    return {l,plan,flags,rec}; }).filter(Boolean); }
function calcCheckSection(){
  const rows=calcChecks().filter(x=>x.flags.length); if(!STORE.hasRate)return ""; 
  const body=rows.map(x=>`<tr class="clickable" onclick="openLoan('${x.l.id}')"><td><b>${esc(x.l.employee)}</b></td><td>${agencyPill(x.l.agency)} ${typePill(x.l.loanType)}</td>
    <td>${esc(x.l.interestRate)}% ${esc(calcMethodLabel(x.l.interestMethod).split(" (")[0])}, ${x.l.termMonths} mo</td>
    <td class="num">${typeof x.l.monthlyAmort==="number"?peso(x.l.monthlyAmort):'<span class="muted">&#8211;</span>'}<span class="sub">computed ${peso(x.plan.pmt)}</span></td>
    <td class="num">${typeof x.l.totalPayable==="number"?peso(x.l.totalPayable):'<span class="muted">&#8211;</span>'}<span class="sub">computed ${peso(x.plan.totalPayable)}</span></td>

function ccRead(){ const P=ccNum("ccP"),R=ccNum("ccR"),N=ccNum("ccN"),X=ccNum("ccX")||0,L=ccNum("ccL")||0,K=Math.max(1,Math.round(ccNum("ccK")||1)), M=document.getElementById("ccM").value, F=readMonthYear("ccF")||"";

function ccRecalc(){

/* Early payoff quote: what it takes to settle in full right after payment no. Q.
   Diminishing balance: the principal still owed (future interest is not charged).
   Add-on: the remaining installments less an estimated rebate of unearned interest (Rule of 78). Agencies differ, so confirm with them. */
function ccQuote(plan,Q){
  if(typeof Q!=="number"||!(Q>=1))return ""; Q=Math.round(Q); const rows=plan.rows, n=rows.length;
  const fact=(l,v,c)=>`<div class="fact"><div class="l">${l}</div><div class="v ${c||""}">${v}</div></div>`;
  if(Q>=n) return `<div class="notice info" style="margin:12px 0 0">Payment no. ${Q} is the last scheduled payment, so there is nothing left to settle early. Enter a number below ${n}.</div>`;
  const bal=rows[Q-1].balance, m=n-Q, remPay=round2(rows.slice(Q).reduce((t,x)=>t+x.payment,0)), paid=round2(rows.slice(0,Q).reduce((t,x)=>t+x.payment,0));

  if(addon){ const rebate=round2(plan.totalInterest*m*(m+1)/(n*(n+1))); payoff=round2(bal-rebate); saved=rebate;

  else if(plan.rate>0) note="On a diminishing-balance loan, settling early stops further interest, so the amount to settle is the principal still owed after that payment. A real payoff can add a few days of accrued interest.";
  else note="This loan carries no interest, so settling early shortens the loan but saves nothing.";
  return `<div class="hintline" style="margin:12px 0 6px"><b>Early payoff quote</b> &middot; settling in full right after payment no. ${Q} (${esc(rows[Q-1].month)})</div>
    <div class="facts" style="margin:0">${fact("Amount to settle",peso(payoff))}${fact("Payments you skip",m)}${fact(addon?"Interest rebate (estimate)":"Interest saved",peso(saved),saved>0.005?"var-pos":"")}${fact("Paid before settling",peso(paid))}${fact("Total cost if settled",peso(round2(paid+payoff)))}</div>
    <div class="hintline" style="margin:6px 0 0">${note}</div>`; }

    const ahead=a.ahead, aheadTxt=Math.abs(ahead)<0.005?"on schedule":(ahead>0?"ahead":"behind");

      <label style="font-size:12px;color:var(--muted)">Extra every month (&#8369;)<br><input id="wiX" type="text" inputmode="decimal" placeholder="0" style="width:130px;padding:7px 10px;border:1px solid var(--line);border-radius:8px" oninput="updWhatIf('${l.id}')"></label>

async function postMonthInner(){

    if(fr.error){ pmEl.classList.remove("ok"); pmEl.textContent="Could not check for payments already posted, so nothing was posted: "+(fr.error.message||fr.error)+" Try again."; return; }
    const taken=rows.filter(r=>fr.map.has(dupKey(r.loan_id,r.applicable_month)));
    if(taken.length){
      const who=taken.map(r=>{ const l=loanById(r.loan_id)||{}; return esc(l.employee||"?")+" ("+agencyDisp(l.agency)+" "+esc(l.loanType||"")+")"; });
      const list=who.slice(0,6).join(", ")+(who.length>6?" and "+(who.length-6)+" more":""), left=rows.length-taken.length;
      if(!left){ confirmModal("Already posted for "+esc(month),`Every row in this batch was already posted for ${esc(month)} (${list}), probably by someone else or from another tab. Nothing was posted twice. The page will refresh.`,null,"OK"); await reloadRender(); return; }
      confirmModal(taken.length+" loan"+(taken.length>1?"s":"")+" already posted for "+esc(month),`Since this page was opened, ${list} ${taken.length>1?"were":"was"} already posted for ${esc(month)}. ${taken.length>1?"They":"It"} will be skipped and the other ${left} will be posted.`,(()=>{ postMonth._skip=new Set(taken.map(r=>r.loan_id)); postMonth(); }),null,"Post the other "+left);
      return; } }
  const gone=[...new Set(rows.map(r=>(loanById(r.loan_id)||{}).employee).filter(n=>n&&empIsInactive(n)))];
  if(gone.length&&!postMonth._ok){

  const {error}=await sb.from("ledger_entries").insert(rows); if(error){ const pm=document.getElementById("postMsg"); pm.classList.remove("ok"); pm.textContent="Post failed: "+error.message+typeErrHint(error); return; }

function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadTemplate(){
  if(!need("pay"))return;
  const month=readMonthYear('pM')||currentMonthName();
  const active=STORE.loans.filter(l=>l.status==="active").sort((a,b)=>a.employee.localeCompare(b.employee)||a.agency.localeCompare(b.agency));
  const head=["Employee","Agency","LoanType","Reference","Month","First15","Second15","Total","PaymentType"];
  const lines=[head.join(",")];
  active.forEach(l=>lines.push([csvCell(l.employee),l.agency,l.loanType,csvCell(l.reference||""),month,"","","","REGULAR"].map(csvCell).join(",")));
  const blob=new Blob([lines.join("\r\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="deduction-template-"+month.replace(/\s+/g,"-")+".csv"; a.click(); URL.revokeObjectURL(a.href);
  toast("Template downloaded, fill the amount columns then Import CSV");
}
function parseCSV(text){
  const rows=[]; let i=0,f="",row=[],q=false; text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue; }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f="";i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=c;i++; }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function importDeductions(ev){
  if(!need("pay"))return;
  const file=ev.target.files[0]; if(!file)return; const rd=new FileReader();
  rd.onload=()=>{ ev.target.value="";
    const rows=parseCSV(rd.result); if(rows.length<2){toast("That file has no data rows");return;}
    const hdr=rows[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9]/g,""));
    const col=n=>hdr.indexOf(n);
    const ci={emp:col("employee"),ag:col("agency"),lt:col("loantype"),ref:col("reference"),mo:col("month"),h1:col("first15"),h2:col("second15"),tot:col("total"),pt:col("paymenttype")};
    if(ci.emp<0||ci.mo<0){toast("File needs at least Employee and Month columns");return;}
    const pn=v=>{v=String(v||"").replace(/[₱,\s]/g,"").trim(); if(v==="")return null; const n=Number(v); return isNaN(n)?null:round2(n);};
    const normAg=a=>{a=String(a||"").toUpperCase(); return (a.includes("PAG")||a==="HDMF")?"HDMF":"SSS";};
    const items=[], seen=new Set();
    for(let k=1;k<rows.length;k++){ const r=rows[k];
      const emp=(r[ci.emp]||"").trim(); if(!emp)continue;
      const ag=normAg(r[ci.ag]); const lt=(r[ci.lt]||"").trim().toUpperCase();
      const ref=ci.ref>=0?(r[ci.ref]||"").trim():"";
      const mo=(r[ci.mo]||"").trim().toUpperCase();
      const h1=pn(r[ci.h1]),h2=pn(r[ci.h2]),tot=pn(r[ci.tot]);
      const pt=ci.pt>=0?((r[ci.pt]||"").trim().toUpperCase()||"REGULAR"):"REGULAR";
      if(h1===null&&h2===null&&tot===null)continue;
      let loan=STORE.loans.find(l=>l.employee.toLowerCase()===emp.toLowerCase()&&l.agency===ag&&l.loanType===lt&&(ref?(l.reference||"").toLowerCase()===ref.toLowerCase():true));
      if(!loan) loan=STORE.loans.find(l=>l.employee.toLowerCase()===emp.toLowerCase()&&l.agency===ag&&l.loanType===lt);
      let status,loanId=null,note="",differs=false; const applied=(typeof tot==="number")?tot:round2((h1||0)+(h2||0));
      if(monthIndex(mo)<0) status="bad month";
      else if(!loan) status="no matching loan";
      else { loanId=loan.id; const key=dupKey(loan.id,mo), ex=STORE.entries.find(e=>e.loanId===loan.id&&e.applicableMonth===mo);
        if(seen.has(key)){ status="repeated in file"; note="this loan and month appears earlier in the file"; }
        else if(ex){ status="already posted"; const was=appliedOf(ex); differs=Math.abs(was-applied)>0.005; note="recorded "+peso(was)+(differs?", file says "+peso(applied):""); }
        else status="will post";
        seen.add(key); }
      items.push({emp,ag,lt,mo,h1,h2,tot,pt,status,loanId,note,differs});
    }
    previewImport(items);
  };
  rd.readAsText(file);
}
function previewImport(items){
  const willPost=items.filter(x=>x.status==="will post");
  const skipped=items.filter(x=>x.status==="already posted").length, dupFile=items.filter(x=>x.status==="repeated in file").length, differs=items.filter(x=>x.differs).length;
  const bad=items.filter(x=>x.status==="no matching loan"||x.status==="bad month").length;
  window.__importQueue=willPost;
  const body=items.map(x=>{ const applied=(typeof x.tot==="number")?x.tot:round2((x.h1||0)+(x.h2||0));
    const tone=x.status==="will post"?"ok":(x.status==="already posted"&&!x.differs?"none":"warn");
    return `<tr><td>${esc(x.emp)}</td><td>${x.ag==='SSS'?'SSS':'Pag-IBIG'} ${esc(x.lt)}</td><td>${esc(x.mo)}</td><td class="num">${peso(applied)}</td><td><span class="pill ${tone}">${x.status}</span>${x.note?`<span class="sub">${esc(x.note)}</span>`:""}</td></tr>`;}).join("");
  modal(`<h3>Import preview</h3>
    <p class="hintline" style="margin-bottom:10px"><b>${willPost.length}</b> will be posted &middot; ${skipped} already posted (skipped) &middot; ${dupFile} repeated in the file (skipped) &middot; ${bad} could not be matched. Matching uses employee name, agency, and loan type.</p>
    ${(differs||dupFile)?`<div class="notice" style="margin-bottom:10px">${differs?`<b>${differs} already-posted row${differs>1?"s have":" has"} a different amount than the file.</b> Nothing is overwritten; fix those in the ledger if the file is right. `:""}${dupFile?`<b>${dupFile} row${dupFile>1?"s repeat":" repeats"} a loan and month earlier in the file.</b> Only the first is used.`:""}</div>`:""}
    <div class="tablewrap" style="box-shadow:none;max-height:50vh"><table><thead><tr><th>Employee</th><th>Loan</th><th>Month</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>${body||'<tr><td colspan="5" class="muted" style="padding:14px">No rows with amounts found.</td></tr>'}</tbody></table></div>
    <div class="form-msg" id="impMsg"></div>
    <div class="foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="commitImport()" ${willPost.length?'':'disabled'}>Post ${willPost.length} payment${willPost.length!==1?'s':''}</button></div>`,"wide");
}
async function commitImportInner(){
  if(!need('pay'))return;
  const q0=window.__importQueue||[]; if(!q0.length){ closeModal(); return; }
  const fr=await freshEntries(q0.map(x=>({loanId:x.loanId,month:x.mo}))), im=document.getElementById("impMsg");
  if(fr.error){ if(im)im.textContent="Could not check for payments already posted, so nothing was imported: "+(fr.error.message||fr.error)+" Try again."; return; }
  const q=q0.filter(x=>!fr.map.has(dupKey(x.loanId,x.mo))), clash=q0.length-q.length;
  if(!q.length){ window.__importQueue=null; closeModal(); toast("Nothing imported: every row was already posted since the preview"); await reloadRender(); return; }
  const rows=q.map(x=>({loan_id:x.loanId,applicable_month:x.mo,or_ref:null,first15:x.h1,second15:x.h2,total_recorded:x.tot,payment_type:x.pt,remarks:"imported from spreadsheet"}));
  const {error}=await sb.from("ledger_entries").insert(rows); if(error){ toast("Import failed: "+error.message+typeErrHint(error)); return; }
  window.__importQueue=null; logAudit("import","ledger",rows.length); closeModal(); toast(`Imported ${rows.length} payment${rows.length!==1?'s':''}`+(clash?`, skipped ${clash} already posted since the preview`:"")); await reloadRender();
}
async function commitImport(){ if(commitImport._busy)return; commitImport._busy=true; try{ await commitImportInner(); } finally{ commitImport._busy=false; } }


/* ===================== DUPLICATE PAYMENT GUARD ===================== */
/* Rule: one payment entry per loan per applicable month. Every write (single entry, Post Month, Import) re-checks the
   database right before saving, so a second user, a second tab or a double click cannot add a repeat. */
let EF_ID=null;
const dupKey=(loanId,month)=>loanId+"|"+month;
async function freshEntries(pairs){ // pairs [{loanId,month}] -> {map: key -> [entries already in the database], error}
  const map=new Map(); if(!pairs.length)return {map,error:null};
  const loanIds=[...new Set(pairs.map(p=>p.loanId))], months=[...new Set(pairs.map(p=>p.month))];
  for(let i=0;i<loanIds.length;i+=100){ const ids=loanIds.slice(i,i+100);
    const res=await fetchAll(()=>sb.from("ledger_entries").select("*").in("loan_id",ids).in("applicable_month",months).order("id"));
    if(res.error)return {map,error:res.error};
    res.data.forEach(r=>{ const e=rowToEntry(r), k=dupKey(e.loanId,e.applicableMonth); if(!map.has(k))map.set(k,[]); map.get(k).push(e); }); }
  return {map,error:null}; }
function updDupHint(){ const b=document.getElementById("efDup"); if(!b)return;
  const lo=document.getElementById("efLoan"), m=readMonthYear("efM"); if(!lo||!m){ b.style.display="none"; return; }
  const ex=STORE.entries.find(x=>x.id!==EF_ID&&x.loanId===lo.value&&x.applicableMonth===m);
  if(ex){ b.style.display=""; b.innerHTML=`<b>${esc(m)} is already recorded on this loan</b> (${peso(appliedOf(ex))}, ${esc(ex.paymentType)}${ex.orRef?", OR "+esc(ex.orRef):""}). A second entry for the same month will not be saved. <button class="btn btn-ghost btn-sm" onclick="closeModal();editEntry('${ex.id}')">Open that entry</button>`; }
  else b.style.display="none"; }
function dupGroups(){ const m=new Map(); STORE.entries.forEach(e=>{ const k=dupKey(e.loanId,e.applicableMonth); if(!m.has(k))m.set(k,[]); m.get(k).push(e); });
  return [...m.values()].filter(g=>g.length>1).map(g=>({l:loanById(g[0].loanId),month:g[0].applicableMonth,entries:g})).filter(x=>x.l)
    .sort((a,b)=>a.l.employee.localeCompare(b.l.employee)||monthIndex(a.month)-monthIndex(b.month)); }
function dupSection(){
  const g=dupGroups(), n=g.reduce((t,x)=>t+x.entries.length,0), canPay=caps().pay;
  const rows=g.map(x=>x.entries.map((e,i)=>`<tr><td>${i===0?`<b>${esc(x.l.employee)}</b>`:""}</td><td>${i===0?`${agencyPill(x.l.agency)} ${typePill(x.l.loanType)}`:""}</td><td>${i===0?esc(x.month):""}</td>
      <td class="num"><b>${peso(appliedOf(e))}</b></td><td>${esc(e.paymentType)}</td><td>${e.orRef?esc(e.orRef):'<span class="muted">&#8211;</span>'}</td><td class="muted">${e.remarks?esc(e.remarks):""}</td>
      <td class="act">${canPay?`<button class="rowbtn" onclick="editEntry('${e.id}')">Edit</button><button class="rowbtn del" onclick="deleteEntry('${e.id}')">Delete</button>`:""}</td></tr>`).join("")).join("");
  if(!g.length) return `<div class="card" style="margin-bottom:18px"><h3>Duplicate payments <span class="tag">same loan and month</span></h3><p class="hintline" style="margin:4px 0 0">None found. Every loan has at most one payment per month.</p></div>`;
  return `<div class="card" style="margin-bottom:18px"><h3>Duplicate payments <span class="tag">${g.length} loan-month${g.length>1?"s":""}, ${n} entries</span></h3>
    <div class="notice" style="margin:8px 0 12px"><b>These months are counted more than once, which inflates totals and hides arrears.</b> Keep the correct entry and delete the extras, or change the month of one that was dated wrongly.</div>
    <div class="tablewrap" style="box-shadow:none;max-height:420px"><table><thead><tr><th>Employee</th><th>Loan</th><th>Month</th><th class="num">Applied</th><th>Type</th><th>OR / Ref</th><th>Remarks</th><th class="act"></th></tr></thead><tbody>${rows}</tbody></table></div></div>`; }

function remitData(month){
  const rows=STORE.entries.filter(e=>e.applicableMonth===month).map(e=>({e,l:loanById(e.loanId)})).filter(x=>x.l);
  const sss=rows.filter(x=>x.l.agency==="SSS"), hdmf=rows.filter(x=>x.l.agency==="HDMF");
  const sum=arr=>round2(arr.reduce((a,x)=>a+appliedOf(x.e),0));
  return {rows,sss,hdmf,sssTot:sum(sss),hdmfTot:sum(hdmf),grand:sum(rows)};
}
function renderRemit(){
  const month=readMonthYear('rM')||currentMonthName(), d=remitData(month);
  document.getElementById("remitBox").innerHTML=`
    <div class="kpis" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:12px">
      <div class="kpi accent-sss"><div class="lab">SSS</div><div class="val" style="font-size:18px">${peso(d.sssTot)}</div><div class="hint">${d.sss.length} loans</div></div>
      <div class="kpi accent-hdmf"><div class="lab">Pag-IBIG</div><div class="val" style="font-size:18px">${peso(d.hdmfTot)}</div><div class="hint">${d.hdmf.length} loans</div></div>
